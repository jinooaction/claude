# 공개 데이터 수집 채널 설정 (4단계 계획 ④ — 연구 전용)
#
# 4차(운영자 선택, 2026-06-11): 공식 키리스 조합 — 미 재무부 금리 + Cboe VIX +
# BLS 거시(+DBnomics 미러 교차 검증). Stooq 는 실측에서 실행기 IP 차단(JS
# 장벽)이 확정돼 수집에서 빼고 탐침으로만 추적한다. FRED 그래프 CSV 는
# httpx 기본 user-agent 로 DGS2/DGS10 금리만 연구 수집에 승격한다.
# FRED 공식 API 키 경로는 키 등록 전까지 탐침/후속 선택지로만 남긴다.
# 가격 일봉 이력 확장은 보류 — 가격 소스는 KIS 백필이 유지한다(운영자 결정).
# 격리 원칙: 이 채널의 산출물은 연구·백테스트·검증 전용 — 라이브 매매 신호는
# 계속 KIS 데이터(price_bars)만 사용한다. 수집은 collect-public-data.yml 이
# GitHub Actions 실행기에서 돌리고 automation/public-data 사이드카로 발행한다.

[collection]
# 첫 실측(2026-06-11, run 27380895825) 교훈: FRED 타르핏(연결 후 30초 무응답)
# × 재시도 4회 × 7시리즈 ≈ 15분 → 작업 제한 초과. 요청 타임아웃을 짧게,
# 재시도 1회, 전체 벽시계 예산으로 발행 스텝 도달을 보장한다.
# 3차 실측: 채택 소스 4곳 모두 0.1~0.7초 즉답 — 예산은 여유분이다.
request_timeout_seconds = 15
max_retries = 1
time_budget_seconds = 480

[probes]
# 소스 경로 탐침 — 매 런이 측정 장비가 된다. 각 주소를 채널 UA / httpx 기본 UA
# 두 가지로 두드려 상태·지연·첫 바이트를 summary 에 기록(수 KB 만 읽고 끊음).
# 3차 실측(2026-06-11): 재무부 200/186ms, Cboe 200/64ms, DBnomics 200/717ms,
# BLS v1 200/161ms — 전부 즉답. Stooq=JS 장벽, FRED 공식 API=키만 있으면
# 열림(400 즉답). FRED 그래프 CSV DGS2/DGS10은 아래 [fred] 수집 자체가
# 매일의 측정이므로 탐침 중복 호출에서 제외한다.
urls = [
    "https://stooq.com/q/d/l/?s=spy.us&i=d",                     # Stooq 직접 CSV (실측: JS 봇 장벽 — 해제되면 가격 이력 확장 재논의)
    "https://api.stlouisfed.org/fred/series/observations?series_id=DGS10&file_type=json",  # FRED 공식 API (키 등록 시 열림 — 보류 중)
]
# DBnomics 연준 H.15 10년 금리 탐침은 증거 수집을 마치고(2026-06-12 실측 200/0.4~0.7초)
# 아래 [dbnomics] 수집 + [[cross_checks]] 짝으로 채택 — 수집 자체가 매일의 측정이다.

[treasury]
# 미 재무부 일일 금리 곡선 — 공식 다운로드 경로, 연 단위 CSV 를 합쳐 만기별
# 시계열로 발행. 금리·금리차는 레짐 분석(경기침체 선행)의 핵심 입력.
years_back = 10
min_rows = 1500           # 10년치 영업일 ≈ 2500 — 절반 이하면 수집이 깨진 것
max_staleness_days = 7

[treasury.maturities]
# 원본 CSV 열 이름 → 발행 식별자 (treasury/<ID>.csv)
"2 Yr" = "UST2Y"
"10 Yr" = "UST10Y"

[treasury.spread]
# 파생 시리즈: 10년-2년 금리차 (FRED T10Y2Y 대체 — 두 만기에서 직접 계산)
id = "UST10Y2Y"
long = "10 Yr"
short = "2 Yr"

[fred]
# FRED 그래프 CSV — 키 불필요 공개 엔드포인트. candidate-facf2fa31834 증거에서
# 채널 UA 는 timeout, httpx 기본 UA 는 200으로 확인되어 DGS2/DGS10에만
# 명시적으로 기본 UA 를 쓴다. 연구 전용이며 라이브 신호 입력이 아니다.
series = ["DGS2", "DGS10"]
min_rows = 1500
max_staleness_days = 7
user_agent = "httpx-default"

[cboe]
# Cboe VIX 공식 이력 (1990년~, 단일 CSV) — 종가 시계열로 발행.
# 첫 실측(2026-06-12): 1990년대 초 원본에 OHLC 정합 깨진 행 존재(원본 특성).
# 연구가 쓰는 건 종가뿐이라 종가만 발행한다.
vix = true
min_rows = 1000
max_staleness_days = 7

[bls]
# BLS 공공 API v1 — 키 불필요, 대신 최근 약 3년만 준다(정직한 한계).
# 깊은 이력이 필요해지면 BLS v2 키 등록(무료)이 후속 선택지.
series = [
    "LNS14000000",   # 실업률 (월간, 계절조정)
    "CUUR0000SA0",   # 소비자물가지수 CPI-U (월간, 미조정 — DBnomics 미러와 짝)
]
min_rows = 12
max_staleness_days = 70   # 월간 발표는 ~45일 늦음 — 느슨하게

[dbnomics]
# DBnomics 공개 집계 API — 공식 통계 미러. CPI 를 BLS 직접 수집과 대조해
# 전송 경로의 조용한 변질(절단·인코딩·단위 오류)을 잡는 교차 검증 짝.
# 첫 실측(2026-06-12): 이 미러는 마지막 관측이 2025-01 로 ~17개월 지연.
# 미러의 역할은 신선도가 아니라 **겹치는 과거 구간의 일치** — 신선도 한도를
# 분리해 느슨하게 둔다(최신 데이터는 BLS 직접 수집이 담당).
series = [
    "BLS/cu/CUUR0000SA0",         # CPI-U 미러 (bls:CUUR0000SA0 의 짝)
    "FED/H15/RIFLGFCY02_N.B",     # 연준 H.15 2년 국채 금리 (treasury:UST2Y 의 짝)
    "FED/H15/RIFLGFCY10_N.B",     # 연준 H.15 10년 국채 금리 (treasury:UST10Y 의 짝)
]
min_rows = 12
max_staleness_days = 700

[[cross_checks]]
# 같은 통계의 원본(BLS 직접) vs 미러(DBnomics) 수준 대조 — 같은 값이어야
# 정상이므로 합격선 100%. 독립 측정은 아니지만 전송 경로 오염은 잡는다.
kind = "levels"
a = "bls:CUUR0000SA0"
b = "dbnomics:BLS/cu/CUUR0000SA0"
tolerance = "0.001"
min_overlap = 12
min_agree_pct = "100"

[[cross_checks]]
# 재무부 직접 수집 vs 연준 H.15(DBnomics 미러) — 금리의 진짜 두-기관 대조.
# H.15 의 국채 항목은 재무부 일일 금리 곡선을 그대로 싣는 같은 통계(둘 다
# 소수 2자리)라 수준이 일치해야 정상. CPI 미러(100%)와 달리 합격선을 99.5%
# 로 두는 이유: 일간 시계열 ~10년 ≈ 2,500 관측에서 재무부의 사후 정정이
# 미러에 반영되기 전의 시차로 며칠은 정당하게 어긋날 수 있다 — 체계적
# 오염(단위·절단·인코딩)은 대량 불일치로 나타나므로 99.5% 로도 충분히 잡힌다.
kind = "levels"
a = "treasury:UST2Y"
b = "dbnomics:FED/H15/RIFLGFCY02_N.B"
tolerance = "0.001"
min_overlap = 60
min_agree_pct = "99.5"

[[cross_checks]]
kind = "levels"
a = "treasury:UST10Y"
b = "dbnomics:FED/H15/RIFLGFCY10_N.B"
tolerance = "0.001"
min_overlap = 60
min_agree_pct = "99.5"

[[cross_checks]]
# 재무부 직접 수집 vs FRED 그래프 CSV — 같은 H.15 계열 금리의 두 공개 경로 대조.
# FRED 는 DBnomics 와 다른 전송 경로라 조용한 절단·헤더·날짜 정렬 오류를 한 번
# 더 잡는다. 합격선은 DBnomics H.15 대조와 동일하게 99.5%.
kind = "levels"
a = "treasury:UST2Y"
b = "fred:DGS2"
tolerance = "0.001"
min_overlap = 60
min_agree_pct = "99.5"

[[cross_checks]]
kind = "levels"
a = "treasury:UST10Y"
b = "fred:DGS10"
tolerance = "0.001"
min_overlap = 60
min_agree_pct = "99.5"
