# 스펙 140 — 라이브 캐너리 **포트폴리오** 설정 (시간 분리 검증된 고정등가중 앙상블).
#
# 운영자 결정 경로:
#   - 2026-06-04: 옛 3종목 top_n=1(SPY·MSFT·AAPL) 무장 해제 — "AAPL 1주 실거래 검증은 의미없어.
#     좁은 3종목 1위 매수는 세계 최고 수준 아님. 우선순위: 유니버스 확대 + 절대 기대수익 게이트
#     → 넓은 forward 페이퍼로 검증 후 재무장."
#   - 2026-06-10: "forward 검증 후 자동 무장." → 이 파일을 *검증된 앙상블*로 재지정한다.
#
# ── 무엇이 바뀌었나 (검증=무장 정합성) ──────────────────────────────────────────
# 이 설정의 [portfolio]/[portfolio.trend_filter] 전략 블록은 forward 페이퍼에서 누적·검증 중인
# deploy/global-trend-fixed-portfolio.toml 과 **전략 지문이 동일**하다 —
# 같은 유니버스(SPY·IEF·GLD), 같은 균등가중, 같은 다중 속도 추세 앙상블
# (스펙 048, [63,126,189,252]). 즉 **paper 에서 검증한 바로 그 전략을 라이브 캐너리로 무장**한다.
# 스펙 049 자동 무장 게이트(forward-edge-autoarm.yml)가 이 지문 일치를 무장 전 강제한다 —
# 검증하지 않은 전략은 절대 무장하지 않는다.
#
# 왜 이 전략인가 (검증된 길):
#   주식(SPY)+채권(IEF)+금(GLD) 3자산 GTAA다. 각 자산은 3·6·9·12개월 추세 중 상승 신호의
#   비율만큼 노출하고 나머지는 현금으로 둔다. 1971~2006 개발 구간과 2007~2026 홀드아웃을
#   분리하고 연 50bp 비용을 차감한 결과를 같은 균등가중 설정으로 다시 계산해 검증한다.
#
# ── 정직한 소액 한계 (자본 vs 정수 주) ─────────────────────────────────────────
# ⚠ 캐너리는 *실거래 체결 파이프라인*(KIS 라우팅·체결·정합성·NAV·서킷 브레이커)을 최소 위험으로
#   검증하는 단계(헌법 VI 2단계)이지, 전략 엣지를 복제하는 단계가 아니다(엣지는 paper forward 가
#   이미 검증). 소액에선 정수 주 제약으로 모든 다리가 안 들어갈 수 있다. 균등 목표액이 한 주
#   가격보다 작으면 해당 자산 주문은 생기지 않으며, on_insufficient=cash 라 이력 부족·추세
#   아래면 현금으로 남는다. 이는 주문을 억지로 만들지 않는 탐색 캐너리의 의도된 한계다.
#
# ── 라이브 안전장치 ────────────────────────────────────────────────────────────
#   ① 신호 집합은 SPY·IEF·GLD 그대로다. 체결만 사전등록한 저가 ETF
#      SCHX·SPTI·IAUM으로 1:1 매핑한다. KIS 조정 일봉 252개 동등성 감사와 현재 NAV의
#      정수 주 미리보기가 모두 통과해야 첫 자본을 열며, 실패하면 단 0을 유지한다.
#   ② 추세 앙상블 방어 — 추세 아래 비율만큼 현금(드로다운 방어).
#   ③ 스펙 014 손실 서킷 브레이커가 킬스위치(일손실·총낙폭 한도 → halt_gate 가 주문 거부).
#   ④ K1 캡이 천장. ⑤ 헌법 X.4 자본 사다리에서 탐색 단 2는 실계좌 NAV의 20%가 천장.
#   ⑥ rebalance-live-canary.yml: 무장 머지(push)는 미리보기만, 실주문은 시장시간 스케줄에서만.
#
# 헌법 X.4 v11.0.0: 이 설정은 먼저 NAV 10% 운영 검증 캐너리로만 열리며, 깨끗한 전진
# 알파 관문 없이는 20% 탐색 단으로 오르지 못한다. 25% 이상은 원래의 EDGE_CONFIRMED 조건과
# 현재 단의 라이브 증거를 다시 충족해야 한다.

[caps]
# 소액 캐너리용 보수 캡. 종목당 60%·전체 100%와 외부 자본 사다리의 현재 단 한도를 함께 적용한다.
# canary_capital_pct는 첫 주문 재검사가 단 1의 NAV 10% 계약과 대조하는 이중 선언이다.
# 실제 주문 자본은 이 값만 믿지 않고 센티넬·최신 NAV·정수 주 미리보기로 다시 계산한다.
per_trade_pct                  = 50.0
per_symbol_pct                 = 60.0
global_exposure_pct            = 100.0
canary_capital_pct             = 10.0
canary_min_duration_days       = 10
canary_acceptance_drawdown_pct = 3.0

[whitelist]
# 주문 가능한 종목은 체결 ETF 3개뿐이다. 기준 신호 ETF는 주문 화이트리스트에 넣지 않는다.
symbols     = ["SCHX", "SPTI", "IAUM"]
accounts    = ["${KIS_ACCOUNT_NO}"]
order_types = ["LIMIT"]
sessions    = ["REGULAR"]

[account_rebalance]
# 라이브 미리보기와 실주문은 내부 모의 원장이 아니라 KIS 실제 보유·현금을 필수로 읽는다.
# 명시적 청산 종목은 없다. ORANY 등 비관리 보유는 기록만 하고 자동 매도하지 않는다.
enabled             = true
liquidation_symbols = []
cash_buffer_pct     = "0.01"

[execution]
# 신호·전략 지문은 SPY/IEF/GLD 그대로, 실제 주문만 저가 1:1 대체 ETF로 보낸다.
symbol_map  = { SPY = "SCHX", IEF = "SPTI", GLD = "IAUM" }
lot_rounding = "nearest"

# ── [portfolio]·[portfolio.trend_filter]: global-trend-fixed-portfolio.toml 과 지문 동일 ──
# 1971~2006 개발과 2007~2026 홀드아웃을 분리하고 연 50bp 비용을 차감한 정확한
# 3·6·9·12개월 앙상블이다. 단 1 탐색 진입도 지문이 다르면 BLOCKED다.
[portfolio]
id            = "global-trend-fixed"
universe      = ["SPY", "IEF", "GLD"]
weights       = { momentum = "1.0" }   # top_n=3 라 점수는 순위에 무영향(셋 다 보유)
weight_scheme = "equal"
top_n         = 3
rebalance_mode             = "hold_replace"
invested_fraction          = "0.99"
rebalance_every_n_sessions = 21
lookback_bars              = 200   # 공통 가격 이력 확보 창
momentum_period            = 120
rebalance_threshold_pct    = "2.0"
min_notional_usd           = "20"

# 다중 속도 추세 앙상블(스펙 048) — 각 자산이 자기 추세 위 비율만큼만 노출, 나머지 현금.
# 균등 목표에 추세 비율을 적용한다. on_insufficient=cash: 이력 없으면 보유 안 함.
[portfolio.trend_filter]
method          = "sma"
lookback        = 200
on_insufficient = "cash"
ensemble_windows = [63, 126, 189, 252]
