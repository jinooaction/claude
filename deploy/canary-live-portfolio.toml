# 스펙 039 — 라이브 캐너리 **포트폴리오** 설정 ($500 소액 실거래 무장본).
#
# 운영자 결정(2026-06-04): "지금 소액 라이브 캐너리 무장, 자본 $500."
#
# 현재 실거래(라이브 캐너리)는 canary-live-rules.toml = 단순 3룰 qty=1 이다. 스펙 032~038 의
# 고도화(포트폴리오 재조정·다요인·추세 필터·forward 판정·칼마)는 전부 페이퍼였다. 이 파일은
# 그 고도화를 **$500 소액 실거래**로 올린다 — `rebalance-once --mode live --confirm-live`.
#
# ⚠ $500 의 현실 (정직): 이 종목들은 주당 비싸다(SPY ~$540, MSFT ~$430, AAPL ~$316). 정수
# 주만 살 수 있으므로 $500 로는 **가장 싼 1종목 1주**만 들어간다(top-2 포트폴리오는 ~$750+
# 필요). 그래서 이 무장본은 **top_n=1** — 합성 점수 1위이면서 추세 위인(=추세 필터 통과)
# 단일 우량주 1주를 보유하고, 추세 아래면 현금으로 빠진다. 고도화(팩터 랭킹 + 추세 방어)가
# 실제 돈에 적용되는 최소 형태다. 자본을 키우면(센티넬 capital_usd) top_n·캡을 함께 올려
# top-2 포트폴리오로 확장한다.
#
# ⚠ 캡이 자본에 맞춰 큼(이유): per_trade/per_symbol/global 은 *자본 대비 %* 다. $500 에서
# AAPL 1주($316)를 사려면 per_trade ≥ ~63% 여야 한다. 그래서 95% 로 둔다 — **절대 위험은
# 자본 $500 자체가 천장**이라 작다(1주 ~$316). 단, 이 캡은 $500 에 맞춘 것이므로 **자본을
# 키우기 전에 반드시 낮춰라**(워크플로가 capital_usd > $1,000 이면 무장을 거부해 footgun 차단).
#
# ⚠ 미검증 경고: forward 페이퍼 미검증(verdict=INSUFFICIENT_DATA). 그래서 *소액* 캐너리
# (헌법 VI 2단계 = 소액 실거래 검증)로만. forward-verdict + 칼마(스펙 035/038)가 `--mode live`
# 로 이 실거래 트랙을 같은 잣대로 판정한다.
#
# 안전장치: ① 라이브 거래 집합 무확대(SPY·MSFT·AAPL, 헌법 II). ② 추세 필터 방어(추세 아래
# 현금). ③ 스펙 014 손실 서킷 브레이커가 킬스위치(일손실·총낙폭 한도 → halt_gate 가 주문 거부).
# ④ K1 캡이 천장. ⑤ 자본 $500 자체가 최대 손실 한도.

[caps]
# $500 에 맞춘 캡 — 절대 위험은 자본($500)이 천장. 자본 키우기 전 반드시 낮출 것.
per_trade_pct                  = 95.0
per_symbol_pct                 = 95.0
global_exposure_pct            = 95.0
canary_capital_pct             = 5.0
canary_min_duration_days       = 10
canary_acceptance_drawdown_pct = 3.0

[whitelist]
# 기존 실거래 캐너리와 동일 — 라이브 거래 집합 무확대(헌법 II).
symbols     = ["SPY", "MSFT", "AAPL"]
accounts    = ["${KIS_ACCOUNT_NO}"]
order_types = ["LIMIT"]
sessions    = ["REGULAR"]

[portfolio]
id            = "live-canary-portfolio"
universe      = ["SPY", "MSFT", "AAPL"]
weights       = { momentum = "1.0", quality = "1.0", low_volatility = "0.5" }
weight_scheme = "equal"             # "스마트" 최적화기가 단순 균등을 못 이겼음(REAL-DATA-FINDINGS)
top_n         = 1                   # $500 현실: 1종목 1주만 들어감. 자본↑ 시 함께 올릴 것.
rebalance_mode             = "hold_replace"   # 저회전: 순위 이탈만 청산, 승자 유지
invested_fraction          = "0.95"           # $500 에서 1주(~$316)를 사려면 예산을 충분히
rebalance_every_n_sessions = 21               # ≈ 월 1회
lookback_bars              = 50
momentum_period            = 30
rebalance_threshold_pct    = "2.0"
min_notional_usd           = "50"

# 드로다운 방어 오버레이(스펙 036) — 추세 아래면 현금. 실거래 캐너리의 핵심 안전장치.
[portfolio.trend_filter]
method          = "sma"
lookback        = 50
on_insufficient = "hold"
