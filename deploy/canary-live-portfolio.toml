# 스펙 049 — 라이브 캐너리 **포트폴리오** 설정 (검증된 글로벌 분산 추세 앙상블의 소액 실거래본).
#
# 운영자 결정 경로:
#   - 2026-06-04: 옛 3종목 top_n=1(SPY·MSFT·AAPL) 무장 해제 — "AAPL 1주 실거래 검증은 의미없어.
#     좁은 3종목 1위 매수는 세계 최고 수준 아님. 우선순위: 유니버스 확대 + 절대 기대수익 게이트
#     → 넓은 forward 페이퍼로 검증 후 재무장."
#   - 2026-06-10: "forward 검증 후 자동 무장." → 이 파일을 *검증된 앙상블*로 재지정한다.
#
# ── 무엇이 바뀌었나 (검증=무장 정합성) ──────────────────────────────────────────
# 이 설정의 [portfolio]/[portfolio.trend_filter] 전략 블록은 forward 페이퍼에서 누적·검증 중인
# deploy/global-trend-portfolio.toml (ARM E, data/forward_global.db) 과 **전략 지문이 동일**하다 —
# 같은 유니버스(SPY·IEF·GLD), 같은 역변동성(리스크 패리티) 가중, 같은 다중 속도 추세 앙상블
# (스펙 048, [63,126,189,252]). 즉 **paper 에서 검증한 바로 그 전략을 라이브 캐너리로 무장**한다.
# 스펙 049 자동 무장 게이트(forward-edge-autoarm.yml)가 이 지문 일치를 무장 전 강제한다 —
# 검증하지 않은 전략은 절대 무장하지 않는다.
#
# 왜 이 전략인가 (검증된 길):
#   주식(SPY)+채권(IEF)+금(GLD) 3자산 GTAA. 금은 주식·채권 둘 다와 비상관(특히 인플레 regime
#   의 구조적 헤지)이라 분산 이득을 더한다. 금은 변동성 큰 자산이라 *역변동성(리스크 패리티)*
#   으로 사이징해 분산 이득만 취하고 변동성은 안 들여온다(스펙 047: 균등은 낙폭 악화, 역변동성은
#   모든 구간 낙폭 ~5%·칼마↑). 각 자산은 다중 속도 추세 앙상블의 *추세 위 비율*(0..1)만큼만
#   노출하고 나머지는 현금(스펙 048: 단일 속도 대비 샤프 ~1.8→2.0+·낙폭 ~5%→3.7%, 4/4 구간 엣지).
#
# ── 정직한 소액 한계 (자본 vs 정수 주) ─────────────────────────────────────────
# ⚠ 캐너리는 *실거래 체결 파이프라인*(KIS 라우팅·체결·정합성·NAV·서킷 브레이커)을 최소 위험으로
#   검증하는 단계(헌법 VI 2단계)이지, 전략 엣지를 복제하는 단계가 아니다(엣지는 paper forward 가
#   이미 검증). 소액에선 정수 주 제약으로 모든 다리가 안 들어갈 수 있다 — 역변동성은 저변동
#   자산(IEF ~$95)에 큰 비중을 주므로 작은 자본은 IEF(±GLD)만 보유하고 SPY(~$540) 1주는 자본이
#   더 커야 들어간다. 이는 *정직한 소액 캐너리*다. 운영자가 자본(센티넬 capital_usd)과 아래 캡을
#   함께 올리면 3다리 전 표현으로 확장된다. on_insufficient=cash 라 이력 부족·추세 아래면 현금.
#
# ── 라이브 안전장치 ────────────────────────────────────────────────────────────
#   ① 라이브 거래 집합: SPY·IEF·GLD (셋 다 초유동 미국 상장 ETF, KIS 해외주식 경로). 라이브 집합
#      변경은 운영자 게이트(헌법 II) — 이 재지정 자체는 무장 전엔 돈 0 이동(센티넬 armed:false).
#   ② 추세 앙상블 방어 — 추세 아래 비율만큼 현금(드로다운 방어).
#   ③ 스펙 014 손실 서킷 브레이커가 킬스위치(일손실·총낙폭 한도 → halt_gate 가 주문 거부).
#   ④ K1 캡이 천장. ⑤ 자본(소액, 센티넬 capital_usd ≤ $1,000)이 최대 손실 한도.
#   ⑥ rebalance-live-canary.yml: 무장 머지(push)는 미리보기만, 실주문은 시장시간 스케줄에서만.
#
# 헌법 X.4: 라이브 전환은 운영자 결정. 이 설정+자동 무장 게이트는 운영자 명시 지시("forward 검증
# 후 자동 무장")에 따른 소액 캐너리 전용, 풀라이브 아님.

[caps]
# 소액 캐너리용 보수 캡 — 3자산 분산이라 종목당 60%·전체 100% 면 충분(역변동성이 자연히 분산).
# 절대 위험은 자본(소액, ≤ $1,000)이 천장. 자본 키우기 전 반드시 재검토할 것.
per_trade_pct                  = 50.0
per_symbol_pct                 = 60.0
global_exposure_pct            = 100.0
canary_capital_pct             = 5.0
canary_min_duration_days       = 10
canary_acceptance_drawdown_pct = 3.0

[whitelist]
# 비상관 자산 3종 — 주식(SPY) + 채권(IEF) + 금(GLD). 검증된 앙상블과 동일 집합.
symbols     = ["SPY", "IEF", "GLD"]
accounts    = ["${KIS_ACCOUNT_NO}"]
order_types = ["LIMIT"]
sessions    = ["REGULAR"]

# ── [portfolio]·[portfolio.trend_filter]: global-trend-portfolio.toml 과 전략 지문 동일 ──
# (스펙 049 자동 무장 게이트가 이 일치를 무장 전 강제. 한쪽만 바꾸면 지문 불일치로 BLOCKED.)
[portfolio]
id            = "global-trend"
universe      = ["SPY", "IEF", "GLD"]
weights       = { momentum = "1.0" }   # top_n=3 라 점수는 순위에 무영향(셋 다 보유)
weight_scheme = "inverse_vol"          # 역변동성(리스크 패리티) — 변동성 큰 금이 자동 작은 비중
top_n         = 3
rebalance_mode             = "hold_replace"
invested_fraction          = "0.99"
rebalance_every_n_sessions = 21
lookback_bars              = 200   # 역변동성 추정 창(≈10개월)
momentum_period            = 120
rebalance_threshold_pct    = "2.0"
min_notional_usd           = "50"

# 다중 속도 추세 앙상블(스펙 048) — 각 자산이 자기 추세 위 비율만큼만 노출, 나머지 현금.
# 역변동성 가중 *뒤에* 적용(자본 방어 오버레이). on_insufficient=cash: 이력 없으면 보유 안 함.
[portfolio.trend_filter]
method          = "sma"
lookback        = 200
on_insufficient = "cash"
ensemble_windows = [63, 126, 189, 252]
