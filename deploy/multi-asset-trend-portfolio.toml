# 스펙 043 — 멀티에셋 분산 추세추종 forward 페이퍼 설정. 돈 0 이동.
#
# 무엇이 다른가(중요): ARM C(risk-managed-beta-portfolio.toml)는 SPY·QQQ 인데 *둘 다 미국
# 주식*(상관 ~0.95)이라 분산 이득이 없다. 이 파일은 **비상관 자산을 합친다** — 주식(SPY)과
# 채권(IEF, 7~10년 미국 국채). 각 자산을 자기 ~10개월(200일) 추세 위일 때만 보유하고 아래면
# 현금으로 빠진다. 두 추세 흐름은 서로 다른 시점에 켜지고 자산 자체가 비상관이라, 합치면 단일
# 자산 추세보다 위험조정 수익(샤프·칼마)이 더 높다(Faber GTAA; AQR/Man-AHL managed futures).
#
# 왜 이게 검증된 길인가(스펙 043, specs/043-multi-asset-trend/FINDINGS.md):
# Shiller 월간 S&P + 10년 국채 수익률(1871~현재, 대공황 포함)에서 단일 주식 추세 vs 주식추세+
# 채권추세 분산을 비교한 결과 —
#   주식·채권 상관 +0.035(전체)~−0.120(최근) = 구조적 분산 근거.
#   분산 추세(50/50) 샤프 1.58/1.81/1.78(전체/현대/최근) vs 단일 주식 추세 1.18/1.43/1.29.
#   최대낙폭 18%/7%/7% vs 41%/19%/19%. 고전 60/40 단순보유(샤프 0.90~1.19)도 압도.
#   견고성: SMA 창 7/10/12 × 가중 50:50/60:40 = 모든 조합 DIVERSIFICATION_EDGE(과적합 아님).
#
# ⚠ 정직한 한계: 검증은 주식+채권 *2자산* 이다. 금(GLD)·원자재는 Shiller 장기 데이터가 없어
# 아직 미검증 → 이 설정에 넣지 않는다(측정한 것만 배선). 후속으로 장기 시계열을 확보하면 확장.
# 분산은 CAGR 이 더 낮다(절반 채권/현금) — 가치는 raw 수익이 아니라 위험조정 수익(샤프)↑ 이고,
# 그 뒤 (운영자 결정으로) 자본을 키워 목표 수익을 훨씬 낮은 낙폭에서 달성하는 데 있다.
#
# ── 아직 라이브 아님 (정직) ──────────────────────────────────────────────────
# PAPER 전용(rebalance-paper-forward.yml ARM D, --mode paper). 실주문 0건, 돈 0 이동. 실거래
# 전환은 별도 운영자 게이트(헌법 X.4). 인스턴스 전제: universe(SPY·IEF) 일봉이 ≥lookback(200)
# 쌓여야 추세 판정 활성. 부족하면 on_insufficient=cash 라 보유 안 함(보수적 — "확인 못 하면
# 투자 안 함"). IEF 백필이 실패해도 SPY 만으로 동작(graceful degrade).

[caps]
# 페이퍼라 절대 위험 0. 캡은 라이브 전환 시 자본에 맞춰 반드시 재조정할 것.
per_trade_pct                  = 50.0
per_symbol_pct                 = 60.0
global_exposure_pct            = 100.0
canary_capital_pct             = 5.0
canary_min_duration_days       = 10
canary_acceptance_drawdown_pct = 3.0

[whitelist]
# 비상관 자산 2종 — 주식(SPY) + 채권(IEF). 둘 다 초유동 미국 상장 ETF(KIS 해외주식 경로).
# 라이브 거래 집합 무확대(헌법 II)는 라이브 전환 시 운영자 결정.
symbols     = ["SPY", "IEF"]
accounts    = ["${KIS_ACCOUNT_NO}"]
order_types = ["LIMIT"]
sessions    = ["REGULAR"]

[portfolio]
id            = "multi-asset-trend"
# 주식(SPY) + 채권(IEF). top_n=2 = 둘 다 보유(선택 아님). 각자 추세 게이트로 자기 추세 아래면
# 현금. 재정규화 안 함 → 둘 다 추세 아래면 100% 현금(폭락 방어). equal = 50/50(검증한 가중).
universe      = ["SPY", "IEF"]
weights       = { momentum = "1.0" }   # top_n=2 라 점수는 순위에 무영향(둘 다 보유)
weight_scheme = "equal"
top_n         = 2
# 저회전 — 승자 유지(hold_replace), 월 1회(≈21영업일) 재조정. 무거래 밴드 2%·최소 명목 $50.
rebalance_mode             = "hold_replace"
invested_fraction          = "0.99"
rebalance_every_n_sessions = 21
lookback_bars              = 200
momentum_period            = 120
rebalance_threshold_pct    = "2.0"
min_notional_usd           = "50"

# 스펙 036 추세 필터 = 분산 추세의 핵심. 스펙 042/043 에서 검증된 파라미터(method=sma,
# lookback=200≈10개월). 각 자산이 *자기* 추세 위일 때만 보유 → 두 비상관 흐름의 분산.
# on_insufficient=cash: 200봉 이력 없으면 보유 안 함(보수적 방어).
[portfolio.trend_filter]
method          = "sma"
lookback        = 200
on_insufficient = "cash"
