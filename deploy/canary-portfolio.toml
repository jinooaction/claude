# 스펙 032 — forward 페이퍼 검증용 포트폴리오 설정 (현재 데이터, 돈 안 움직임).
#
# 왜 이 파일이 있나: 옛 과거 데이터 백테스트는 2026년 시장 구조(참여자·금리·미시구조)와
# 다른 regime 을 측정한다. "과거에 맞았다"가 "지금 통한다"를 보장하지 않는다. 유일한
# 진짜 검증은 *현재 데이터로 앞으로(forward) 페이퍼 트레이딩한 트랙레코드*다.
# `auto-invest rebalance-once --mode paper` 가 라이브 KIS 시세로 가상 체결을 기록
# (ORDER_PAPER_FILLED)하고, 그걸 성과 엔진(스펙 011) + 디플레이티드 샤프(스펙 027)로
# 측정한다. 이 설정은 그 forward 페이퍼 검증의 시드다.
#
# 안전: accounts 는 ${KIS_ACCOUNT_NO} 로 치환되지만 --mode paper 는 가상 체결만 한다
# (실주문 0건). 라이브 전환은 별도 운영자 게이트(헌법 X.4) + --mode live --confirm-live.
#
# 인스턴스 전제: universe 심볼의 일봉이 price_bars 에 있어야 점수화가 된다. 워크플로
# rebalance-paper-forward.yml 의 backfill-bars 단계(스펙 033)가 매 거래일 --portfolio 의
# universe 일봉을 KIS 에서 채운다(거래소 NAS→NYS→AMS 자동 시도). 라이브 워커가 떠 있으면
# 워커 틱(--backfill)이 whitelist 일봉도 상시 갱신한다.
#
# 스펙 033 후속(유니버스 확대): 횡단면 분산을 위해 3→10 종목으로 넓혔다. REAL-DATA-FINDINGS
# 교훈상 넓고 저회전이 유리. 거래소 혼합(NAS: 기술주, NYS: 금융·헬스·에너지, AMS: SPY).
#
# 스펙 034(유동성 기반 유니버스 구성): 후보 유니버스를 28종목 유동성 대형주로 넓혔다.
# 워크플로 rebalance-paper-forward.yml 이 매 실행 `rebalance-once --construct-universe-top-n`
# 으로 *현재* 저장 바(스펙 033 백필) 기준 유동성 상위 N개만 골라 재조정한다(손으로 고른
# 유니버스가 아니라 현재 데이터로 *구성*). 구성 결과는 항상 이 화이트리스트의 부분집합이라
# 라이브 거래 집합을 넓힐 수 없다(헌법 II). PAPER 전용 — 실주문 0건.

[caps]
per_trade_pct                  = 5.0
per_symbol_pct                 = 25.0
global_exposure_pct            = 80.0
canary_capital_pct             = 5.0
canary_min_duration_days       = 10
canary_acceptance_drawdown_pct = 3.0

[whitelist]
symbols     = ["AAPL", "MSFT", "GOOGL", "AMZN", "NVDA", "META", "AVGO", "TSLA", "ORCL", "CRM", "ADBE", "AMD", "QCOM", "TXN", "IBM", "CSCO", "INTU", "AMAT", "MU", "NOW", "INTC", "ADI", "LRCX", "KLAC", "PANW", "NFLX", "DIS", "CMCSA", "TMUS", "VZ", "T", "WMT", "COST", "HD", "MCD", "NKE", "SBUX", "LOW", "PG", "KO", "PEP", "PM", "MDLZ", "CL", "TGT", "JPM", "BAC", "WFC", "GS", "MS", "C", "V", "MA", "AXP", "BLK", "SPGI", "SCHW", "UNH", "LLY", "JNJ", "ABBV", "MRK", "PFE", "TMO", "ABT", "DHR", "BMY", "AMGN", "GILD", "ELV", "ISRG", "MDT", "CVS", "XOM", "CVX", "COP", "CAT", "BA", "HON", "GE", "UPS", "RTX", "LMT", "DE", "UNP", "SPY", "QQQ", "LIN", "AMT"]
accounts    = ["${KIS_ACCOUNT_NO}"]
order_types = ["LIMIT"]
sessions    = ["REGULAR"]

[portfolio]
id            = "forward-paper-canary"
universe      = ["AAPL", "MSFT", "GOOGL", "AMZN", "NVDA", "META", "AVGO", "TSLA", "ORCL", "CRM", "ADBE", "AMD", "QCOM", "TXN", "IBM", "CSCO", "INTU", "AMAT", "MU", "NOW", "INTC", "ADI", "LRCX", "KLAC", "PANW", "NFLX", "DIS", "CMCSA", "TMUS", "VZ", "T", "WMT", "COST", "HD", "MCD", "NKE", "SBUX", "LOW", "PG", "KO", "PEP", "PM", "MDLZ", "CL", "TGT", "JPM", "BAC", "WFC", "GS", "MS", "C", "V", "MA", "AXP", "BLK", "SPGI", "SCHW", "UNH", "LLY", "JNJ", "ABBV", "MRK", "PFE", "TMO", "ABT", "DHR", "BMY", "AMGN", "GILD", "ELV", "ISRG", "MDT", "CVS", "XOM", "CVX", "COP", "CAT", "BA", "HON", "GE", "UPS", "RTX", "LMT", "DE", "UNP", "SPY", "QQQ", "LIN", "AMT"]
weights       = { momentum = "1.0", quality = "1.0", low_volatility = "0.5" }
weight_scheme = "equal"
top_n         = 5
# 증거 기반(REAL-DATA-FINDINGS): 저회전 + 승자 유지(hold_replace). 워크플로가 28후보 →
# 유동성 상위(--construct-universe-top-n) → 합성 점수 상위 5종목 보유의 2단 선택.
# 백필이 심볼당 ~100 일봉을 채우므로 룩백 60·모멘텀 40 으로 신호 품질↑(가용 범위 내).
rebalance_mode             = "hold_replace"
invested_fraction          = "0.95"
rebalance_every_n_sessions = 21
lookback_bars              = 60
momentum_period            = 40
rebalance_threshold_pct    = "2.0"
min_notional_usd           = "50"

# 스펙 041 — 절대 모멘텀(기대수익 바닥) 게이트 = 듀얼 모멘텀(Antonacci). PAPER 전용.
# 운영자 지적("점수 1위에 투자하는 건 허접한 전략 — 1위가 수익이 기대 안 되는데도 투자.
# 기대 수익율 기준으로 판단해야"): 합성 점수는 *상대 순위*만 본다. 절대 게이트가 없으면
# 후보가 전부 나빠도 "그나마 1위"를 산다. 이 게이트가 그걸 막는다 —
#   method=absolute_momentum: 종목의 *자기* 후행수익률(lookback 기간)이 min_return 바닥을
#     넘어야 보유. 못 넘으면 1위라도 가중치 0(현금). "기대 안 되면 투자 안 함."
#   lookback=60: ≈3개월 모멘텀(스코어러 lookback 60과 정합, 인스턴스 ~100 일봉에서 활성).
#   min_return_pct=0.0: 자기 수익이 양수여야 보유(고전 듀얼 모멘텀). 양수로 올리면 더 엄격.
#   on_insufficient=cash: 60봉+ 이력이 없어 *기대수익을 확인 못 하면* 보유하지 않는다
#     (보수적 — "확인 못 하면 투자 안 함"이 절대 게이트 철학에 맞다).
# 효과는 스펙 035 forward-verdict 가 판정 + 대조군(canary-portfolio-notrend.toml = 게이트
# 없이 1위 항상 매수)과 A/B 비교로 "절대 게이트가 정말 도움 되는가"를 격리 측정한다.
[portfolio.trend_filter]
method          = "absolute_momentum"
lookback        = 60
min_return_pct  = 0.0
on_insufficient = "cash"
