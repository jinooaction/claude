# 스펙 032 — 실데이터(S&P500 5년, 2013-2018) 재조정 백테스트 설정.
#
# 재현:
#   python scripts/fetch_sp500_subset.py --out data/history_csv_sp500
#   auto-invest ingest-history --from-dir data/history_csv_sp500
#   auto-invest backtest-portfolio --portfolio specs/032-portfolio-rebalancing/sp500-portfolio.toml \
#       --from 2013-06-03 --to 2018-02-07
#
# 데이터는 공개 GitHub raw(plotly/datasets/all_stocks_5yr.csv) — 실제 일봉 OHLCV.

[caps]
per_trade_pct                  = 15.0
per_symbol_pct                 = 20.0
global_exposure_pct            = 100.0
canary_capital_pct             = 5.0
canary_min_duration_days       = 10
canary_acceptance_drawdown_pct = 40.0

[whitelist]
symbols = [
    "AAPL", "MSFT", "AMZN", "GOOGL", "FB", "JPM", "JNJ", "XOM",
    "PG", "HD", "KO", "WMT", "INTC", "CSCO", "DIS",
]
accounts    = ["BACKTEST"]
order_types = ["MARKET", "LIMIT"]
sessions    = ["REGULAR"]

[portfolio]
id            = "sp500-composite-top8"
universe      = [
    "AAPL", "MSFT", "AMZN", "GOOGL", "FB", "JPM", "JNJ", "XOM",
    "PG", "HD", "KO", "WMT", "INTC", "CSCO", "DIS",
]
weights       = { momentum = "1.0", quality = "1.0", low_volatility = "0.5" }
weight_scheme = "max_sharpe"
top_n         = 8
invested_fraction         = "0.95"
rebalance_every_n_sessions = 21
lookback_bars             = 90
momentum_period           = 60
rebalance_threshold_pct   = "1.0"
min_notional_usd          = "50"
