name: Source input laboratory

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/intraday_source_input_lab.py'
      - 'tests/unit/test_intraday_source_input_lab.py'
      - 'specs/219-source-input-lab/**'
      - '.github/workflows/source-input-lab.yml'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

concurrency:
  group: source-input-lab-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KIS_LIVE_TEST: '0'
      UV_PYTHON: '3.11'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv sync --locked --dev
      - run: uv run ruff check src tests scripts/intraday_source_input_lab.py
      - name: Exact head full regression
        run: >-
          uv run --with-requirements scripts/volume-priority-requirements.txt
          pytest --junitxml="$RUNNER_TEMP/source-input-lab.xml"
      - name: Require input and existing safety counterexamples without skips
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          cases = list(ET.parse(os.environ['RUNNER_TEMP']+'/source-input-lab.xml').iter('testcase'))
          for fragment, minimum in [('test_intraday_source_input_lab', 27),
                                    ('test_intraday_runtime_isolation_lab', 63),
                                    ('test_intraday_installed_tree', 70),
                                    ('test_intraday_frozen_context', 57),
                                    ('test_intraday_research_identity', 21),
                                    ('test_intraday_collection_record', 76),
                                    ('test_live_canary_active_track', 23),
                                    ('test_volume_priority_research_cli', 29)]:
              selected = [c for c in cases if fragment in c.get('classname', '')]
              assert len(selected) >= minimum and all(c.find('skipped') is None for c in selected)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-input-regression-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/source-input-lab.xml
          if-no-files-found: warn
          retention-days: 90
  laboratory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Exact source and non-executing synthetic inputs only
        env:
          LAB_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LAB_SOURCE_SHA"
          python3 scripts/intraday_source_input_lab.py --output "$RUNNER_TEMP/source-input-report.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-input-observation-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/source-input-report.json
          if-no-files-found: error
          retention-days: 90
