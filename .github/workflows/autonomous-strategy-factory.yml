name: Autonomous strategy factory (accounting-factor independent edge)

# 스펙 174. 브로커와 완전히 분리된 연구 워크플로다. 월말 공장까지 784행을 재구성한 뒤
# 독립 회계 기반 횡단면 팩터 16개를 검증해 800행·20가족 장부를 만든다.
# 이 워크플로 자체는 주문, 자본 변경, 라이브 설정 변경을 하지 않는다.

on:
  schedule:
    - cron: "35 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/auto_invest/analytics/backtest_overfitting.py'
      - 'src/auto_invest/analytics/strategy_factory.py'
      - 'src/auto_invest/analytics/macro_strategy_factory.py'
      - 'src/auto_invest/analytics/treasury_carry_factory.py'
      - 'src/auto_invest/analytics/credit_spread_factory.py'
      - 'src/auto_invest/analytics/fx_carry_factory.py'
      - 'src/auto_invest/analytics/commodity_term_structure_factory.py'
      - 'src/auto_invest/analytics/commodity_positioning_factory.py'
      - 'src/auto_invest/analytics/commodity_supply_demand_factory.py'
      - 'src/auto_invest/analytics/usda_crop_supply_demand_factory.py'
      - 'src/auto_invest/analytics/energy_cross_market_factory.py'
      - 'src/auto_invest/analytics/options_variance_risk_premium_factory.py'
      - 'src/auto_invest/analytics/turn_of_month_equity_factory.py'
      - 'src/auto_invest/analytics/accounting_factor_factory.py'
      - 'src/auto_invest/analytics/research_family_audit.py'
      - 'src/auto_invest/portfolio/factory_evidence.py'
      - 'src/auto_invest/analytics/real_world_gate_controls.py'
      - 'src/auto_invest/analytics/edge_gate_calibration.py'
      - 'src/auto_invest/market_data/public_data.py'
      - 'src/auto_invest/market_data/macro_regime.py'
      - 'scripts/strategy_factory_probe.py'
      - 'scripts/macro_strategy_factory_probe.py'
      - 'scripts/treasury_carry_factory_probe.py'
      - 'scripts/credit_spread_factory_probe.py'
      - 'scripts/fx_carry_factory_probe.py'
      - 'scripts/commodity_term_structure_factory_probe.py'
      - 'scripts/commodity_positioning_factory_probe.py'
      - 'scripts/commodity_supply_demand_factory_probe.py'
      - 'scripts/usda_crop_supply_demand_factory_probe.py'
      - 'scripts/energy_cross_market_factory_probe.py'
      - 'scripts/options_variance_risk_premium_factory_probe.py'
      - 'scripts/turn_of_month_equity_factory_probe.py'
      - 'scripts/accounting_factor_factory_probe.py'
      - 'specs/174-accounting-cross-sectional-factors/contracts/accounting-factor-result.schema.json'
      - 'specs/171-parallel-regime-edge-challenger/production-result.json'
      - 'scripts/factory_evidence_gate.py'
      - 'scripts/edge_gate_calibration_probe.py'
      - 'deploy/public-data.toml'
      - '.github/workflows/autonomous-strategy-factory.yml'

permissions:
  contents: write

concurrency:
  group: autonomous-strategy-factory
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Load append-only production trial ledger
        run: |
          set -euo pipefail
          git fetch origin automation/autonomous-strategy-factory-last-run || true
          git show origin/automation/autonomous-strategy-factory-last-run:trial_ledger.jsonl \
            > /tmp/trial_ledger_prior_raw.jsonl 2>/dev/null \
            || : > /tmp/trial_ledger_prior_raw.jsonl
          uv run python scripts/recover_public_jsonl.py \
            --input /tmp/trial_ledger_prior_raw.jsonl \
            --output /tmp/trial_ledger_prior.jsonl \
            --allow-known-redaction-drop

      - name: Refresh official macro data
        timeout-minutes: 12
        run: |
          set -euo pipefail
          uv run auto-invest collect-public-data \
            --config deploy/public-data.toml \
            --out-dir /tmp/public-data \
            --json > /tmp/public_data_collect.json
          test -s /tmp/public-data/fred/DGS2.csv
          test -s /tmp/public-data/fred/DGS3MO.csv
          test -s /tmp/public-data/fred/DGS5.csv
          test -s /tmp/public-data/fred/DGS10.csv
          test -s /tmp/public-data/fred/DGS30.csv
          test -s /tmp/public-data/fred/HQMCB10YR.csv
          test -s /tmp/public-data/fred/HQMCB20YR.csv
          test -s /tmp/public-data/fred/CPIAUCNS.csv
          test -s /tmp/public-data/fred/SAHMREALTIME.csv
          test -s /tmp/public-data/fred/DEXUSAL.csv
          test -s /tmp/public-data/fred/DEXCAUS.csv
          test -s /tmp/public-data/fred/DEXJPUS.csv
          test -s /tmp/public-data/fred/DEXUSUK.csv
          test -s /tmp/public-data/fred/IRSTCI01AUM156N.csv
          test -s /tmp/public-data/fred/IRSTCI01CAM156N.csv
          test -s /tmp/public-data/fred/IRSTCI01JPM156N.csv
          test -s /tmp/public-data/fred/IRSTCI01GBM156N.csv
          test -s /tmp/public-data/fred/IRSTCI01USM156N.csv
          test -s /tmp/public-data/cboe/VIX.csv

      - name: Calibrate the hierarchical edge gate
        run: |
          set -euo pipefail
          uv run python scripts/edge_gate_calibration_probe.py \
            --seed 60000 \
            --repetitions 500 \
            --code-commit "${GITHUB_SHA}" \
            --timestamp-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --json-out /tmp/edge_gate_calibration.json
          test "$(jq -r '.verdict' /tmp/edge_gate_calibration.json)" = "CALIBRATED"

      - name: Reconstruct the complete prior 512-trial evidence
        run: |
          set -euo pipefail
          uv run python scripts/macro_strategy_factory_probe.py \
            --code-commit "${GITHUB_SHA}" \
            --macro-data-dir /tmp/public-data \
            --prior-ledger /tmp/trial_ledger_prior.jsonl \
            --timestamp-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --json-out /tmp/macro_strategy_factory.json \
            --summary-out /tmp/MACRO_LAST_RUN.md
          test "$(jq -r '.multiplicity_trial_count' /tmp/macro_strategy_factory.json)" = "512"

      - name: Run the complete 64-trial Treasury carry batch
        run: |
          set -euo pipefail
          uv run python scripts/treasury_carry_factory_probe.py \
            --code-commit "${GITHUB_SHA}" \
            --macro-data-dir /tmp/public-data \
            --prior-factory-json /tmp/macro_strategy_factory.json \
            --prior-ledger /tmp/trial_ledger_prior.jsonl \
            --calibration-json /tmp/edge_gate_calibration.json \
            --timestamp-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --json-out /tmp/treasury_carry_factory.json \
            --summary-out /tmp/LAST_RUN.md
          test "$(jq -r '.complete_trial_count' /tmp/treasury_carry_factory.json)" = "64"
          test "$(jq -r '.global_audit_trial_count' /tmp/treasury_carry_factory.json)" = "576"
          test "$(jq -r '.multiplicity_trial_count' /tmp/treasury_carry_factory.json)" = "64"
          cat /tmp/LAST_RUN.md

      - name: Run the complete 64-trial credit spread batch
        run: |
          set -euo pipefail
          uv run python scripts/credit_spread_factory_probe.py \
            --code-commit "${GITHUB_SHA}" \
            --macro-data-dir /tmp/public-data \
            --prior-factory-json /tmp/treasury_carry_factory.json \
            --macro-factory-json /tmp/macro_strategy_factory.json \
            --prior-ledger /tmp/trial_ledger_prior.jsonl \
            --calibration-json /tmp/edge_gate_calibration.json \
            --timestamp-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --json-out /tmp/credit_spread_factory.json \
            --summary-out /tmp/CREDIT_LAST_RUN.md
          test "$(jq -r '.complete_trial_count' /tmp/credit_spread_factory.json)" = "64"
          test "$(jq -r '.global_audit_trial_count' /tmp/credit_spread_factory.json)" = "640"
          test "$(jq -r '.multiplicity_trial_count' /tmp/credit_spread_factory.json)" = "64"

      - name: Run the preregistered 16-trial FX carry batch
        run: |
          set -euo pipefail
          uv run python scripts/fx_carry_factory_probe.py \
            --code-commit "${GITHUB_SHA}" \
            --macro-data-dir /tmp/public-data \
            --prior-factory-json /tmp/credit_spread_factory.json \
            --calibration-json /tmp/edge_gate_calibration.json \
            --timestamp-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --json-out /tmp/fx_carry_factory.json \
            --summary-out /tmp/FX_LAST_RUN.md
          test "$(jq -r '.complete_trial_count' /tmp/fx_carry_factory.json)" = "16"
          test "$(jq -r '.global_audit_trial_count' /tmp/fx_carry_factory.json)" = "656"
          test "$(jq -r '.multiplicity_trial_count' /tmp/fx_carry_factory.json)" = "16"

      - name: Run the preregistered 16-trial commodity term-structure batch
        run: |
          set -euo pipefail
          uv run python scripts/commodity_term_structure_factory_probe.py \
            --code-commit "${GITHUB_SHA}" \
            --macro-data-dir /tmp/public-data \
            --prior-factory-json /tmp/fx_carry_factory.json \
            --calibration-json /tmp/edge_gate_calibration.json \
            --timestamp-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --json-out /tmp/commodity_term_structure_factory.json \
            --summary-out /tmp/TERM_STRUCTURE_LAST_RUN.md
          test "$(jq -r '.complete_trial_count' /tmp/commodity_term_structure_factory.json)" = "16"
          test "$(jq -r '.global_audit_trial_count' /tmp/commodity_term_structure_factory.json)" = "672"
          test "$(jq -r '.multiplicity_trial_count' /tmp/commodity_term_structure_factory.json)" = "16"

      - name: Audit real controls and run the 16-trial commodity positioning batch
        run: |
          set -euo pipefail
          uv run python scripts/commodity_positioning_factory_probe.py \
            --code-commit "${GITHUB_SHA}" \
            --macro-data-dir /tmp/public-data \
            --prior-factory-json /tmp/commodity_term_structure_factory.json \
            --calibration-json /tmp/edge_gate_calibration.json \
            --timestamp-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --controls-json-out /tmp/real_world_gate_controls.json \
            --json-out /tmp/commodity_positioning_factory.json \
            --summary-out /tmp/POSITIONING_LAST_RUN.md
          test "$(jq -r '.promotion_control_passed' /tmp/real_world_gate_controls.json)" = "true"
          test "$(jq -r '.complete_trial_count' /tmp/commodity_positioning_factory.json)" = "16"
          test "$(jq -r '.global_audit_trial_count' /tmp/commodity_positioning_factory.json)" = "688"
          test "$(jq -r '.multiplicity_trial_count' /tmp/commodity_positioning_factory.json)" = "16"

      - name: Audit the complete gate and run the 16-trial supply-demand batch
        run: |
          set -euo pipefail
          uv run python scripts/commodity_supply_demand_factory_probe.py \
            --code-commit "${GITHUB_SHA}" \
            --macro-data-dir /tmp/public-data \
            --prior-factory-json /tmp/commodity_positioning_factory.json \
            --calibration-json /tmp/edge_gate_calibration.json \
            --timestamp-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --psr-controls-json-out /tmp/real_world_gate_controls.json \
            --controls-json-out /tmp/full_gate_controls.json \
            --json-out /tmp/commodity_supply_demand_factory.json \
            --summary-out /tmp/SUPPLY_DEMAND_LAST_RUN.md
          test "$(jq -r '.promotion_control_passed' /tmp/full_gate_controls.json)" = "true"
          test "$(jq -r '.complete_trial_count' /tmp/commodity_supply_demand_factory.json)" = "16"
          test "$(jq -r '.global_audit_trial_count' /tmp/commodity_supply_demand_factory.json)" = "704"
          test "$(jq -r '.multiplicity_trial_count' /tmp/commodity_supply_demand_factory.json)" = "16"
          cat /tmp/SUPPLY_DEMAND_LAST_RUN.md

      - name: Run the preregistered 16-trial USDA crop supply-demand batch
        timeout-minutes: 12
        run: |
          set -euo pipefail
          uv run python scripts/usda_crop_supply_demand_factory_probe.py \
            --code-commit "${GITHUB_SHA}" \
            --macro-data-dir /tmp/public-data \
            --prior-factory-json /tmp/commodity_supply_demand_factory.json \
            --calibration-json /tmp/edge_gate_calibration.json \
            --controls-json /tmp/full_gate_controls.json \
            --timestamp-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --json-out /tmp/usda_crop_supply_demand_factory.json \
            --summary-out /tmp/USDA_LAST_RUN.md
          test "$(jq -r '.complete_trial_count' /tmp/usda_crop_supply_demand_factory.json)" = "16"
          test "$(jq -r '.global_audit_trial_count' /tmp/usda_crop_supply_demand_factory.json)" = "720"
          test "$(jq -r '.multiplicity_trial_count' /tmp/usda_crop_supply_demand_factory.json)" = "16"

      - name: Run the preregistered 16-trial energy cross-market batch
        run: |
          set -euo pipefail
          uv run python scripts/energy_cross_market_factory_probe.py \
            --code-commit "${GITHUB_SHA}" \
            --macro-data-dir /tmp/public-data \
            --prior-factory-json /tmp/usda_crop_supply_demand_factory.json \
            --calibration-json /tmp/edge_gate_calibration.json \
            --controls-json /tmp/full_gate_controls.json \
            --timestamp-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --json-out /tmp/energy_cross_market_factory.json \
            --summary-out /tmp/ENERGY_LAST_RUN.md
          test "$(jq -r '.complete_trial_count' /tmp/energy_cross_market_factory.json)" = "16"
          test "$(jq -r '.global_audit_trial_count' /tmp/energy_cross_market_factory.json)" = "736"
          test "$(jq -r '.multiplicity_trial_count' /tmp/energy_cross_market_factory.json)" = "16"
          test "$(jq -r '.unique_trial_fingerprint_count' /tmp/energy_cross_market_factory.json)" = "736"
          test "$(jq -r '.energy_cross_market_data.complete' /tmp/energy_cross_market_factory.json)" = "true"
          test "$(jq -r '.model_chronology.passed' /tmp/energy_cross_market_factory.json)" = "true"
          test "$(jq -r '.full_gate_controls.promotion_control_passed' /tmp/energy_cross_market_factory.json)" = "true"
          test "$(jq -r '.objective_gate_calibration.passable' /tmp/energy_cross_market_factory.json)" = "true"
          jq -e 'all(.decision.gates[]; (.passed | type) == "boolean")' \
            /tmp/energy_cross_market_factory.json >/dev/null
          jq -e '
            .development_selection.selected_candidate_id != null and
            ([.energy_cross_market_data_fingerprint, .model_fingerprint,
              .split_fingerprint, .research_live_parity.strategy_fingerprint,
              .research_live_parity.target_weights_digest] |
             all(startswith("sha256:")))
          ' /tmp/energy_cross_market_factory.json >/dev/null

      - name: Run the preregistered 16-trial options variance-premium batch
        run: |
          set -euo pipefail
          uv run python scripts/options_variance_risk_premium_factory_probe.py \
            --code-commit "${GITHUB_SHA}" \
            --macro-data-dir /tmp/public-data \
            --prior-factory-json /tmp/energy_cross_market_factory.json \
            --prior-family-json macro=/tmp/macro_strategy_factory.json \
            --prior-family-json treasury_carry=/tmp/treasury_carry_factory.json \
            --prior-family-json credit_spread=/tmp/credit_spread_factory.json \
            --prior-family-json fx_carry=/tmp/fx_carry_factory.json \
            --prior-family-json commodity_term_structure=/tmp/commodity_term_structure_factory.json \
            --prior-family-json commodity_positioning=/tmp/commodity_positioning_factory.json \
            --prior-family-json commodity_supply_demand=/tmp/commodity_supply_demand_factory.json \
            --prior-family-json usda_crop=/tmp/usda_crop_supply_demand_factory.json \
            --prior-family-json energy_cross_market=/tmp/energy_cross_market_factory.json \
            --calibration-json /tmp/edge_gate_calibration.json \
            --controls-json /tmp/full_gate_controls.json \
            --timestamp-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --json-out /tmp/options_variance_risk_premium_factory.json \
            --summary-out /tmp/OPTIONS_LAST_RUN.md
          test "$(jq -r '.complete_trial_count' /tmp/options_variance_risk_premium_factory.json)" = "16"
          test "$(jq -r '.global_audit_trial_count' /tmp/options_variance_risk_premium_factory.json)" = "752"
          test "$(jq -r '.multiplicity_trial_count' /tmp/options_variance_risk_premium_factory.json)" = "16"
          test "$(jq -r '.unique_trial_fingerprint_count' /tmp/options_variance_risk_premium_factory.json)" = "752"
          test "$(jq -r '.options_premium_data.complete' /tmp/options_variance_risk_premium_factory.json)" = "true"
          test "$(jq -r '.options_premium_data.sources.cboe_wput.selection_input' /tmp/options_variance_risk_premium_factory.json)" = "false"
          test "$(jq -r '.model_chronology.passed' /tmp/options_variance_risk_premium_factory.json)" = "true"
          test "$(jq -r '.selection_repair.chronology.all_folds_valid' /tmp/options_variance_risk_premium_factory.json)" = "true"
          test "$(jq -r '.selection_repair.chronology.fold_count' /tmp/options_variance_risk_premium_factory.json)" -ge "8"
          test "$(jq -r '.selection_repair.protocol.independent_index_used_for_selection' /tmp/options_variance_risk_premium_factory.json)" = "false"
          test "$(jq -r '.promotion_allowed' /tmp/options_variance_risk_premium_factory.json)" = "false"
          test "$(jq -r '.full_gate_controls.promotion_control_passed' /tmp/options_variance_risk_premium_factory.json)" = "true"
          test "$(jq -r '.objective_gate_calibration.passable' /tmp/options_variance_risk_premium_factory.json)" = "true"
          test "$(jq -r '.prior_adoption_audit | length' /tmp/options_variance_risk_premium_factory.json)" = "9"
          jq -e 'all(.decision.gates[]; (.passed | type) == "boolean")' \
            /tmp/options_variance_risk_premium_factory.json >/dev/null
          jq -e '
            (.reference_control.recognized_reference_passed | type) == "boolean" and
            (.reference_control.mean_zero_null_rejected | type) == "boolean" and
            (.objective_lanes | keys | sort) == ["portfolio_adoption", "premium_existence", "timing_value"] and
            all(.objective_lanes[]; .diagnostic_only == true and .promotion_eligible == false) and
            all(.prior_adoption_audit[]; .retroactive_promotion_allowed == false) and
            .development_selection.selected_candidate_id != null and
            ([.options_premium_data_fingerprint, .model_fingerprint,
              .split_fingerprint, .research_live_parity.strategy_fingerprint,
              .research_live_parity.target_weights_digest] |
             all(startswith("sha256:")))
          ' /tmp/options_variance_risk_premium_factory.json >/dev/null

      - name: Restore regime audit and run the 16-trial turn-of-month batch
        run: |
          set -euo pipefail
          uv run python scripts/turn_of_month_equity_factory_probe.py \
            --code-commit "${GITHUB_SHA}" \
            --prior-factory-json /tmp/options_variance_risk_premium_factory.json \
            --released-regime-json specs/171-parallel-regime-edge-challenger/production-result.json \
            --calibration-json /tmp/edge_gate_calibration.json \
            --timestamp-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --json-out /tmp/turn_of_month_equity_factory.json \
            --summary-out /tmp/turn_of_month_equity_factory.md
          test "$(jq -r '.complete_trial_count' /tmp/turn_of_month_equity_factory.json)" = "16"
          test "$(jq -r '.global_audit_trial_count' /tmp/turn_of_month_equity_factory.json)" = "784"
          test "$(jq -r '.multiplicity_trial_count' /tmp/turn_of_month_equity_factory.json)" = "16"
          test "$(jq -r '.unique_trial_fingerprint_count' /tmp/turn_of_month_equity_factory.json)" = "784"
          test "$(jq -r '.program_research_family_count' /tmp/turn_of_month_equity_factory.json)" = "19"
          test "$(jq -r '.research_family_audit | length' /tmp/turn_of_month_equity_factory.json)" = "19"
          test "$(jq -r '.promotion_allowed' /tmp/turn_of_month_equity_factory.json)" = "false"

      - name: Run the 16-trial accounting cross-sectional factor batch
        run: |
          set -euo pipefail
          uv run python scripts/accounting_factor_factory_probe.py \
            --code-commit "${GITHUB_SHA}" \
            --prior-factory-json /tmp/turn_of_month_equity_factory.json \
            --calibration-json /tmp/edge_gate_calibration.json \
            --result-schema specs/174-accounting-cross-sectional-factors/contracts/accounting-factor-result.schema.json \
            --timestamp-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --json-out /tmp/strategy_factory.json \
            --summary-out /tmp/LAST_RUN.md
          test "$(jq -r '.complete_trial_count' /tmp/strategy_factory.json)" = "16"
          test "$(jq -r '.global_audit_trial_count' /tmp/strategy_factory.json)" = "800"
          test "$(jq -r '.multiplicity_trial_count' /tmp/strategy_factory.json)" = "16"
          test "$(jq -r '.unique_trial_fingerprint_count' /tmp/strategy_factory.json)" = "800"
          test "$(jq -r '.program_research_family_count' /tmp/strategy_factory.json)" = "20"
          test "$(jq -r '.research_family_audit | length' /tmp/strategy_factory.json)" = "20"
          test "$(jq -r '.research_live_parity.passed' /tmp/strategy_factory.json)" = "false"
          test "$(jq -r '.promotion_allowed' /tmp/strategy_factory.json)" = "false"
          test "$(jq -r '.decision.selected_deploy_config' /tmp/strategy_factory.json)" = "null"
          test "$(jq -r '.safety.orders_submitted' /tmp/strategy_factory.json)" = "0"
          test "$(jq -r '.safety.capital_changed' /tmp/strategy_factory.json)" = "false"
          test "$(jq -r '.safety.live_strategy_changed' /tmp/strategy_factory.json)" = "false"
          jq -e 'all(.decision.gates[]; (.passed | type) == "boolean")' \
            /tmp/strategy_factory.json >/dev/null
          set +e
          uv run python scripts/factory_evidence_gate.py \
            --evidence /tmp/strategy_factory.json \
            --json-out /tmp/factory_evidence_v3.json
          v3_exit=$?
          set -e
          [[ "${v3_exit}" == "0" || "${v3_exit}" == "3" ]]
          test "$(jq -r '.contract_version' /tmp/factory_evidence_v3.json)" = \
            "calibrated-family-entry-v3.1"
          test "$(jq -r '.global_audit_trial_count' /tmp/factory_evidence_v3.json)" = "800"
          test "$(jq -r '.program_multiplicity.method' /tmp/factory_evidence_v3.json)" = \
            "calibrated-family-risk-budget-v1"
          cat /tmp/LAST_RUN.md

      - name: Preserve trials and suppress an identical completed batch
        id: ledger
        run: |
          set -euo pipefail
          batch_id="$(jq -r '.batch_id' /tmp/strategy_factory.json)"
          if jq -e --arg batch_id "${batch_id}" \
              'select(.batch_id == $batch_id)' /tmp/trial_ledger_prior.jsonl >/dev/null; then
            cp /tmp/trial_ledger_prior.jsonl /tmp/trial_ledger.jsonl
            echo "duplicate=true" >> "$GITHUB_OUTPUT"
          else
            cp /tmp/trial_ledger_prior.jsonl /tmp/trial_ledger.jsonl
            jq -c '. as $root | .trial_records[] | . + {
              batch_id: $root.batch_id,
              data_fingerprint: $root.accounting_factor_data_fingerprint,
              prior_data_fingerprint: "turn-of-month-equity-factory-sidecar",
              code_commit: $root.code_commit,
              timestamp_utc: $root.timestamp_utc
            }' /tmp/strategy_factory.json >> /tmp/trial_ledger.jsonl
            echo "duplicate=false" >> "$GITHUB_OUTPUT"
          fi
          jq -c '.audit_records[]' /tmp/strategy_factory.json > /tmp/audit_catalog.jsonl
          test "$(wc -l < /tmp/audit_catalog.jsonl | tr -d ' ')" = "800"
          test "$(jq -r '.strategy_fingerprint' /tmp/audit_catalog.jsonl | sort -u | wc -l | tr -d ' ')" = "800"
          jq '{
            schema_version,
            batch_id,
            verdict: .decision.verdict,
            failed_gates: [.decision.gates[] | select(.passed == false) | .gate_id],
            next_strategy_family: .decision.next_strategy_family,
            next_batch_sequence: null,
            search_space_exhausted: .decision.search_space_exhausted,
            multiplicity_trial_count,
            suppress_batch_id: .batch_id,
            safety: "research only; no orders or capital change"
          }' /tmp/strategy_factory.json > /tmp/next_search.json

      - name: Publish evidence sidecar
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DUPLICATE: ${{ steps.ledger.outputs.duplicate }}
        run: |
          set -euo pipefail
          BRANCH=automation/autonomous-strategy-factory-last-run
          tmpdir="$(mktemp -d)"
          cp /tmp/strategy_factory.json "${tmpdir}/strategy_factory.json" \
            2>/dev/null || echo '{}' > "${tmpdir}/strategy_factory.json"
          cp /tmp/macro_strategy_factory.json "${tmpdir}/macro_strategy_factory.json" \
            2>/dev/null || echo '{}' > "${tmpdir}/macro_strategy_factory.json"
          cp /tmp/treasury_carry_factory.json "${tmpdir}/treasury_carry_factory.json" \
            2>/dev/null || echo '{}' > "${tmpdir}/treasury_carry_factory.json"
          cp /tmp/credit_spread_factory.json "${tmpdir}/credit_spread_factory.json" \
            2>/dev/null || echo '{}' > "${tmpdir}/credit_spread_factory.json"
          cp /tmp/fx_carry_factory.json "${tmpdir}/fx_carry_factory.json" \
            2>/dev/null || echo '{}' > "${tmpdir}/fx_carry_factory.json"
          cp /tmp/commodity_term_structure_factory.json "${tmpdir}/commodity_term_structure_factory.json" \
            2>/dev/null || echo '{}' > "${tmpdir}/commodity_term_structure_factory.json"
          cp /tmp/commodity_positioning_factory.json "${tmpdir}/commodity_positioning_factory.json" \
            2>/dev/null || echo '{}' > "${tmpdir}/commodity_positioning_factory.json"
          cp /tmp/commodity_supply_demand_factory.json "${tmpdir}/commodity_supply_demand_factory.json" \
            2>/dev/null || echo '{}' > "${tmpdir}/commodity_supply_demand_factory.json"
          cp /tmp/usda_crop_supply_demand_factory.json "${tmpdir}/usda_crop_supply_demand_factory.json" \
            2>/dev/null || echo '{}' > "${tmpdir}/usda_crop_supply_demand_factory.json"
          cp /tmp/energy_cross_market_factory.json "${tmpdir}/energy_cross_market_factory.json" \
            2>/dev/null || echo '{}' > "${tmpdir}/energy_cross_market_factory.json"
          cp /tmp/options_variance_risk_premium_factory.json "${tmpdir}/options_variance_risk_premium_factory.json" \
            2>/dev/null || echo '{}' > "${tmpdir}/options_variance_risk_premium_factory.json"
          cp /tmp/turn_of_month_equity_factory.json "${tmpdir}/turn_of_month_equity_factory.json" \
            2>/dev/null || echo '{}' > "${tmpdir}/turn_of_month_equity_factory.json"
          cp /tmp/strategy_factory.json "${tmpdir}/accounting_factor_factory.json" \
            2>/dev/null || echo '{}' > "${tmpdir}/accounting_factor_factory.json"
          cp /tmp/real_world_gate_controls.json "${tmpdir}/real_world_gate_controls.json" \
            2>/dev/null || echo '{}' > "${tmpdir}/real_world_gate_controls.json"
          cp /tmp/full_gate_controls.json "${tmpdir}/full_gate_controls.json" \
            2>/dev/null || echo '{}' > "${tmpdir}/full_gate_controls.json"
          cp /tmp/edge_gate_calibration.json "${tmpdir}/edge_gate_calibration.json" \
            2>/dev/null || echo '{}' > "${tmpdir}/edge_gate_calibration.json"
          cp /tmp/trial_ledger.jsonl "${tmpdir}/trial_ledger.jsonl" \
            2>/dev/null || : > "${tmpdir}/trial_ledger.jsonl"
          cp /tmp/audit_catalog.jsonl "${tmpdir}/audit_catalog.jsonl" \
            2>/dev/null || : > "${tmpdir}/audit_catalog.jsonl"
          cp /tmp/next_search.json "${tmpdir}/next_search.json" \
            2>/dev/null || echo '{}' > "${tmpdir}/next_search.json"
          {
            if [[ -f /tmp/LAST_RUN.md ]]; then cat /tmp/LAST_RUN.md; else
              echo '# 자동 전략 공장 - 실행 실패'
            fi
            echo ''
            echo '## workflow metadata'
            echo ''
            echo '| 항목 | 값 |'
            echo '|---|---|'
            echo "| run_id | ${GITHUB_RUN_ID} |"
            echo "| commit | ${GITHUB_SHA} |"
            echo "| timestamp_utc | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            echo "| identical_batch_suppressed | ${DUPLICATE:-unknown} |"
            echo '| safety | no broker API, no orders, no capital change |'
          } > "${tmpdir}/LAST_RUN.md"
          cd "${tmpdir}"
          git init -q
          git config user.name "strategy-factory-bot"
          git config user.email "strategy-factory-bot@noreply.github.com"
          git checkout --orphan publish -q
          python3 "${GITHUB_WORKSPACE}/scripts/redact_public_sidecar.py" .
          python3 "${GITHUB_WORKSPACE}/scripts/validate_public_factory_sidecar.py" \
            --strategy-json strategy_factory.json \
            --audit-catalog audit_catalog.jsonl \
            --trial-ledger trial_ledger.jsonl
          git add LAST_RUN.md strategy_factory.json macro_strategy_factory.json \
            treasury_carry_factory.json \
            credit_spread_factory.json \
            fx_carry_factory.json \
            commodity_term_structure_factory.json \
            commodity_positioning_factory.json \
            commodity_supply_demand_factory.json \
            usda_crop_supply_demand_factory.json \
            energy_cross_market_factory.json \
            options_variance_risk_premium_factory.json \
            turn_of_month_equity_factory.json \
            accounting_factor_factory.json \
            real_world_gate_controls.json \
            full_gate_controls.json \
            edge_gate_calibration.json \
            trial_ledger.jsonl audit_catalog.jsonl next_search.json
          git commit -q -m "strategy-factory run ${GITHUB_RUN_ID} @ ${GITHUB_SHA:0:7}"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "publish:${BRANCH}"
