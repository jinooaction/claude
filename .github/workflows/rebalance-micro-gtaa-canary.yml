              "음수=거부가 결과적으로 유리. 수수료·세금·환율·실제 체결 가능성 제외."
          )
          print("")
          print("| 항목 | 값 |")
          print("|------|-----|")
          print(f"| as_of_utc | {opp.get('as_of_utc') or '?'} |")
          print(f"| rejected_count | {opp.get('rejected_count', 0)} |")
          print(f"| valued_count | {opp.get('valued_count', 0)} |")
          print(f"| total_opportunity_pnl_usd | {opp.get('total_opportunity_pnl_usd', '+0.00')} |")
          print(f"| buy_opportunity_pnl_usd | {opp.get('buy_opportunity_pnl_usd', '+0.00')} |")
          print(f"| sell_opportunity_pnl_usd | {opp.get('sell_opportunity_pnl_usd', '+0.00')} |")
          if opp.get("missing_mark_symbols"):
              print(f"| missing_mark_symbols | {', '.join(opp['missing_mark_symbols'])} |")
          if opp.get("mark_fetch_error"):
              print(f"| mark_fetch_error | {opp['mark_fetch_error']} |")
          rows = opp.get("rows") if isinstance(opp.get("rows"), list) else []
          if rows:
              print("")
              print("| 종목 | 방향 | 수량 | 거부가 | 현재가 | 기회손익 | 수익률 | 상태 |")
              print("|------|------|------|--------|--------|----------|--------|------|")
              for row in rows:
                  print(
                      "| {symbol} | {side} | {qty} | {price} | {mark} | {pnl} | {pct} | {state} |".format(
                          symbol=row.get("symbol", "?"),
                          side=row.get("side", "?"),
                          qty=row.get("qty", "?"),
                          price=row.get("intended_price_usd", "?"),
                          mark=row.get("current_mark_usd") or "N/A",
                          pnl=row.get("opportunity_pnl_usd") or "N/A",
                          pct=row.get("opportunity_return_pct") or "N/A",
                          state=row.get("state", "?"),
                      )
                  )
          PY
            echo ""
            echo '```json'
            cat /tmp/micro_opportunity.json 2>/dev/null || echo '{}'
            echo '```'
            echo ""
            echo "## 거부 주문 누적 평가"
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          def load(path: str) -> dict:
              try:
                  text = Path(path).read_text(encoding="utf-8").strip()
              except FileNotFoundError:
                  return {}
              if not text:
                  return {}
              try:
                  data = json.loads(text)
              except json.JSONDecodeError:
                  return {}
              return data if isinstance(data, dict) else {}

          monitor = load("/tmp/micro_opportunity_monitor.json")
          counts = monitor.get("counts") if isinstance(monitor.get("counts"), dict) else {}
          cumulative = (
              monitor.get("cumulative")
              if isinstance(monitor.get("cumulative"), dict)
              else {}
          )
          streaks = monitor.get("streaks") if isinstance(monitor.get("streaks"), dict) else {}
          latest = monitor.get("latest") if isinstance(monitor.get("latest"), dict) else {}
          print("기준: 음수=전략 의도가 손실이었을 가능성, 양수=거부 때문에 이익을 놓쳤을 가능성.")
          print("단일 신호로 주문 재시도·전략 교체·자본 변경을 하지 않는다.")
          print("")
          print("| 항목 | 값 |")
          print("|------|-----|")
          print(f"| verdict | {monitor.get('verdict', '?')} ({monitor.get('verdict_label_ko', '?')}) |")
          print(f"| latest_signal | {monitor.get('latest_signal', '?')} |")
          print(f"| cumulative_pnl_usd | {cumulative.get('total_intended_order_mark_pnl_usd', '+0.00')} |")
          print(f"| valued_runs | {counts.get('valued_records', 0)}/{counts.get('records', 0)} |")
          print(f"| valued_orders | {counts.get('valued_orders', 0)}/{counts.get('rejected_orders', 0)} |")
          print(f"| streak_loss_gain | {streaks.get('intent_loss', 0)} / {streaks.get('intent_gain', 0)} |")
          print(f"| latest_run | {latest.get('run_id') or '?'} |")
          print(f"| next_action | {monitor.get('next_action_ko', '?')} |")
          PY
            echo ""
            echo '```json'
            cat /tmp/micro_opportunity_monitor.json 2>/dev/null || echo '{}'
            echo '```'
            echo ""
            echo "## 측정 로그"
            echo '```'
            cat /tmp/micro_measure.log 2>/dev/null || echo '(none)'
            echo '```'
          } > LAST_RUN.md
          git checkout --orphan publish
          git add LAST_RUN.md opportunity_history.json opportunity_monitor.json
          git commit -q -m "micro-gtaa run ${GITHUB_RUN_ID} (armed=${ARMED:-?})"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "publish:${BRANCH}"
          echo "Published to ${BRANCH}."

      - name: Notify Telegram — micro GTAA result
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          ARMED: ${{ steps.gate.outputs.armed }}
          CAP: ${{ steps.gate.outputs.capital }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          EFFECTIVE_SIDE: ${{ steps.preflight.outputs.effective_side }}
        run: |
          set +e
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "Telegram secrets absent; skipping notification."
            exit 0
          fi
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          def load_json(path: str) -> object:
              try:
                  text = Path(path).read_text(encoding="utf-8").strip()
              except FileNotFoundError:
                  return None
              if not text or text.startswith("("):
                  return None
              try:
                  return json.loads(text)
              except json.JSONDecodeError:
                  return None

          def short(value: object, limit: int = 180) -> str:
              text = "" if value is None else str(value)
              return text if len(text) <= limit else text[:limit] + "...<truncated>"

          preflight = load_json("/tmp/micro_preflight.json")
          live = load_json("/tmp/micro_live.json")
          preview = load_json("/tmp/micro_preview.json")
          opportunity = load_json("/tmp/micro_opportunity.json")
          opportunity_monitor = load_json("/tmp/micro_opportunity_monitor.json")

          preflight_reason = None
          preflight_ok = None
          if isinstance(preflight, dict):
              preflight_ok = preflight.get("ok")
              preflight_reason = preflight.get("reason")

          def rows(doc: object) -> list[dict]:
              if not isinstance(doc, dict):
                  return []
              value = doc.get("results")
              return [row for row in value if isinstance(row, dict)] if isinstance(value, list) else []

          def label_state(state: object) -> str:
              labels = {
                  "SUBMITTED": "접수됨(체결은 별도 확인)",
                  "FILLED": "체결됨",
                  "PAPER_FILLED": "페이퍼 체결",
                  "REJECTED_BY_BROKER": "브로커 거부(접수/체결 안 됨)",
                  "REJECTED_BY_GATE": "게이트 거부(브로커 제출 안 됨)",
                  "DRY_RUN": "미리보기",
                  "SKIPPED_PER_TRADE_CAP": "캡 미달로 건너뜀",
              }
              return labels.get(str(state), str(state))

          live_rows = rows(live)
          preview_rows = rows(preview)
          order_lines: list[str] = []
          if live_rows:
              for row in live_rows[:8]:
                  order_lines.append(
                      "- {symbol} {side} {qty}주 @{price}: {state}{reason}".format(
                          symbol=row.get("symbol", "?"),
                          side=row.get("side", "?"),
                          qty=row.get("routed_qty") or row.get("requested_qty") or "?",
                          price=row.get("limit_price_usd") or "?",
                          state=label_state(row.get("state")),
                          reason=(
                              f" / 사유: {short(row.get('reason'), 100)}"
                              if row.get("reason")
                              else ""
                          ),
                      )
                  )
          if not order_lines and preview_rows:
              planned = [
                  f"{row.get('symbol')} {row.get('side')} {row.get('routed_qty')}주"
                  for row in preview_rows[:8]
              ]
              if planned:
                  order_lines.append("- 미리보기: " + "; ".join(planned))

          rejected_count = 0
          submitted_count = 0
          for row in live_rows:
              state = str(row.get("state"))
              if state.startswith("REJECTED"):
                  rejected_count += 1
              if state == "SUBMITTED":
                  submitted_count += 1

          if os.environ.get("ARMED") != "true":
              headline = "미리보기만 실행(실주문 0건)"
          elif os.environ.get("LIVE_OUTCOME") != "success":
              headline = "실주문 단계 미실행 또는 실패"
          elif rejected_count:
              headline = f"실주문 시도 후 거부 {rejected_count}건"
          elif submitted_count:
              headline = f"브로커 접수 {submitted_count}건"
          else:
              headline = "실주문 단계 성공, 주문 결과 확인 필요"

          opportunity_lines: list[str] = []
          if isinstance(opportunity, dict):
              opportunity_lines.append(
                  "- 총계: {total} USD (매수 {buy}, 매도 {sell}, 평가 {valued}/{rejected}건)".format(
                      total=opportunity.get("total_opportunity_pnl_usd", "+0.00"),
                      buy=opportunity.get("buy_opportunity_pnl_usd", "+0.00"),
                      sell=opportunity.get("sell_opportunity_pnl_usd", "+0.00"),
                      valued=opportunity.get("valued_count", 0),
                      rejected=opportunity.get("rejected_count", 0),
                  )
              )
              for row in (opportunity.get("rows") or [])[:5]:
                  if not isinstance(row, dict):
                      continue
                  opportunity_lines.append(
                      "- {symbol} {side} {qty}주 @{price} -> 현재 {mark}: {pnl} USD ({pct})".format(
                          symbol=row.get("symbol", "?"),
                          side=row.get("side", "?"),
                          qty=row.get("qty", "?"),
                          price=row.get("intended_price_usd", "?"),
                          mark=row.get("current_mark_usd") or "N/A",
                          pnl=row.get("opportunity_pnl_usd") or "N/A",
                          pct=row.get("opportunity_return_pct") or "N/A",
                      )
                  )
              if opportunity.get("missing_mark_symbols"):
                  opportunity_lines.append(
                      "- 현재가 없음: " + ", ".join(opportunity["missing_mark_symbols"])
                  )
              if opportunity.get("mark_fetch_error"):
                  opportunity_lines.append(
                      "- 현재가 조회 오류: " + short(opportunity.get("mark_fetch_error"), 160)
                  )
          if not opportunity_lines:
              opportunity_lines.append("- 평가할 거부 주문 없음")

          monitor_lines: list[str] = []
          if isinstance(opportunity_monitor, dict):
              counts = (
                  opportunity_monitor.get("counts")
                  if isinstance(opportunity_monitor.get("counts"), dict)
                  else {}
              )
              cumulative = (
                  opportunity_monitor.get("cumulative")
                  if isinstance(opportunity_monitor.get("cumulative"), dict)
                  else {}
              )
              streaks = (
                  opportunity_monitor.get("streaks")
                  if isinstance(opportunity_monitor.get("streaks"), dict)
                  else {}
              )
              latest = (
                  opportunity_monitor.get("latest")
                  if isinstance(opportunity_monitor.get("latest"), dict)
                  else {}
              )
              monitor_lines.extend(
                  [
                      "- verdict: {verdict} ({label})".format(
                          verdict=opportunity_monitor.get("verdict", "?"),
                          label=opportunity_monitor.get("verdict_label_ko", "?"),
                      ),
                      "- 누적 전략 의도 손익: {pnl} USD (평가 실행 {runs}/{total_runs}, 평가 주문 {orders}/{total_orders})".format(
                          pnl=cumulative.get("total_intended_order_mark_pnl_usd", "+0.00"),
                          runs=counts.get("valued_records", 0),
                          total_runs=counts.get("records", 0),
                          orders=counts.get("valued_orders", 0),
                          total_orders=counts.get("rejected_orders", 0),
                      ),
                      "- 최신 신호: {signal}, 최신 pnl: {pnl} USD, 연속 손실/이익: {loss}/{gain}".format(
                          signal=opportunity_monitor.get("latest_signal", "FLAT_OR_UNVALUED"),
                          pnl=latest.get("total_intended_order_mark_pnl_usd", "N/A"),
                          loss=streaks.get("intent_loss", 0),
                          gain=streaks.get("intent_gain", 0),
                      ),
                      "- 다음 조치: " + short(opportunity_monitor.get("next_action_ko"), 220),
                      "- 안전: " + short(opportunity_monitor.get("safety_note_ko"), 180),
                  ]
              )
          if not monitor_lines:
              monitor_lines.append("- 누적 평가 없음")

          lines = [
              "[auto-invest] micro GTAA 실행 결과",
              f"상태: {headline}",
              "",
              "1. 실행",
              f"- run_id: {os.environ.get('RUN_ID')} / event: {os.environ.get('EVENT')}",
              f"- armed: {os.environ.get('ARMED')} / capital_usd: {os.environ.get('CAP')}",
              f"- effective_side: {os.environ.get('EFFECTIVE_SIDE') or 'skipped'}",
              f"- live_step: {os.environ.get('LIVE_OUTCOME') or 'skipped'}",
              "",
              "2. 라이브 전제 확인",
              f"- preflight_ok: {preflight_ok}",
              f"- reason: {short(preflight_reason)}",
              "",
              "3. 주문 결과",
          ]
          lines.extend(order_lines or ["- 주문 결과 없음"])
          lines.extend(
              [
                  "",
                  "4. 거부 주문 기회손익",
                  "- 기준: 양수=체결됐으면 현재 더 유리, 음수=거부가 결과적으로 유리",
              ]
          )
          lines.extend(opportunity_lines)
          lines.extend(
              [
                  "",
                  "5. 누적 전략/실행 평가",
                  "- 기준: 음수=전략 의도 손실 검토, 양수=실행 경로 손실 검토",
              ]
          )
          lines.extend(monitor_lines)
          lines.extend(["", "6. 확인 링크", os.environ.get("RUN_URL", "")])
          text = "\n".join(lines)
          if len(text) > 3800:
              text = text[:3800] + "\n...<truncated>"

          url = f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage"
          body = json.dumps(
              {
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "text": text,
                  "disable_web_page_preview": True,
              }
          ).encode("utf-8")
          req = urllib.request.Request(
              url,
              data=body,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as response:
                  response.read()
          except urllib.error.HTTPError as exc:
              print(f"Telegram notification failed: HTTPError status={exc.code}")
              raise SystemExit(0)
          except (urllib.error.URLError, TimeoutError, OSError) as exc:
              print(f"Telegram notification failed: {type(exc).__name__}")
              raise SystemExit(0)
          print("Telegram notification sent.")
          PY
