            else
              echo "> 무장 상태이나 이번 실행은 실주문 없음(event=${EVENT:-?}). push 이벤트는 미리보기만 한다."
            fi
            echo ""
            echo "## 계좌 전체 재배치 상태"
          python - <<'PY'
          from __future__ import annotations

