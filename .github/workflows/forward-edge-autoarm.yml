name: Capital ladder gate (forward edge -> rung promotions/demotions)

# 스펙 050 — 자본 사다리 게이트. 스펙 049(EDGE_CONFIRMED → 무장)를 승계·확장한다.
#
# 운영자 위임(2026-06-11): "자본·수단도 자동과 자율에 맡긴다. 기준은 계좌 잔고와
# 포트폴리오." (헌법 X.4 v9.0.0). 자본 배치 규모를 증거 게이트 공식으로 결정한다:
#
#   단0=0% → 단1=10% 연구 → 단2=20% 탐색 → 단3=25% → 단4=50% → 단5=100%
#   - 단 0→1: EDGE_CONFIRMED 또는 정확 배포전략의 장기 홀드아웃+forward floor+hardening.
#   - 단 1→2: forward 페이퍼 EDGE_CONFIRMED + live 증거를 다시 요구한다.
#   - 승격(단 n→n+1): 그 단에서 라이브 관측 ≥20 + ≥27일 경과 + 낙폭 < 예산/2(10%).
#   - 강등: 낙폭 ≥ 예산/2(10%) → 한 단 아래(즉시). 정지: 낙폭 ≥ 예산(20%) → 단 0.
#   - 재사이징: 계좌 NAV ±10% 드리프트(입금/성장) → 자본만 재계산.
#
# 안전 (돈을 잃지 않게):
#   - 결정은 *테스트된* src 모듈(capital_ladder.py)이 한다 — 이 YAML 은 얇다.
#   - 내려가는 건 낙폭 하나로 즉시, 올라가는 건 세 증거 전부(없으면 STAY, 절대 승격 아님).
#   - 계좌 NAV 조회 실패 = BLOCKED(상태 무변경, fail-closed). 검증=배치 정합 불일치 = BLOCKED.
#   - 센티넬 머지 자체는 미리보기만 — 실주문은 rebalance-live-canary.yml 의 시장시간
#     스케줄에서만. 빠른 장중 방어선은 스펙 014 서킷 브레이커(이 게이트는 느린 거버너).
#   - 즉시 정지: automation/AUTOARM_DISABLED 파일을 main 에 두면 게이트가 DISABLED no-op.
#   - 단 0→1 가속: 표준 20일 forward 판정에 더해, 깊은 OOS + 짧은 forward 지속성
#     앵커드 판정도 함께 본다. 앵커드 산출 실패는 미확정으로 처리해 기존 fail-safe 유지.
#   - 결과는 사이드카 automation/edge-autoarm-last-run 으로 발행:
#       git show origin/automation/edge-autoarm-last-run:LAST_RUN.md
#
# 헌법 X.4 v9.0.0: 자본 사다리는 운영자의 상시 위임에 따른 자율 운영. 비위임 불변
# (K1 캡 체계·화이트리스트·감사·서킷 브레이커·낙폭 예산 소유권)은 그대로다.

on:
  schedule:
    - cron: "50 23 * * 1-5"  # paper-forward(22:30 UTC) 누적 후. 평일.
  workflow_dispatch:

permissions:
  contents: write       # 사이드카 force-push + 사다리 브랜치 push.
  pull-requests: write  # 사다리 PR open/merge.

concurrency:
  group: forward-edge-autoarm
  cancel-in-progress: false

jobs:
  ladder:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (fresh main — correct configs + sentinel for the decision)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Read exact deployed-strategy profit evidence (read-only sidecar)
        run: |
          set -uo pipefail
          git fetch origin automation/profit-evidence-engine-last-run || true
          git fetch origin automation/autonomous-strategy-factory-last-run || true
          if ! git show origin/automation/profit-evidence-engine-last-run:profit_evidence.json \
              > /tmp/profit_evidence.json 2>/tmp/profit_evidence.err; then
            echo '{}' > /tmp/profit_evidence.json
            cat /tmp/profit_evidence.err || true
          fi
          jq '.deployment_match // {}' /tmp/profit_evidence.json
          if ! git show \
              origin/automation/autonomous-strategy-factory-last-run:strategy_factory.json \
              > /tmp/strategy_factory.json 2>/tmp/strategy_factory.err; then
            echo '{}' > /tmp/strategy_factory.json
            cat /tmp/strategy_factory.err || true
          fi
          factory_epoch="$(git show -s --format=%ct \
            origin/automation/autonomous-strategy-factory-last-run 2>/dev/null || echo 0)"
          now_epoch="$(date +%s)"
          python3 -c \
            "print((int('${now_epoch}')-int('${factory_epoch}'))/3600 if int('${factory_epoch}') else 999999)" \
            > /tmp/strategy_factory_age_hours
          jq '.decision // {}' /tmp/strategy_factory.json

      - name: Validate versioned factory evidence contract (read-only)
        id: factory_contract
        run: |
          set +e
          uv run python scripts/factory_evidence_gate.py \
            --evidence /tmp/strategy_factory.json \
            --json-out /tmp/factory_evidence_assessment.json
          status=$?
          set -e
          if [[ "${status}" == "0" ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ ! -s /tmp/factory_evidence_assessment.json ]]; then
            echo '{"eligible":false,"reasons":["assessment_unavailable"]}' \
              > /tmp/factory_evidence_assessment.json
          fi
          cat /tmp/factory_evidence_assessment.json

      - name: Install SSH key
        env:
          KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VULTR_SSH_KNOWN_HOSTS }}
          SSH_USER: ${{ secrets.VULTR_SSH_USER }}
        run: |
          VULTR_SSH_PRIVATE_KEY="${KEY:-}" \
          VULTR_SSH_KNOWN_HOSTS="${KNOWN_HOSTS:-}" \
          VULTR_SSH_USER="${SSH_USER:-}" \
          ./scripts/ci_secure_ssh.sh

      - name: Read ladder state from sentinel (for the live evidence query)
        id: state
        run: |
          set -uo pipefail
          REQ=automation/rebalance-live.request
          armed="$(grep -E '^armed:' "$REQ" 2>/dev/null | head -1 | awk '{print $2}' || true)"
          entered="$(grep -E '^rung_entered:' "$REQ" 2>/dev/null | head -1 | awk '{print $2}' || true)"
          capital="$(grep -E '^capital_usd:' "$REQ" 2>/dev/null | head -1 | awk '{print $2}' || true)"
          echo "armed=${armed:-false}" >> "$GITHUB_OUTPUT"
          echo "entered=${entered:-}" >> "$GITHUB_OUTPUT"
          echo "capital=${capital:-}" >> "$GITHUB_OUTPUT"
          echo "armed=${armed:-false} rung_entered=${entered:-(none)} capital=${capital:-(none)}"

      - name: Assign a complete factory winner at zero capital first
        id: factory_assignment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARMED: ${{ steps.state.outputs.armed }}
          FACTORY_CONTRACT_ELIGIBLE: ${{ steps.factory_contract.outputs.eligible }}
        run: |
          set -euo pipefail
          echo "changed=false" >> "$GITHUB_OUTPUT"
          [[ "${ARMED:-false}" == "false" ]] || exit 0
          [[ "${FACTORY_CONTRACT_ELIGIBLE:-false}" == "true" ]] || exit 0
          [[ "$(awk '{print ($1 >= 0.0 && $1 <= 36.0) ? "fresh" : "stale"}' /tmp/strategy_factory_age_hours)" == "fresh" ]] || exit 0
          jq -er '.decision.selected_deploy_config' /tmp/strategy_factory.json \
            > /tmp/factory_selected_portfolio.toml
          FACTORY_CONFIG=/tmp/factory_selected_portfolio.toml \
          FACTORY_JSON=/tmp/strategy_factory.json uv run python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path
          from auto_invest.config.rules import PortfolioRebalanceConfig
          from auto_invest.portfolio.autoarm import strategy_fingerprint_digest

          raw = tomllib.loads(Path(os.environ["FACTORY_CONFIG"]).read_text())
          cfg = PortfolioRebalanceConfig.model_validate(raw["portfolio"])
          evidence = json.loads(Path(os.environ["FACTORY_JSON"]).read_text())
          expected = evidence["decision"]["selected_strategy_fingerprint"]
          assert strategy_fingerprint_digest(cfg) == expected
          assert set(raw["whitelist"]["symbols"]) == {"SPYM", "IEF", "GLDM"}
          assert raw["whitelist"]["order_types"] == ["LIMIT"]
          assert raw["whitelist"]["sessions"] == ["REGULAR"]
          assert raw["account_rebalance"]["cash_buffer_pct"] == "0.01"
          PY
          if cmp -s /tmp/factory_selected_portfolio.toml deploy/canary-live-portfolio.toml; then
            exit 0
          fi
          cp /tmp/factory_selected_portfolio.toml deploy/canary-live-portfolio.toml
          candidate="$(jq -r '.decision.selected_candidate_id' /tmp/strategy_factory.json)"
          BRANCH="automation/strategy-factory-assignment/${GITHUB_RUN_ID}"
          git config user.name "strategy-factory-assignment-bot"
          git config user.email "strategy-factory-assignment-bot@noreply.github.com"
          git checkout -b "${BRANCH}"
          git add deploy/canary-live-portfolio.toml
          git commit -m "feat(150): stage factory winner ${candidate} at rung 0" \
            -m "this changes the safety perimeter"
          git push -u origin "${BRANCH}"
          cat > /tmp/factory_assignment_pr.md <<EOF
          # 변경 요약

          - 자동 전략 공장 전체 관문을 통과한 `${candidate}` 설정을 자본 0, 무장 해제 상태에서 배포 후보로 지정한다.

          ## 위험 등급

          - [ ] 등급 0: 설명·조사
          - [ ] 등급 1: 일반 코드
          - [ ] 등급 2: 운영 체계
          - [ ] 등급 3: 안전 경계
          - [x] 등급 4: 돈 경로 변경

          ## 문제 정의

          - 요청: 합격 전략을 사람 개입 없이 제한된 연구 캐너리로 연결한다.
          - 실제 목표: 검증 설정과 주문 설정을 일치시킨 뒤 정확한 배포 설정으로 다시 강화 검사한다.
          - 비목표: 이 PR에서 무장, 주문, 자본 배분을 하지 않는다.
          - 위험: 잘못된 설정 교체가 다음 주문 후보를 바꿀 수 있다.
          - 완료 기준: 사전등록 가족 100% 완주, 네 필수 누적 감사 관문, 모든 차단 관문, 지문, whitelist, LIMIT, REGULAR, 현금 1%가 일치한다.

          ## 탐색 근거

          - 읽은 파일: strategy_factory.json, 현재 live 포트폴리오, 무장 센티넬
          - 확인한 실행 경로: 자본 0 설정 교체 → 배포 → exact hardened canary → 별도 10% 승격 PR
          - 제거하거나 줄인 기능: 없음
          - 남긴 기능 또는 대체 수단: K1/K2, 손실 예산, 정규장, 서명, nonce, 감사, 킬스위치

          ## 변경 내용

          - 자본 0에서 live 포트폴리오 설정만 공장 승자와 일치시킨다.

          ## 검증

          - [x] 버전별 사전등록 가족 전체 시도, 누적 고유 감사, 모든 차단 관문 PASS
          - [x] 전략 지문 exact match와 주문 안전 설정 검사
          - [ ] `uv run pytest` (PR CI)
          - [ ] `uv run ruff check src tests` (PR CI)

          ## 하네스 검증

          - 하네스 평가: 기능 PR에서 strict PASS, 이 PR은 생성된 설정 1개만 변경
          - HANDOFF 검증: 기능 PR에서 PASS, 이 PR은 자본 0 설정 지정만 수행

          ## 안전 경계

          - Kernel 터치: 없음
          - 안전 경계 변경: 있음, 헌법 X.4 v9.0.0의 연구 캐너리 적용
          - 돈 경로 변경: 전략 후보 설정 변경, 현재 자본 0·주문 0
          - 감사 로그·비밀값·주문 제한 영향: 기존 경계를 그대로 사용

          ## 인계

          - 다음 세션이 알아야 할 상태: 설정 배포 후 exact hardened canary가 다시 PASS해야 10% 승격 가능
          - 남은 위험: 배포 전 또는 지문 불일치면 자본 0 유지
          - 실행하지 못한 검증: 실제 주문은 이 PR에서 금지

          ## 자동 머지 준비

          - [x] 작업 완료
          - [ ] 테스트 통과 (PR CI)
          - [ ] 린트 깨끗함 (PR CI)
          - [ ] PR 머지 가능 상태 확인
          - [x] `WIP` 또는 `DO NOT MERGE` 표식 없음
          - [x] Kernel 터치 없음
          EOF
          pr_url="$(gh pr create --base main --head "${BRANCH}" \
            --title "feat(150): 자본 0에서 공장 승자 ${candidate} 지정" \
            --body-file /tmp/factory_assignment_pr.md)"
          if gh pr merge "${pr_url}" --auto --merge; then
            echo "factory assignment waits for required PR checks before merge"
          else
            echo "auto-merge unavailable; assignment PR remains ready for the next autonomous session"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "pr_url=${pr_url}" >> "$GITHUB_OUTPUT"

      - name: Compute forward verdict on instance (read-only, ensemble paper track)
        if: steps.factory_assignment.outputs.changed != 'true'
        id: verdict
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
        run: |
          set +e
          port="${PORT:-22}"
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "observe ladder-forward-verdict" \
              > /tmp/verdict_global.json 2>/tmp/verdict_global.err
          echo "ssh_exit=$?" >> "$GITHUB_OUTPUT"
          echo "--- verdict ---"; cat /tmp/verdict_global.json
          echo "--- stderr ---"; cat /tmp/verdict_global.err
          # 판정 JSON 이 비었으면 빈 객체로 — ladder-decide 가 보수적으로 WAIT_EDGE 처리.
          if [[ ! -s /tmp/verdict_global.json ]]; then echo '{}' > /tmp/verdict_global.json; fi

      - name: Compute anchored verdict on instance (read-only, deep OOS + short forward)
        if: steps.factory_assignment.outputs.changed != 'true'
        id: anchored
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
        run: |
          set +e
          port="${PORT:-22}"
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "observe ladder-anchored-verdict" \
              > /tmp/anchored_global.json 2>/tmp/anchored_global.err
          echo "ssh_exit=$?" >> "$GITHUB_OUTPUT"
          echo "--- anchored verdict ---"; cat /tmp/anchored_global.json
          echo "--- stderr ---"; cat /tmp/anchored_global.err
          # 앵커드 산출 실패/공백은 미확정으로 흡수 — 표준 20일 판정만 남아 fail-safe.
          if [[ ! -s /tmp/anchored_global.json ]]; then echo '{}' > /tmp/anchored_global.json; fi

      - name: Harden exact deployed candidate before exploration capital (isolated, no orders)
        if: steps.factory_assignment.outputs.changed != 'true'
        id: exploration_canary
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
        run: |
          set +e
          port="${PORT:-22}"
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "observe exploration-canary" \
              > /tmp/exploration_canary.json 2>/tmp/exploration_canary.err
          echo "ssh_exit=$?" >> "$GITHUB_OUTPUT"
          if [[ ! -s /tmp/exploration_canary.json ]]; then echo '{}' > /tmp/exploration_canary.json; fi
          echo "--- exploration hardened canary ---"; cat /tmp/exploration_canary.json
          echo "--- stderr ---"; cat /tmp/exploration_canary.err

      - name: Measure live evidence on instance (account NAV + growth since rung entry)
        if: steps.factory_assignment.outputs.changed != 'true'
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
          ENTERED: ${{ steps.state.outputs.entered }}
          CAPITAL: ${{ steps.state.outputs.capital }}
        run: |
          set +e
          port="${PORT:-22}"
          # 실계좌 NAV (사이징 기준 — 운영자 위임 "기준은 계좌 잔고"). 실패 = 빈 파일 =
          # ladder-decide 가 BLOCKED(상태 무변경, fail-closed).
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "observe account-nav" \
              > /tmp/account_nav.json 2>/tmp/account_nav.err
          echo "--- account NAV ---"; cat /tmp/account_nav.json; cat /tmp/account_nav.err
          research_capital="$(python3 - <<'PY'
          import json
          from decimal import Decimal, ROUND_FLOOR
          try:
              nav = Decimal(str(json.load(open('/tmp/account_nav.json'))['total_value_usd']))
              print(int((nav * Decimal('0.10')).to_integral_value(rounding=ROUND_FLOOR)))
          except Exception:
              print(0)
          PY
          )"
          if [[ "${research_capital}" -gt 0 ]]; then
            ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=15 \
                -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
                "observe live-canary-preview ${research_capital}" \
                > /tmp/rung1_fundability_preview.json 2>/tmp/rung1_fundability_preview.err
          fi
          if [[ ! -s /tmp/rung1_fundability_preview.json ]]; then
            echo '{}' > /tmp/rung1_fundability_preview.json
          fi
          echo "--- rung 1 fundability preview (orders=0) ---"
          cat /tmp/rung1_fundability_preview.json /tmp/rung1_fundability_preview.err 2>/dev/null
          # 라이브 트랙 실적(현재 단 진입 이후) — 승격/강등 증거. since 가 없으면 전체.
          since_arg=""
          if [[ -n "${ENTERED}" ]]; then since_arg=" ${ENTERED}"; fi
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "observe live-growth${since_arg}" \
              > /tmp/live_growth.json 2>/tmp/live_growth.err
          echo "--- live growth ---"; cat /tmp/live_growth.json; cat /tmp/live_growth.err
          # 전략 범위 체결 수는 NAV 성장 시계열과 별도 계약이다. 현재 단의 자본으로
          # 읽기 전용 성과를 측정해 첫 체결 전 오래된 무장 회수에 사용한다.
          if [[ -n "${CAPITAL}" ]]; then
            ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=15 \
                -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
                "live-canary-profit ${CAPITAL}" \
                > /tmp/live_performance.json 2>/tmp/live_performance.err
          fi
          if [[ ! -s /tmp/live_performance.json ]]; then echo '{}' > /tmp/live_performance.json; fi
          echo "--- live strategy performance ---"
          cat /tmp/live_performance.json /tmp/live_performance.err 2>/dev/null

      - name: Decide capital ladder (tested src module; writes sentinel on change)
        id: decide
        if: steps.factory_assignment.outputs.changed != 'true'
        run: |
          set -uo pipefail
          uv run auto-invest ladder-decide \
            --verdict-json /tmp/verdict_global.json \
            --anchored-verdict-json /tmp/anchored_global.json \
            --profit-evidence-json /tmp/profit_evidence.json \
            --factory-evidence-json /tmp/strategy_factory.json \
            --factory-evidence-age-hours "$(cat /tmp/strategy_factory_age_hours)" \
            --fundability-preview-json /tmp/rung1_fundability_preview.json \
            --hardened-canary-json /tmp/exploration_canary.json \
            --live-growth-json /tmp/live_growth.json \
            --live-performance-json /tmp/live_performance.json \
            --account-nav-json /tmp/account_nav.json \
            --live-portfolio deploy/canary-live-portfolio.toml \
            --validated-portfolio deploy/global-trend-fixed-portfolio.toml \
            --sentinel automation/rebalance-live.request \
            --kill-switch automation/AUTOARM_DISABLED \
            --dd-budget-pct 20 \
            --write-sentinel --format json \
            | tee /tmp/decision.json
          action="$(jq -r '.action' /tmp/decision.json)"
          echo "action=${action}" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- automation/rebalance-live.request; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "decision action: ${action}"

      - name: Open ladder PR (only when the sentinel changed)
        id: pr
        if: steps.decide.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION: ${{ steps.decide.outputs.action }}
        run: |
          set -uo pipefail
          cur="$(jq -r '.current_rung' /tmp/decision.json)"
          tgt="$(jq -r '.target_rung' /tmp/decision.json)"
          cap="$(jq -r '.target_capital_usd // "?"' /tmp/decision.json)"
          nav="$(jq -r '.account_nav_usd // "?"' /tmp/decision.json)"
          reason="$(jq -r '.reason' /tmp/decision.json)"
          BRANCH="automation/capital-ladder/${ACTION,,}-${GITHUB_RUN_ID}"
          git config user.name "capital-ladder-bot"
          git config user.email "capital-ladder-bot@noreply.github.com"
          git checkout -b "${BRANCH}"
          git add automation/rebalance-live.request
          {
            echo "feat(050): 자본 사다리 ${ACTION} — 단 ${cur}→${tgt} (자본 \$${cap}, NAV \$${nav})"
            echo ""
            echo "운영자 위임(2026-06-11) + 헌법 X.4 v9.0.0 자본 사다리의 증거 게이트 결정."
            echo "결정: ${reason}"
            echo "실주문은 시장시간 스케줄에서만(이 머지는 미리보기). 즉시 정지:"
            echo "automation/AUTOARM_DISABLED."
          } > /tmp/commit_msg.txt
          git commit -q -F /tmp/commit_msg.txt
          git push -u origin "${BRANCH}"
          {
            echo "# 변경 요약"
            echo ""
            echo "- 자본 사다리 ${ACTION}: 단 ${cur}→${tgt}, 자본 \$${cap}"
            echo ""
            echo "## 위험 등급"
            echo ""
            echo "- [ ] 등급 0: 설명·조사"
            echo "- [ ] 등급 1: 일반 코드"
            echo "- [ ] 등급 2: 운영 체계"
            echo "- [ ] 등급 3: 안전 경계"
            echo "- [x] 등급 4: 돈 경로 변경"
            echo ""
            echo "## 문제 정의"
            echo ""
            echo "- 요청: 헌법 X.4 v9.0.0 자본 사다리의 증거 판정을 실행한다."
            echo "- 실제 목표: 검증된 범위 안에서 자본을 단계적으로 배치하거나 즉시 줄인다."
            echo "- 비목표: whitelist, 캡, 낙폭 예산, 주문시간을 바꾸지 않는다."
            echo "- 위험: 잘못된 승격은 실계좌 노출을 늘린다."
            echo "- 완료 기준: 센티넬 공식, 전략 지문, CI, 머지 가능 상태가 모두 맞는다."
            echo ""
            echo "## 탐색 근거"
            echo ""
            echo "- 읽은 파일: profit evidence, forward verdict, hardened canary, account NAV, live growth"
            echo "- 확인한 실행 경로: ladder-decide → 센티넬 → 시장시간 live-canary"
            echo "- 제거하거나 줄인 기능: 없음"
            echo "- 남긴 기능 또는 대체 수단: K1 캡, whitelist, 감사, 서킷 브레이커, 킬스위치"
            echo ""
            echo "## 변경 내용"
            echo ""
            echo "- 결정: ${reason}"
            echo "- 자본: \$${cap} (실계좌 NAV \$${nav} 기준 단 ${tgt} 비율)"
            echo ""
            echo "## 검증"
            echo ""
            echo "- [ ] \`uv run pytest\` (PR CI가 실행)"
            echo "- [ ] \`uv run ruff check src tests\` (PR CI가 실행)"
            echo "- [x] 문서·설정 변경에 맞는 형식 검증: ladder-decide가 센티넬을 생성"
            echo "- [x] 등급 2 이상 실제 적용 경로 확인: 고정 workflow 경로"
            echo ""
            echo "## 하네스 검증"
            echo ""
            echo "- 하네스 평가: 기능 PR의 \`uv run python scripts/agent_harness_probe.py --strict\` PASS, 이 PR은 상태 파일만 변경"
            echo "- HANDOFF 검증: 기능 PR의 \`uv run python scripts/check_handoff_facts.py\` PASS, 이 PR은 상태 파일만 변경"
            echo ""
            echo "## 안전 경계"
            echo ""
            echo "- Kernel 터치: 없음"
            echo "- 안전 경계 변경: 없음 (헌법 X.4 v9.0.0 실행)"
            echo "- 돈 경로 변경: 있음"
            echo "- 감사 로그·비밀값·주문 제한 영향: 기존 경계를 그대로 사용"
            echo ""
            echo "## 인계"
            echo ""
            echo "- 다음 세션이 알아야 할 상태: 단 ${cur}→${tgt}, 자본 \$${cap}"
            echo "- 남은 위험: 시장시간·정수 주·production 승인에 따라 주문 0건 가능"
            echo "- 실행하지 못한 검증: 실제 체결은 시장시간 workflow에서만 확인"
            echo ""
            echo "## 자동 머지 준비"
            echo ""
            echo "- [x] 작업 완료"
            echo "- [ ] 테스트 통과 (PR CI 대기)"
            echo "- [ ] 린트 깨끗함 (PR CI 대기)"
            echo "- [ ] PR 머지 가능 상태 확인"
            echo "- [x] \`WIP\` 또는 \`DO NOT MERGE\` 표식 없음"
            echo "- [x] Kernel 터치 없음"
            echo ""
            echo "### 증거 (결정 JSON)"
            echo '```json'
            cat /tmp/decision.json 2>/dev/null || echo '{}'
            echo '```'
            echo ""
            echo "### 안전"
            echo "- 실주문은 rebalance-live-canary.yml 의 시장시간 스케줄에서만(이 머지는 미리보기)."
            echo "- 장중 방어선: 스펙 014 손실 서킷 브레이커 + K1 캡 + 추세 앙상블 + 화이트리스트(SPY·IEF·GLD)."
            echo "- 강등·정지는 낙폭 하나로 즉시, 승격은 세 증거 전부 — 내려가긴 쉽고 올라가긴 어렵다."
            echo "- 즉시 정지: automation/AUTOARM_DISABLED 파일을 main 에 두면 사다리가 멈춘다."
          } > /tmp/pr_body.md
          pr_url="$(gh pr create --base main --head "${BRANCH}" \
            --title "feat(050): 자본 사다리 ${ACTION} — 단 ${cur}→${tgt} (\$${cap})" \
            --body-file /tmp/pr_body.md)"
          echo "pr_url=${pr_url}" >> "$GITHUB_OUTPUT"
          echo "PR: ${pr_url}"
          # best-effort 자동 머지(운영자 위임 자율 채널). 막히면 PR 을 ready 로 남긴다.
          if gh pr merge "${pr_url}" --merge 2>/tmp/merge.err; then
            echo "merged=merged" >> "$GITHUB_OUTPUT"
          elif gh pr merge "${pr_url}" --auto --merge 2>>/tmp/merge.err; then
            echo "merged=auto-merge-enabled" >> "$GITHUB_OUTPUT"
          else
            echo "merged=ready-for-session-or-operator" >> "$GITHUB_OUTPUT"
            echo "직접 머지 불가(브랜치 보호 등) — PR 을 ready 로 남김."
            cat /tmp/merge.err || true
          fi

      - name: Publish decision to sidecar branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION: ${{ steps.decide.outputs.action }}
          CHANGED: ${{ steps.decide.outputs.changed }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          MERGED: ${{ steps.pr.outputs.merged }}
        run: |
          set -uo pipefail
          BRANCH=automation/edge-autoarm-last-run
          reason="$(jq -r '.reason // "(no decision)"' /tmp/decision.json 2>/dev/null || echo '(no decision)')"
          cur="$(jq -r '.current_rung // "?"' /tmp/decision.json 2>/dev/null || echo '?')"
          tgt="$(jq -r '.target_rung // "?"' /tmp/decision.json 2>/dev/null || echo '?')"
          cap="$(jq -r '.target_capital_usd // "?"' /tmp/decision.json 2>/dev/null || echo '?')"
          nav="$(jq -r '.account_nav_usd // "?"' /tmp/decision.json 2>/dev/null || echo '?')"
          edge_source="$(jq -r '.edge_source // "?"' /tmp/decision.json 2>/dev/null || echo '?')"
          tmpdir=$(mktemp -d); cd "${tmpdir}"; git init -q
          git config user.name "capital-ladder-bot"
          git config user.email "capital-ladder-bot@noreply.github.com"
          {
            echo "# 자본 사다리 게이트 — 최신 실행 (스펙 050; 스펙 049 승계)"
            echo ""
            echo "헌법 X.4 v9.0.0. 단0=0% → 단1=10% 연구 → 단2=20% 탐색 → 단3=25% → 단4=50% → 단5=100%"
            echo "(실계좌 NAV 대비). 내려가는 건 낙폭 하나로 즉시, 올라가는 건 세 증거 전부."
            echo "판정 계산은 read-only — 서버 상태 무변경, 주문 0건."
            echo ""
            echo "| 항목 | 값 |"
            echo "|------|-----|"
            echo "| run_id | ${GITHUB_RUN_ID} |"
            echo "| run_url | https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
            echo "| timestamp_utc | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            echo "| trigger | ${GITHUB_EVENT_NAME} |"
            echo "| **결정(action)** | **${ACTION:-?}** |"
            echo "| 단(rung) | ${cur} → ${tgt} |"
            echo "| 자본 | \$${cap} (실계좌 NAV \$${nav}) |"
            echo "| 엣지 출처 | ${edge_source} |"
            echo "| 센티넬 변경 | ${CHANGED:-false} |"
            echo "| PR | ${PR_URL:-(없음 — 변경 없음)} |"
            echo "| 머지 | ${MERGED:-n/a} |"
            echo ""
            echo "## 의미"
            echo ""
            case "${ACTION:-}" in
              PROMOTE) echo "🟢 **승격** — 증거 충족, 단 ${cur}→${tgt}. 실주문은 다음 시장시간 스케줄부터 새 자본으로." ;;
              STAY) echo "⏳ **유지** — 승격 증거 미충족·강등 사유 없음(정상)." ;;
              DEMOTE) echo "🟠 **강등** — 낙폭 ≥ 예산/2. 단 ${cur}→${tgt}. 자본 즉시 축소." ;;
              HALT) echo "🔴 **정지** — 낙폭 ≥ 예산. 무장 해제(단 0). 재진입은 forward 재검증부터." ;;
              RESIZE) echo "🔄 **재사이징** — 계좌 NAV 드리프트(입금/성장) 반영, 단 유지." ;;
              WAIT_EDGE) echo "⏳ **배치 보류** — 아직 forward EDGE_CONFIRMED 아님(더 쌓여야 함, 정상). 돈 0 이동." ;;
              BLOCKED) echo "🛑 **차단(안전)** — 정합성 불일치 또는 계좌 NAV 조회 불능. 상태 무변경. 점검 필요." ;;
              DISABLED) echo "⛔ **킬스위치(AUTOARM_DISABLED) 활성** — 사다리 정지." ;;
              *) echo "⚠ 결정 불명 — 아래 사유/로그 확인." ;;
            esac
            echo ""
            echo "- 사유: ${reason}"
            echo ""
            echo "## 결정 JSON"
            echo '```json'
            cat /tmp/decision.json 2>/dev/null || echo '{}'
            echo '```'
            echo ""
            echo "## forward 판정 JSON (검증된 앙상블, read-only)"
            echo '```json'
            cat /tmp/verdict_global.json 2>/dev/null || echo '{}'
            echo '```'
            echo ""
            echo "## 앵커드 판정 JSON (깊은 OOS + 짧은 forward 지속성, read-only)"
            echo '```json'
            cat /tmp/anchored_global.json 2>/dev/null || echo '{}'
            echo '```'
            echo ""
            echo "## 정확 배포전략 수익 증거 JSON (read-only)"
            echo '```json'
            jq '.deployment_match // {}' /tmp/profit_evidence.json 2>/dev/null || echo '{}'
            echo '```'
            echo ""
            echo "## 전략 공장 완전성 판정 JSON (read-only)"
            echo '```json'
            cat /tmp/factory_evidence_assessment.json 2>/dev/null || echo '{}'
            echo '```'
            echo ""
            echo "## 연구 단 1 구현 가능성 미리보기 (read-only, 주문 0건)"
            echo '```json'
            cat /tmp/rung1_fundability_preview.json 2>/dev/null || echo '{}'
            echo '```'
            echo ""
            echo "## 탐색 진입 hardened canary JSON (격리, 주문 0건)"
            echo '```json'
            cat /tmp/exploration_canary.json 2>/dev/null || echo '{}'
            echo '```'
            echo ""
            echo "## 라이브 실적 JSON (현재 단 진입 이후, read-only)"
            echo '```json'
            cat /tmp/live_growth.json 2>/dev/null || echo '{}'
            echo '```'
            echo ""
            echo "## 라이브 전략 성과 JSON (첫 체결 수, read-only)"
            echo '```json'
            cat /tmp/live_performance.json 2>/dev/null || echo '{}'
            echo '```'
          } > LAST_RUN.md
          git checkout --orphan publish
          python3 "${GITHUB_WORKSPACE}/scripts/redact_public_sidecar.py" . 2>/dev/null || true
          git add LAST_RUN.md
          git commit -q -m "capital-ladder run ${GITHUB_RUN_ID} (${ACTION:-unknown})"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "publish:${BRANCH}"
          echo "Published to ${BRANCH}."
