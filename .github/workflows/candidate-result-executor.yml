name: Candidate result executor (검증 패키지 -> 결과 증거)

# 스펙 071 — 후보 구현 공장이 만든 candidate_packages.json을 안전한 실행 결과로 바꾼다.
#
# 안전: 이 워크플로는 candidate package JSON을 읽고 allowlist 된 no-live 검증
# 명령만 실행한다. 브로커 API, 주문, 자본 사다리, live 전략 설정, whitelist/caps,
# sentinels를 건드리지 않는다.

on:
  schedule:
    # 매일 08:42 UTC — candidate factory(08:40) 이후, factory second pass(08:44) 이전.
    - cron: "42 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/auto_invest/analytics/candidate_result_executor.py'
      - 'src/auto_invest/analytics/candidate_history_support.py'
      - 'scripts/candidate_result_executor_probe.py'
      - 'scripts/candidate_history_support_probe.py'
      - 'src/auto_invest/analytics/candidate_factory.py'
      - 'src/auto_invest/analytics/pipeline_liveness.py'
      - 'scripts/pipeline_liveness_probe.py'
      - 'src/auto_invest/market_data/macro_regime.py'
      - 'src/auto_invest/market_data/public_data.py'
      - 'deploy/public-data.toml'
      - 'src/auto_invest/cli.py'
      - 'src/auto_invest/safety/command_registry.py'
      - '.github/workflows/candidate-result-executor.yml'
      - '.github/workflows/candidate-implementation-factory.yml'
      - '.github/workflows/collect-public-data.yml'

permissions:
  contents: write

concurrency:
  group: candidate-result-executor
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install SSH key for candidate history support
        env:
          KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${KEY:-}" ]]; then
            echo "CANDIDATE_HISTORY_SSH=false" >> "$GITHUB_ENV"
            echo "candidate history SSH key missing; strategy candidates may remain pending"
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "CANDIDATE_HISTORY_SSH=true" >> "$GITHUB_ENV"

      - name: Collect candidate packages
        run: |
          set -euo pipefail
          mkdir -p /tmp/candidate_result_inputs
          git fetch --depth=1 origin \
            '+refs/heads/automation/*:refs/remotes/origin/automation/*' || true

          if git show origin/automation/candidate-implementation-factory-last-run:candidate_packages.json \
              > /tmp/candidate_result_inputs/candidate_packages.json 2>/tmp/candidate_packages.err; then
            echo "candidate packages collected"
          else
            echo '{"schema_version":"1.0","packages":[]}' \
              > /tmp/candidate_result_inputs/candidate_packages.json
            echo "candidate packages missing; result executor will publish empty/degraded run"
          fi

          sidecar_dir=/tmp/candidate_result_sidecars
          mkdir -p "${sidecar_dir}"
          uv run python scripts/pipeline_liveness_probe.py --manifest \
            > /tmp/candidate_result_inputs/pipeline_liveness_manifest.tsv
          while IFS=$'\t' read -r key ref file; do
            [[ -n "${key}" ]] || continue
            if git show "origin/${ref}:${file}" > "${sidecar_dir}/${key}.md" 2>/tmp/sidecar.err; then
              echo "support sidecar collected: ${key}"
            else
              echo "support sidecar missing: ${key} (${ref}:${file})"
            fi
          done < /tmp/candidate_result_inputs/pipeline_liveness_manifest.tsv

          public_data_dir=/tmp/candidate_result_public_data
          mkdir -p "${public_data_dir}"
          if git ls-tree -r --name-only origin/automation/public-data \
              > /tmp/candidate_result_inputs/public_data_files.txt 2>/tmp/public-data.err; then
            while IFS= read -r file; do
              [[ -n "${file}" ]] || continue
              mkdir -p "${public_data_dir}/$(dirname "${file}")"
              if git show "origin/automation/public-data:${file}" \
                  > "${public_data_dir}/${file}" 2>/tmp/public-data-file.err; then
                true
              else
                echo "public data file missing: ${file}"
              fi
            done < /tmp/candidate_result_inputs/public_data_files.txt
            echo "public data support files collected"
          else
            echo "public data sidecar missing; analytics candidates may remain pending"
          fi

      - name: Collect candidate history datasets
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/candidate_result_inputs
          rm -rf /tmp/candidate_result_history
          mkdir -p /tmp/candidate_result_history

          uv run python scripts/candidate_history_support_probe.py --manifest \
            > /tmp/candidate_result_inputs/candidate_history_manifest.tsv

          if [[ "${CANDIDATE_HISTORY_SSH:-false}" != "true" || -z "${HOST:-}" || -z "${USER:-}" ]]; then
            echo "candidate history SSH unavailable; strategy candidates may remain pending"
            exit 0
          fi

          set +e
          port="${PORT:-22}"
          remote_root="/tmp/candidate_result_history_${GITHUB_RUN_ID}"
          remote_manifest="/tmp/candidate_history_manifest_${GITHUB_RUN_ID}.tsv"
          remote_archive="/tmp/candidate_result_history_${GITHUB_RUN_ID}.tgz"
          local_archive="/tmp/candidate_result_history.tgz"

          scp -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              -P "${port}" -i ~/.ssh/id_ed25519 \
              /tmp/candidate_result_inputs/candidate_history_manifest.tsv \
              "${USER}@${HOST}:${remote_manifest}"
          if [[ "$?" -ne 0 ]]; then
            echo "candidate history manifest upload failed; strategy candidates may remain pending"
            exit 0
          fi

          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "bash -s" -- "${remote_root}" "${remote_manifest}" "${remote_archive}" <<'REMOTE'
          set +e
          remote_root="$1"
          manifest="$2"
          archive="$3"
          cd /opt/auto-invest || exit 0
          rm -rf "${remote_root}"
          mkdir -p "${remote_root}"

          while IFS=$'\t' read -r key portfolio db_path history_root; do
            [[ -n "${key}" ]] || continue
            work="${remote_root}/${key}"
            bars_dir="${work}/bars"
            hist_dir="${work}/hist"
            mkdir -p "${bars_dir}" "${hist_dir}"
            echo "candidate history export: ${key} (${portfolio} <- ${db_path})"

            /usr/local/bin/uv run auto-invest bars-export \
              --portfolio "${portfolio}" \
              --db "${db_path}" \
              --out-dir "${bars_dir}" \
              --json \
              > "${work}/bars-export.json" \
              2> "${work}/bars-export.err"
            export_exit=$?
            if [[ "${export_exit}" -ne 0 ]]; then
              echo "candidate history bars-export failed: ${key} exit=${export_exit}"
              cat "${work}/bars-export.err" 2>/dev/null || true
              continue
            fi

            /usr/local/bin/uv run auto-invest ingest-history \
              --from-dir "${bars_dir}" \
              --out-dir "${hist_dir}" \
              > "${work}/ingest.log" \
              2>&1
            ingest_exit=$?
            if [[ "${ingest_exit}" -ne 0 ]]; then
              echo "candidate history ingest-history failed: ${key} exit=${ingest_exit}"
              cat "${work}/ingest.log" 2>/dev/null || true
              continue
            fi
            echo "candidate history ready: ${key} -> ${history_root}"
          done < "${manifest}"

          tar -C "${remote_root}" -czf "${archive}" .
          REMOTE
          if [[ "$?" -ne 0 ]]; then
            echo "candidate history remote staging failed; strategy candidates may remain pending"
            exit 0
          fi

          scp -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              -P "${port}" -i ~/.ssh/id_ed25519 \
              "${USER}@${HOST}:${remote_archive}" "${local_archive}"
          if [[ "$?" -ne 0 || ! -s "${local_archive}" ]]; then
            echo "candidate history archive download failed; strategy candidates may remain pending"
            exit 0
          fi

          tar -C /tmp/candidate_result_history -xzf "${local_archive}"
          find /tmp/candidate_result_history -maxdepth 3 -type f | sort | head -50

          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "rm -rf '${remote_root}' '${remote_manifest}' '${remote_archive}'" || true

      - name: Execute candidate validation packages
        run: |
          set -euo pipefail
          uv run python scripts/candidate_result_executor_probe.py \
            --package-plan /tmp/candidate_result_inputs/candidate_packages.json \
            --summary-out /tmp/LAST_RUN.md \
            --json-out /tmp/candidate_result_executor.json \
            --results-out /tmp/candidate_results.json \
            --timeout-seconds 60 \
            --run-id "${GITHUB_RUN_ID}"
          cat /tmp/LAST_RUN.md

      - name: Publish result sidecar
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH=automation/candidate-implementation-results
          tmpdir=$(mktemp -d)

          cp /tmp/LAST_RUN.md "${tmpdir}/LAST_RUN.md" 2>/dev/null || {
            echo "# 후보 결과 실행기 — 보고 생성 실패" > "${tmpdir}/LAST_RUN.md"
            echo "" >> "${tmpdir}/LAST_RUN.md"
            echo "executor step failed before LAST_RUN.md was written." >> "${tmpdir}/LAST_RUN.md"
          }
          cp /tmp/candidate_result_executor.json "${tmpdir}/candidate_result_executor.json" \
            2>/dev/null || echo '{}' > "${tmpdir}/candidate_result_executor.json"
          cp /tmp/candidate_results.json "${tmpdir}/candidate_results.json" \
            2>/dev/null || echo '{"schema_version":"1.0","results":[]}' \
            > "${tmpdir}/candidate_results.json"

          {
            echo ""
            echo "## workflow metadata"
            echo ""
            echo "| 항목 | 값 |"
            echo "|------|-----|"
            echo "| run_id | ${GITHUB_RUN_ID} |"
            echo "| run_url | https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
            echo "| commit | ${GITHUB_SHA} |"
            echo "| trigger | ${GITHUB_EVENT_NAME} |"
            echo "| timestamp_utc | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            echo "| safety | no broker, no orders, no capital/live config/whitelist/caps/sentinel change |"
          } >> "${tmpdir}/LAST_RUN.md"

          cd "${tmpdir}"
          git init -q
          git config user.name "candidate-result-bot"
          git config user.email "candidate-result-bot@noreply.github.com"
          git checkout --orphan publish -q
          git add LAST_RUN.md candidate_result_executor.json candidate_results.json
          git commit -q -m "candidate-result-executor run ${GITHUB_RUN_ID}"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "publish:${BRANCH}"
          echo "Published to ${BRANCH}."
