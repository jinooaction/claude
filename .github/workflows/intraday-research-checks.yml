name: Intraday research regression

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/auto_invest/analytics/late_session_intraday.py'
      - 'src/auto_invest/analytics/cost_range_intraday.py'
      - 'src/auto_invest/analytics/intraday_paper_challenger.py'
      - 'scripts/late_session_probe.py'
      - 'scripts/cost_range_probe.py'
      - 'scripts/unpack_late_session_input.py'
      - 'research-fixtures/198/**'
      - 'tests/unit/test_late_session_intraday.py'
      - 'tests/unit/test_cost_range_intraday.py'
      - 'tests/integration/test_late_session_cli.py'
      - 'tests/integration/test_cost_range_cli.py'
      - 'tests/integration/test_late_session_input.py'
      - 'specs/198-late-session-research/**'
      - 'specs/220-cost-range-research/**'
      - '.github/workflows/intraday-research-checks.yml'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

concurrency:
  group: intraday-research-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KIS_LIVE_TEST: '0'
      UV_PYTHON: '3.11'
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Record tested source
        run: git rev-parse HEAD
      - name: Lint source and tests
        run: uv run ruff check src tests scripts/late_session_probe.py scripts/cost_range_probe.py scripts/unpack_late_session_input.py
      - name: Full regression without broker credentials
        run: >-
          uv run --with-requirements scripts/volume-priority-requirements.txt
          pytest --junitxml="$RUNNER_TEMP/intraday-research.xml"
      - name: Require new hypotheses and existing safety counterexamples
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          cases = list(ET.parse(os.environ['RUNNER_TEMP']+'/intraday-research.xml').iter('testcase'))
          for fragment, minimum in [('test_cost_range_intraday', 23),
                                    ('test_cost_range_cli', 8),
                                    ('test_late_session_intraday', 1),
                                    ('test_live_canary_active_track', 23),
                                    ('test_intraday_source_input_lab', 27),
                                    ('test_volume_priority_research_cli', 29)]:
              selected = [c for c in cases if fragment in c.get('classname', '')]
              assert len(selected) >= minimum and all(c.find('skipped') is None for c in selected)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: intraday-research-regression-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/intraday-research.xml
          if-no-files-found: warn
          retention-days: 90

  development:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KIS_LIVE_TEST: '0'
      UV_PYTHON: '3.11'
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Restore authenticated development input
        run: uv run python scripts/unpack_late_session_input.py --output-dir "$RUNNER_TEMP/late-session-input"
      - name: Evaluate fixed candidate
        run: |
          uv run python scripts/late_session_probe.py develop \
            --bars-dir "$RUNNER_TEMP/late-session-input" \
            --manifest "$RUNNER_TEMP/late-session-input/manifest.json" \
            --output-dir "$RUNNER_TEMP/late-session-result"
      - name: Replay from input and verify all evidence
        run: |
          uv run python scripts/late_session_probe.py verify \
            --bars-dir "$RUNNER_TEMP/late-session-input" \
            --manifest "$RUNNER_TEMP/late-session-input/manifest.json" \
            --evidence "$RUNNER_TEMP/late-session-result"
      - name: Print development verdict and limitations
        run: cat "$RUNNER_TEMP/late-session-result/result.json"
      - name: Retain research evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: late-session-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/late-session-result/
          if-no-files-found: warn
          retention-days: 30

  cost-range-development:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KIS_LIVE_TEST: '0'
      UV_PYTHON: '3.11'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv sync --locked --dev
      - name: Restore unchanged development input without holdout
        run: uv run python scripts/unpack_late_session_input.py --output-dir "$RUNNER_TEMP/cost-range-input"
      - name: Evaluate preregistered single hypothesis
        run: |
          uv run python scripts/cost_range_probe.py develop \
            --bars-dir "$RUNNER_TEMP/cost-range-input" \
            --manifest "$RUNNER_TEMP/cost-range-input/manifest.json" \
            --output-dir "$RUNNER_TEMP/cost-range-result"
      - name: Independently replay original input and all ledger rows
        run: |
          uv run python scripts/cost_range_probe.py verify \
            --bars-dir "$RUNNER_TEMP/cost-range-input" \
            --manifest "$RUNNER_TEMP/cost-range-input/manifest.json" \
            --evidence "$RUNNER_TEMP/cost-range-result"
      - name: Print verdict with unchanged safety flags
        run: cat "$RUNNER_TEMP/cost-range-result/result.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cost-range-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/cost-range-result/
          if-no-files-found: warn
          retention-days: 90
