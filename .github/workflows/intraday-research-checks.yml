name: Intraday research regression

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/auto_invest/analytics/late_session_intraday.py'
      - 'src/auto_invest/analytics/intraday_paper_challenger.py'
      - 'scripts/late_session_probe.py'
      - 'tests/unit/test_late_session_intraday.py'
      - 'tests/integration/test_late_session_cli.py'
      - 'specs/198-late-session-research/**'
      - '.github/workflows/intraday-research-checks.yml'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

concurrency:
  group: intraday-research-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KIS_LIVE_TEST: '0'
      UV_PYTHON: '3.11'
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Record tested source
        run: git rev-parse HEAD
      - name: Lint source and tests
        run: uv run ruff check src tests scripts/late_session_probe.py
      - name: Full regression without broker credentials
        run: uv run pytest
