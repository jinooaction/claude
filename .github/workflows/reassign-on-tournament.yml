name: Autonomous strategy reassignment (tournament champion -> live, 5-gate)

# 스펙 055 — 자율 전략 진화 폐회로. 헌법 X.5(자율 전략 재지정 위임, v6.0.0).
#
# forward 토너먼트 챔피언이 현 라이브 전략(incumbent)을 5중 게이트로 강건하게 앞서면, 사람
# 개입 없이 라이브 전략을 그 챔피언으로 재지정한다 — 단 다섯 관문을 *전부* 통과할 때만:
#   ① 엣지 확정(forward EDGE_CONFIRMED)  ② 다중검정 보정(운 좋은 우승 배제)
#   ③ 사과 대 사과(incumbent 도 비교 가능 상태에서 앞섬)  ④ 하드닝 캐너리 PASS(아래 canary 스텝)
#   ⑤ 재지정 후 자본 사다리 rung 0 리셋(reassign-decide 가 센티넬에 기록)
#
# 결정/실행은 *테스트된* src 모듈이 한다 — 이 YAML 은 얇다:
#   - 순위/도전자  : analytics.forward_tournament (scripts/forward_tournament_probe.py)
#   - ④ 캐너리      : canary.portfolio_harness (auto-invest canary-portfolio, 인스턴스 SSH)
#   - 5중 게이트 결정: portfolio.auto_reassign.decide_reassignment
#   - 실행(설정 교체): portfolio.reassign_exec.build_reassignment (auto-invest reassign-decide)
#
# 안전 (돈을 잃지 않게 — fail-closed):
#   - 도전자 없음·다중검정 미통과·캐너리 PASS 아님 → 재지정 0(HOLD/WAIT). 의심스러우면 현 전략 유지.
#   - 재지정해도 자본 사다리는 rung 0(무장 해제) — 실제 돈은 새 전략이 forward 재검증(스펙 050
#     사다리)을 다시 통과해야 들어간다. 캐너리는 *사전 선별*, 실제 돈 게이트는 하류 사다리(심층 방어).
#   - 거래 집합 확대(챔피언 유니버스 ⊄ 라이브 화이트리스트)는 운영자 게이트(헌법 II) — 자율 재지정
#     이 거부하고 라이브 무변경(reassign-decide 의 execution_blocked).
#   - 센티넬/설정 머지 자체는 미리보기만 — 실주문은 rebalance-live-canary.yml 의 시장시간 스케줄.
#   - 즉시 정지: automation/AUTOARM_DISABLED 파일을 main 에 두면 DISABLED no-op.
#   - 결과는 사이드카 automation/reassign-last-run 으로 발행:
#       git show origin/automation/reassign-last-run:LAST_RUN.md
#
# 헌법 X.5: 재지정은 "무엇을(전략)"만 바꾼다 — "얼마나(자본)"는 자본 사다리(X.4), 장중 방어는
# 스펙 014 서킷 브레이커. 비위임 불변(I 캡·II 화이트리스트·IV 감사·VI 단계 승격)은 그대로다.

on:
  schedule:
    # 자본 사다리 게이트(23:50 UTC) 다음. 평일. forward 누적(22:30)→사다리(23:50)→재지정(00:20).
    - cron: "20 0 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write       # 사이드카 force-push + 재지정 브랜치 push.
  pull-requests: write  # 재지정 PR open/merge.

concurrency:
  group: reassign-on-tournament
  cancel-in-progress: false

jobs:
  reassign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (fresh main — correct configs + live sentinel for the decision)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Install SSH key
        env:
          KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VULTR_SSH_KNOWN_HOSTS }}
          SSH_USER: ${{ secrets.VULTR_SSH_USER }}
        run: |
          VULTR_SSH_PRIVATE_KEY="${KEY:-}" \
          VULTR_SSH_KNOWN_HOSTS="${KNOWN_HOSTS:-}" \
          VULTR_SSH_USER="${SSH_USER:-}" \
          ./scripts/ci_secure_ssh.sh

      - name: Read published tournament leaderboard JSON (read-only)
        id: board
        run: |
          set -uo pipefail
          # 발행된 forward A/B 토너먼트의 기계 판독 JSON 을 단일 증거로 쓴다.
          # LAST_RUN.md 는 사람이 읽는 보고서라 재지정 입력으로 재파싱하지 않는다.
          git fetch origin automation/rebalance-paper-forward-last-run || true
          if git show origin/automation/rebalance-paper-forward-last-run:leaderboard.json > /tmp/leaderboard.json 2>/tmp/leaderboard.err; then
            :
          else
            cat > /tmp/leaderboard.json <<'JSON'
          {"schema_version":"1.1","champion_key":null,"incumbent_key":null,"challenger_key":null,"champion_multiplicity_robust":null,"track_count":0,"known_count":0,"unknown_count":0,"lagging_keys":[],"observation_health":"BLOCKED","observation_note":"published forward sidecar leaderboard.json unavailable"}
          JSON
            echo "(forward leaderboard.json 없음 — 관측 품질 BLOCKED)"
          fi
          if ! jq -e 'type == "object" and has("observation_health")' /tmp/leaderboard.json >/dev/null 2>/tmp/leaderboard.err; then
            cat > /tmp/leaderboard.json <<'JSON'
          {"schema_version":"1.1","champion_key":null,"incumbent_key":null,"challenger_key":null,"champion_multiplicity_robust":null,"track_count":0,"known_count":0,"unknown_count":0,"lagging_keys":[],"observation_health":"BLOCKED","observation_note":"published forward sidecar leaderboard.json invalid or missing observation_health"}
          JSON
            echo "(forward leaderboard.json 무효 — 관측 품질 BLOCKED)"
          fi
          echo "--- leaderboard ---"; cat /tmp/leaderboard.json
          challenger="$(uv run auto-invest reassign-challenger-path --leaderboard-json /tmp/leaderboard.json 2>/dev/null || true)"
          echo "challenger_path=${challenger}" >> "$GITHUB_OUTPUT"
          echo "challenger_path=${challenger:-(none)}"

      - name: Read micro GTAA opportunity feedback (read-only)
        id: opportunity_feedback
        run: |
          set -uo pipefail
          BRANCH=automation/rebalance-micro-gtaa-last-run
          git fetch origin "${BRANCH}" || true
          if git show "origin/${BRANCH}:opportunity_monitor.json" > /tmp/opportunity_monitor.json 2>/tmp/opportunity_monitor.err; then
            :
          else
            cat > /tmp/opportunity_monitor.json <<'JSON'
          {"schema_version":1,"verdict":"NO_VALUED_REJECTIONS","verdict_label_ko":"평가 가능한 거부 주문 없음","latest_signal":"FLAT_OR_UNVALUED","interpretation_ko":"published micro GTAA opportunity_monitor.json unavailable","next_action_ko":"다음 micro GTAA 실행에서 표본을 갱신합니다.","counts":{"records":0,"valued_records":0,"rejected_orders":0,"valued_orders":0},"cumulative":{"total_intended_order_mark_pnl_usd":"+0.00"},"streaks":{"intent_loss":0,"intent_gain":0},"latest":null}
          JSON
            echo "(micro opportunity_monitor.json 없음 — 재지정 게이트는 기존 입력만 사용)"
          fi
          verdict="$(jq -r '.verdict // "UNKNOWN"' /tmp/opportunity_monitor.json 2>/dev/null || echo UNKNOWN)"
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          echo "micro opportunity feedback verdict: ${verdict}"

      - name: ④ Hardened canary on the challenger (instance SSH; PASS/FAIL or empty)
        id: canary
        if: steps.board.outputs.challenger_path != ''
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
          CHALLENGER: ${{ steps.board.outputs.challenger_path }}
        run: |
          set +e
          port="${PORT:-22}"
          # 챔피언 전략을 과거 윈도우 + 실제 과거 급락 윈도우(합성 충격) + K1 퍼즈로 검증(스펙 007
          # 5지표). 전용 DB·halt 로 격리(라이브 감사/킬스위치 무오염). 데이터 없으면 coverage 종료
          # (exit 2) → verdict 빈값 → 아래 결정이 WAIT_CANARY(재지정 안 함, fail-closed).
          # --bars-db: 라이브/페이퍼 워커가 backfill-bars 로 채운 price_bars(SPY·IEF·GLD 일봉)를
          # 그대로 읽는다 — 토너먼트·라이브와 같은 바. 별도 CSV ingest 불필요(폐회로가 인스턴스
          # 데이터로 실제로 닫힌다). 감사는 격리 DB(canary_reassign.db)로 라이브 audit 무오염.
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "cd /opt/auto-invest && /usr/local/bin/uv run auto-invest canary-portfolio \
                 --portfolio ${CHALLENGER} \
                 --bars-db data/auto_invest.db \
                 --bands-toml config/canary_bands_reassign.toml \
                 --db data/canary_reassign.db \
                 --halt-path data/canary_reassign.halt.flag \
                 --format json" \
              > /tmp/canary.json 2>/tmp/canary.err
          echo "ssh_exit=$?"
          echo "--- canary ---"; cat /tmp/canary.json; echo "--- stderr ---"; cat /tmp/canary.err
          verdict="$(jq -r '.verdict // empty' /tmp/canary.json 2>/dev/null || true)"
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          echo "canary verdict: ${verdict:-(none — coverage/SSH fail → WAIT_CANARY)}"

      - name: Decide + execute reassignment (tested src; writes config + sentinel on REASSIGN)
        id: decide
        env:
          VERDICT: ${{ steps.canary.outputs.verdict }}
        run: |
          set -uo pipefail
          uv run auto-invest reassign-decide \
            --leaderboard-json /tmp/leaderboard.json \
            --canary-verdict "${VERDICT:-}" \
            --execution-feedback-json /tmp/opportunity_monitor.json \
            --live-portfolio deploy/canary-live-portfolio.toml \
            --sentinel automation/rebalance-live.request \
            --kill-switch automation/AUTOARM_DISABLED \
            --dd-budget-pct 20 \
            --write-config --format json \
            | tee /tmp/decision.json
          action="$(jq -r '.action' /tmp/decision.json)"
          echo "action=${action}" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- deploy/canary-live-portfolio.toml automation/rebalance-live.request; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "decision action: ${action}"

      - name: Open reassignment PR (only when the live config/sentinel changed)
        id: pr
        if: steps.decide.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          challenger="$(jq -r '.challenger_key' /tmp/decision.json)"
          incumbent="$(jq -r '.incumbent_key // "?"' /tmp/decision.json)"
          reason="$(jq -r '.reason' /tmp/decision.json)"
          BRANCH="automation/reassign/${challenger}-${GITHUB_RUN_ID}"
          git config user.name "reassign-bot"
          git config user.email "reassign-bot@noreply.github.com"
          git checkout -b "${BRANCH}"
          git add deploy/canary-live-portfolio.toml automation/rebalance-live.request
          {
            echo "feat(055): 자율 전략 재지정 — 라이브 '${incumbent}' → '${challenger}'"
            echo ""
            echo "헌법 X.5 자율 전략 재지정. 5중 게이트 전부 통과(엣지·다중검정·사과 대 사과·하드닝"
            echo "캐너리 PASS) → 챔피언 전략 이식 + 자본 사다리 rung 0(무장 해제) 리셋."
            echo "결정: ${reason}"
            echo "실주문 0건(rung 0=무장 해제). 재무장은 자본 사다리(스펙 050)가 forward 재검증부터."
            echo "즉시 정지: automation/AUTOARM_DISABLED."
          } > /tmp/commit_msg.txt
          git commit -q -F /tmp/commit_msg.txt
          git push -u origin "${BRANCH}"
          {
            echo "## 🔁 자율 전략 재지정 — '${incumbent}' → '${challenger}'"
            echo ""
            echo "스펙 055 / 헌법 X.5 자율 전략 진화 폐회로의 재지정. forward 토너먼트 챔피언이 5중"
            echo "게이트를 전부 통과해 라이브 전략을 자동 교체한다."
            echo ""
            echo "- 결정: ${reason}"
            echo "- 전략 블록은 챔피언 deploy 설정에서 이식, 운영/거래집합([caps]·[whitelist])은 라이브 보존."
            echo "- 자본 사다리는 rung 0(무장 해제)으로 리셋 — 새 전략은 forward 재검증부터 25%·50%·100%."
            echo ""
            echo "### 5중 게이트 결정 JSON"
            echo '```json'
            cat /tmp/decision.json 2>/dev/null || echo '{}'
            echo '```'
            echo ""
            echo "### ④ 하드닝 캐너리 결과"
            echo '```json'
            cat /tmp/canary.json 2>/dev/null || echo '(도전자 없음 또는 캐너리 미실행)'
            echo '```'
            echo ""
            echo "### 안전"
            echo "- 실주문 0건: rung 0 = 무장 해제. 재무장은 자본 사다리(스펙 050)가 forward 재검증부터."
            echo "- 거래 집합 무확대(헌법 II): 챔피언 유니버스 ⊆ 라이브 화이트리스트만 자율 재지정."
            echo "- 장중 방어: 스펙 014 손실 서킷 브레이커 + K1 캡. 즉시 정지: automation/AUTOARM_DISABLED."
          } > /tmp/pr_body.md
          pr_url="$(gh pr create --base main --head "${BRANCH}" \
            --title "feat(055): 자율 전략 재지정 — '${incumbent}' → '${challenger}'" \
            --body-file /tmp/pr_body.md)"
          echo "pr_url=${pr_url}" >> "$GITHUB_OUTPUT"
          echo "PR: ${pr_url}"
          # best-effort 자동 머지(운영자 위임 자율 채널, 헌법 IX.D/X.5). 막히면 ready 로 남긴다.
          if gh pr merge "${pr_url}" --merge --delete-branch 2>/tmp/merge.err; then
            echo "merged=merged" >> "$GITHUB_OUTPUT"
          elif gh pr merge "${pr_url}" --auto --merge 2>>/tmp/merge.err; then
            echo "merged=auto-merge-enabled" >> "$GITHUB_OUTPUT"
          else
            echo "merged=ready-for-session-or-operator" >> "$GITHUB_OUTPUT"
            cat /tmp/merge.err || true
          fi

      - name: Publish reassignment decision to sidecar branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION: ${{ steps.decide.outputs.action }}
          CHANGED: ${{ steps.decide.outputs.changed }}
          VERDICT: ${{ steps.canary.outputs.verdict }}
          CHALLENGER_PATH: ${{ steps.board.outputs.challenger_path }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          MERGED: ${{ steps.pr.outputs.merged }}
          FEEDBACK_VERDICT: ${{ steps.opportunity_feedback.outputs.verdict }}
        run: |
          set -uo pipefail
          BRANCH=automation/reassign-last-run
          reason="$(jq -r '.reason // "(no decision)"' /tmp/decision.json 2>/dev/null || echo '(no decision)')"
          challenger="$(jq -r '.challenger_key // "?"' /tmp/decision.json 2>/dev/null || echo '?')"
          incumbent="$(jq -r '.incumbent_key // "?"' /tmp/decision.json 2>/dev/null || echo '?')"
          tmpdir=$(mktemp -d); cd "${tmpdir}"; git init -q
          git config user.name "reassign-bot"
          git config user.email "reassign-bot@noreply.github.com"
          {
            echo "# 자율 전략 재지정 — 최신 실행 (스펙 055 / 헌법 X.5)"
            echo ""
            echo "forward 토너먼트 챔피언이 5중 게이트를 전부 통과하면 라이브 전략을 자동 교체한다."
            echo "결정/실행은 테스트된 src 모듈(decide_reassignment + build_reassignment)이 한다."
            echo "fail-closed: 도전자 없음·다중검정 미통과·캐너리 PASS 아님 → 재지정 0."
            echo ""
            echo "| 항목 | 값 |"
            echo "|------|-----|"
            echo "| run_id | ${GITHUB_RUN_ID} |"
            echo "| run_url | https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
            echo "| timestamp_utc | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            echo "| trigger | ${GITHUB_EVENT_NAME} |"
            echo "| **결정(action)** | **${ACTION:-?}** |"
            echo "| incumbent → challenger | ${incumbent} → ${challenger} |"
            echo "| 챔피언 설정 | ${CHALLENGER_PATH:-(도전자 없음)} |"
            echo "| ④ 캐너리 verdict | ${VERDICT:-(미실행 — 도전자 없음/데이터 없음)} |"
            echo "| 라이브 거부 주문 누적 verdict | ${FEEDBACK_VERDICT:-UNKNOWN} |"
            echo "| 라이브 설정 변경 | ${CHANGED:-false} |"
            echo "| PR | ${PR_URL:-(없음 — 변경 없음)} |"
            echo "| 머지 | ${MERGED:-n/a} |"
            echo ""
            echo "## 의미"
            echo ""
            case "${ACTION:-}" in
              REASSIGN) echo "🔁 **재지정** — 5중 게이트 전부 통과. 라이브 전략 교체 + 사다리 rung 0 리셋. 실주문은 재무장(사다리) 후." ;;
              WAIT_CANARY) echo "⏳ **캐너리 대기** — 도전자 확정(①②③)이나 하드닝 캐너리 PASS 아직(또는 데이터 없음). 라이브 무변경." ;;
              HOLD) echo "🏠 **유지** — 도전자 없음 또는 다중검정 보정 미통과(운 좋은 우승 가능). 현 전략이 최선/미확정." ;;
              DISABLED) echo "⛔ **킬스위치(AUTOARM_DISABLED) 활성** — 자율 재지정 정지." ;;
              *) echo "⚠ 결정 불명 — 아래 사유/JSON 확인." ;;
            esac
            echo ""
            echo "- 사유: ${reason}"
            echo ""
            echo "## 5중 게이트 결정 JSON"
            echo '```json'
            cat /tmp/decision.json 2>/dev/null || echo '{}'
            echo '```'
            echo ""
            echo "## 라이브 거부 주문 누적 평가 JSON"
            echo ""
            echo "이 신호는 재지정 결정의 읽기 전용 실행 피드백이다. 기존 5중 게이트를 우회하지 않는다."
            echo '```json'
            cat /tmp/opportunity_monitor.json 2>/dev/null || echo '{}'
            echo '```'
            echo ""
            echo "## ④ 하드닝 캐너리 결과 JSON"
            echo '```json'
            cat /tmp/canary.json 2>/dev/null || echo '(도전자 없음 또는 캐너리 미실행)'
            echo '```'
            echo ""
            echo "## forward 토너먼트 리더보드 JSON (읽기 전용)"
            echo '```json'
            cat /tmp/leaderboard.json 2>/dev/null || echo '{}'
            echo '```'
          } > LAST_RUN.md
          git checkout --orphan publish
          python3 "${GITHUB_WORKSPACE}/scripts/redact_public_sidecar.py" . 2>/dev/null || true
          git add LAST_RUN.md
          git commit -q -m "reassign-on-tournament run ${GITHUB_RUN_ID} (${ACTION:-unknown})"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "publish:${BRANCH}"
          echo "Published to ${BRANCH}."
