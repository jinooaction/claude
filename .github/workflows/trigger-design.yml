name: Trigger design (manual proposal)

# 수동 workflow_dispatch로 proposal-only design을 호출하고, 결과를
# .verify/last_design.md 로 commit 해서 mcp 가 직접 읽을 수 있게 한다.
#
# 사용:
#   1) Actions 탭에서 "Trigger design (manual proposal)" 수동 실행
#   2) intent 입력
#   3) .verify/last_design.md 가 branch 에 commit 됨
#
# 이 경로는 후보 생성 전용이며 실거래 프로세스를 시작하지 않는다.

on:
  workflow_dispatch:
    inputs:
      intent:
        description: "design 의도"
        required: true
        default: "자본 100달러, 미국 대형주 분산, 매주 월요일 적립, 위험 보통"
        type: string

permissions:
  contents: write

jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install SSH key
        env:
          KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Run design via SSH
        id: design
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
          INTENT: ${{ inputs.intent || '자본 100달러, 미국 대형주 분산, 매주 월요일 적립, 위험 보통' }}
        run: |
          set +e
          port="${PORT:-22}"
          intent_b64="$(printf '%s' "${INTENT}" | base64 | tr -d '\n')"
          # operator_design.sh 는 인스턴스의 /opt/auto-invest/scripts/ 에 있음 (PR #27 머지).
          # intent는 base64 데이터로 전달해 원격 셸 명령 문자열에 자연어 원문을
          # 삽입하지 않는다.
          ssh -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 \
              -p "${port}" \
              -i ~/.ssh/id_ed25519 \
              "${USER}@${HOST}" \
              "sudo env INTENT_B64='${intent_b64}' bash /opt/auto-invest/scripts/operator_design.sh" \
              > /tmp/design_output.txt 2>&1
          ssh_exit=$?
          echo "ssh_exit=${ssh_exit}" >> "$GITHUB_OUTPUT"
          # tee 로 GitHub Actions 로그에도 출력
          cat /tmp/design_output.txt
          # 출력을 GITHUB_OUTPUT 에 저장 (multi-line)
          {
              echo "output<<EOF_DESIGN_OUTPUT"
              cat /tmp/design_output.txt
              echo "EOF_DESIGN_OUTPUT"
          } >> "$GITHUB_OUTPUT"

      - name: Commit result file
        if: always()
        env:
          INTENT: ${{ inputs.intent || '자본 100달러, 미국 대형주 분산, 매주 월요일 적립, 위험 보통' }}
          SSH_EXIT: ${{ steps.design.outputs.ssh_exit }}
          DESIGN_OUTPUT: ${{ steps.design.outputs.output }}
        run: |
          mkdir -p .verify
          intent_sha="$(printf '%s' "${INTENT}" | sha256sum | awk '{print $1}')"
          if [[ "${SSH_EXIT}" == "0" ]]; then
              emoji="✅"
              status="OK"
          else
              emoji="❌"
              status="FAILED (exit ${SSH_EXIT})"
          fi
          cat > .verify/last_design.md <<EOF
          # design 호출 결과 ${emoji}

          - 의도 길이: \`${#INTENT}자\`
          - 의도 지문: \`${intent_sha}\`
          - SSH exit: \`${SSH_EXIT}\`
          - 상태: ${status}
          - 시각: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          - run id: ${GITHUB_RUN_ID}

          ## operator_design.sh 출력 (한글 깨짐 가능 — 인스턴스 콘솔 UTF-8 폰트 부재)

          \`\`\`
          ${DESIGN_OUTPUT:-(출력 없음)}
          \`\`\`
          EOF
          git config user.email "github-actions@github.com"
          git config user.name  "github-actions[bot]"
          git add .verify/last_design.md
          if git diff --cached --quiet; then
              echo "변경 없음 — commit skip"
          else
              git commit -m "design result: ${status} [skip ci]"
              git push origin HEAD:"${GITHUB_REF#refs/heads/}" || \
                  echo "::warning::push 실패"
          fi
