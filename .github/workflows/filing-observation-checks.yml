name: Filing observation regression

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/auto_invest/analytics/filing_*.py'
      - 'src/auto_invest/market_data/filing_collector.py'
      - 'src/auto_invest/market_data/issuer_filings.py'
      - 'scripts/filing_*.py'
      - 'tests/unit/test_filing_*.py'
      - 'tests/unit/test_issuer_filing_*.py'
      - 'tests/integration/test_filing_observations_cli.py'
      - 'specs/199-first-observed-filings/**'
      - 'specs/201-earnings-clock-input/**'
      - 'specs/202-earnings-event-price/**'
      - 'scripts/earnings_metadata_audit.py'
      - 'scripts/earnings_event_price_diagnostic.py'
      - 'tests/unit/test_earnings_metadata_audit.py'
      - 'tests/unit/test_earnings_event_price_diagnostic.py'
      - 'src/auto_invest/analytics/intraday_service.py'
      - 'tests/unit/test_intraday_service.py'
      - 'tests/integration/test_intraday_runtime_cli.py'
      - '.github/workflows/intraday-paper-status.yml'
      - 'deploy/filing-observations.json'
      - 'deploy/issuer-filings.json'
      - '.github/workflows/*filing*.yml'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

concurrency:
  group: filing-observation-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KIS_LIVE_TEST: '0'
      UV_PYTHON: '3.11'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Record tested source
        run: git rev-parse HEAD
      - name: Lint source, tests, and filing commands
        run: uv run ruff check src tests scripts/filing_observations.py scripts/filing_publication.py scripts/earnings_metadata_audit.py scripts/earnings_event_price_diagnostic.py
      - name: Full regression without broker credentials
        run: >-
          uv run --with-requirements scripts/volume-priority-requirements.txt
          pytest --junitxml="$RUNNER_TEMP/filing-observation-regression.xml"
      - name: Require existing encrypted archive commands without skips
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          cases = list(ET.parse(os.environ['RUNNER_TEMP']+'/filing-observation-regression.xml').iter('testcase'))
          for fragment, minimum in [('test_public_minute_bridge', 40),
                                    ('test_volume_priority_research_cli', 29)]:
              selected = [c for c in cases if fragment in c.get('classname', '')]
              assert len(selected) >= minimum and all(c.find('skipped') is None for c in selected), fragment
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: filing-observation-regression-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/filing-observation-regression.xml
          if-no-files-found: error
