name: Live canary portfolio rebalance (guarded, real money)

# 스펙 040 — 고도화(추세 방어 포트폴리오)를 *소액 실거래*로 운용하는 가드형 채널.
#
# ⚠ 이 워크플로는 실제 돈을 움직일 수 있다. 그래서 다중 안전장치를 둔다:
#   1. 기본은 **드라이런 미리보기**(rebalance-once --dry-run, 주문 0건) — "실거래로 무엇을
#      살지"만 보여준다. 실주문은 센티넬 automation/rebalance-live.request 의 armed: true
#      일 때만 나간다.
#   2. **자본 권위 가드(스펙 050)**: 자본은 자본 사다리(증거 게이트 공식, 헌법 X.4 v11.0.0)가
#      기록한 실계좌 NAV 이하여야 한다 — 위임 상한은 계좌 잔고(운영자 2026-06-11). 사다리
#      필드가 없는 레거시/수동 센티넬은 종전 소액 가드($1,000)가 그대로 적용된다.
#   3. `--mode live` 는 `--confirm-live` 인터록 필요(CLI 가 강제). K1 캡이 천장. 스펙 014
#      손실 서킷 브레이커(halt_gate)가 일손실·총낙폭 한도 초과 시 주문 거부(킬스위치).
#   4. 추세 필터(스펙 036)가 추세 아래면 현금으로 빠진다(드로다운 방어).
#   5. 신호 집합은 SPY·IEF·GLD, 실제 주문 집합은 사전등록 대체 ETF
#      SCHX·SPTI·IAUM만 허용한다(헌법 II, 스펙 176).
#
# ⚠ 무장(armed: true) 전 운영자가 룰 워커 충돌을 해소해야 한다(한 실계좌 전략 하나):
#   같은 계좌에 canary-live-rules.toml 워커가 돌면 포트폴리오 재조정과 충돌한다. 무장 시
#   룰 워커를 비활성(disabled 룰셋)으로 먼저 전환한다 — 별도 단계(go-live 채널).
#
# 헌법 X.4의 운영자 위임 아래 소액 캐너리 자본은 증거 기반으로 자동 운용한다. 실제 주문은
# main 예약 실행 + 기계 승인 + production 환경 서명 + 서버 이중 검증을 모두 통과해야 한다.
# 결과는 사이드카 automation/rebalance-live-canary-last-run 로 발행한다.

on:
  schedule:
    # 미국 정규장 중 뉴욕 현지 10:17(정각 혼잡 회피) 실거래 재조정. GitHub schedule은
    # 매시 정각에 지연·누락될 수 있으므로 비정각을 쓴다. 실주문은 *스케줄* 실행 + 센티넬
    # armed:true 일 때만 — 무장 머지(push)는 미리보기만(아래 LIVE 스텝 게이트).
    - cron: "17 10 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      capital:
        description: "라이브 캐너리 자본 USD (소액 — $1,000 이하)."
        required: false
        default: "500"
  push:
    branches: [main]
    paths:
      - 'automation/rebalance-live.request'

permissions:
  contents: write  # 사이드카 브랜치 force-push 용.

concurrency:
  group: rebalance-live-canary
  cancel-in-progress: false

jobs:
  live_portfolio_canary_preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      armed: ${{ steps.gate.outputs.armed }}
      capital: ${{ steps.gate.outputs.capital }}
      blocked: ${{ steps.gate.outputs.blocked }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Read arming sentinel (armed flag + capital, ladder-authority guard)
        id: gate
        run: |
          set -uo pipefail
          REQ=automation/rebalance-live.request
          armed=false; capital="${{ github.event.inputs.capital || '500' }}"
          if [[ -f "$REQ" ]]; then
            a="$(grep -E '^armed:' "$REQ" | head -1 | awk '{print $2}' || true)"
            c="$(grep -E '^capital_usd:' "$REQ" | head -1 | awk '{print $2}' || true)"
            [[ -n "$a" ]] && armed="$a"
            [[ -n "$c" ]] && capital="$c"
          fi
          # 자본 권위 가드 (스펙 050):
          #   - 사다리 센티넬(ladder_rung + account_nav_usd 보유): 자본은 사다리가 기록한
          #     실계좌 NAV 이하 — 위임 상한은 계좌 잔고(운영자 2026-06-11). CI 회귀
          #     (test_live_arming_sentinel)가 자본 = 단 공식까지 검증한다.
          #   - 레거시/수동 센티넬(사다리 필드 없음): 종전 소액 가드($1,000) 유지 —
          #     손 편집으로는 소액 이상을 무장할 수 없다.
          rung="$(grep -E '^ladder_rung:' "$REQ" 2>/dev/null | head -1 | awk '{print $2}' || true)"
          nav="$(grep -E '^account_nav_usd:' "$REQ" 2>/dev/null | head -1 | awk '{print $2}' || true)"
          entry_route="$(grep -E '^entry_route:' "$REQ" 2>/dev/null | head -1 | awk '{print $2}' || true)"
          ./scripts/ci_validate_decimal.sh capital "$capital" || exit $?
          blocked=false
          if [[ -n "$rung" && -n "$nav" ]]; then
            if (( $(printf '%.0f' "$capital") > $(printf '%.0f' "$nav") )); then
              echo "❌ capital_usd=$capital > account_nav_usd=$nav — 사다리 기록 실계좌 NAV 초과. 거부." >&2
              armed=false; blocked=true
            fi
            if [[ "$rung" -gt 0 && ! "$entry_route" =~ ^(operational_canary|factory_research|exploration)$ ]]; then
              echo "❌ ladder rung ${rung} has no valid typed entry_route. 거부." >&2
              armed=false; blocked=true
            fi
          else
            if (( $(printf '%.0f' "$capital") > 1000 )); then
              echo "❌ capital_usd=$capital > 1000 — 사다리 필드 없는 수동 센티넬은 소액만. 거부." >&2
              armed=false; blocked=true
            fi
          fi
          echo "armed=$armed" >> "$GITHUB_OUTPUT"
          echo "capital=$capital" >> "$GITHUB_OUTPUT"
          echo "blocked=$blocked" >> "$GITHUB_OUTPUT"
          echo "armed=$armed capital=$capital blocked=$blocked (rung=${rung:-none} nav=${nav:-none})"

      - name: Install SSH key
        if: steps.gate.outputs.blocked != 'true'
        env:
          KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VULTR_SSH_KNOWN_HOSTS }}
          SSH_USER: ${{ secrets.VULTR_SSH_USER }}
        run: |
          VULTR_SSH_PRIVATE_KEY="${KEY:-}" \
          VULTR_SSH_KNOWN_HOSTS="${KNOWN_HOSTS:-}" \
          VULTR_SSH_USER="${SSH_USER:-}" \
          ./scripts/ci_secure_ssh.sh

      - name: Backfill live universe daily bars (read-only quotes, no orders)
        if: steps.gate.outputs.blocked != 'true'
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
        run: |
          set +e
          port="${PORT:-22}"
          # --min-bars 1000: forward 트랙과 같은 깊은 백필(검증=무장 정합 — 같은 이력
          # 깊이 → 같은 신호). 기본(한 페이지 ≈100봉)은 전략이 요구하는 이력(추세 앙상블
          # 최대 252봉·역변동성 200봉·모멘텀 120봉)에 못 미쳐 on_insufficient=cash 로
          # target_weights={} 가 된다 — 무장돼도 현금만 들고 거래 0건(2026-06-10 실측).
          for attempt in 1 2 3 4; do
            ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=15 \
                -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
                "observe live-canary-backfill" \
                > /tmp/live_backfill.log 2>&1
            ssh_exit=$?
            if ! grep -q "refused command: observe live-canary-backfill" /tmp/live_backfill.log; then
              break
            fi
            if [ "${attempt}" = "4" ]; then
              break
            fi
            echo "gateway not refreshed yet (attempt ${attempt}); waiting before retry"
            sleep 90
          done
          echo "exit=${ssh_exit}"; cat /tmp/live_backfill.log

      - name: DRY-RUN preview — what would the live strategy trade? (no orders)
        id: preview
        if: steps.gate.outputs.blocked != 'true'
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
          CAP: ${{ steps.gate.outputs.capital }}
        run: |
          set +e
          port="${PORT:-22}"
          # --dry-run: 계획만 산출, 라우터 미호출(주문 0건). 현재 보유 대비 무엇을 사고팔지.
          for attempt in 1 2 3 4; do
            ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=15 \
                -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
                "observe live-canary-preview ${CAP}" \
                > /tmp/live_preview.json 2>/tmp/live_preview.err
            ssh_exit=$?
            if ! grep -q "refused command: observe live-canary-preview" /tmp/live_preview.json /tmp/live_preview.err; then
              break
            fi
            if [ "${attempt}" = "4" ]; then
              break
            fi
            echo "gateway not refreshed yet (attempt ${attempt}); waiting before retry"
            sleep 90
          done
          echo "ssh_exit=${ssh_exit}" >> "$GITHUB_OUTPUT"
          echo "--- preview ---"; cat /tmp/live_preview.json
          echo "--- stderr ---"; cat /tmp/live_preview.err

      - name: Measure live track (NAV snapshot + forward-verdict --mode live)
        id: measure
        if: >-
          steps.gate.outputs.blocked != 'true' &&
          steps.gate.outputs.armed != 'true'
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
          CAP: ${{ steps.gate.outputs.capital }}
        run: |
          set +e
          port="${PORT:-22}"
          # --capital: NAV 에 장부 현금(자본 + 순현금흐름)을 포함 — 매수/매도 자금 흐름이
          # 수익률로 오인되는 오염을 막는다(페이퍼 forward 트랙과 같은 측정 기준).
          for attempt in 1 2 3 4; do
            ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=15 \
                -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
                "observe live-canary-measure ${CAP}" \
                > /tmp/live_measure.log 2>&1
            ssh_exit=$?
            if ! grep -q "refused command: observe live-canary-measure" /tmp/live_measure.log; then
              break
            fi
            if [ "${attempt}" = "4" ]; then
              break
            fi
            echo "gateway not refreshed yet (attempt ${attempt}); waiting before retry"
            sleep 90
          done
          echo "exit=${ssh_exit}"; cat /tmp/live_measure.log

      - name: Publish live canary result to sidecar branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARMED: ${{ steps.gate.outputs.armed }}
          CAP: ${{ steps.gate.outputs.capital }}
          BLOCKED: ${{ steps.gate.outputs.blocked }}
          EVENT: ${{ github.event_name }}
        run: |
          set -o pipefail  # 의도적으로 -u 제외: 발행은 문자열 포맷팅뿐 — 사소한 미설정
          # 변수가 사이드카 기록(특히 무장 시 주문 기록)을 막지 않게 한다.
          BRANCH=automation/rebalance-live-canary-last-run
          tmpdir=$(mktemp -d); cd "${tmpdir}"; git init -q
          git config user.name "rebalance-live-bot"
          git config user.email "rebalance-live-bot@noreply.github.com"
          {
            echo "# 라이브 캐너리 포트폴리오 — 최신 실행 (가드형 실거래 채널)"
            echo ""
            echo "| 항목 | 값 |"
            echo "|------|-----|"
            echo "| run_id | ${GITHUB_RUN_ID} |"
            echo "| timestamp_utc | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            echo "| armed (무장 여부) | ${ARMED:-?} |"
            echo "| capital_usd | ${CAP:-?} |"
            echo "| blocked (자본 가드 거부) | ${BLOCKED:-?} |"
            echo "| event | ${EVENT:-?} |"
            echo "| LIVE 스텝 | preview-job-skipped (실주문은 production-gated job 전용) |"
            echo ""
            if [[ "${ARMED:-false}" != "true" ]]; then
              echo "> 🛡 **드라이런 미리보기만** (armed=false) — 실주문 0건. 아래는 *무장 시* 실거래가"
              echo "> 무엇을 사고팔지 보여준다. 무장하려면 automation/rebalance-live.request 의"
              echo "> armed: true 로 머지(룰 워커 충돌 먼저 해소)."
            else
              echo "> 🟡 **무장됨이나 이 job 은 미리보기만** (armed=true, event=${EVENT:-?})."
              echo "> 실주문은 별도 production 기계 승인과 서버 이중 검증 뒤에만 실행한다."
              echo "> 이 preview/sidecar job 자체는 **실주문 0건**이다."
            fi
            echo ""
            echo "## 드라이런 미리보기 — 무장 시 거래할 내역 (주문 0건)"
            echo '```json'
            cat /tmp/live_preview.json 2>/dev/null || echo '{}'
            echo '```'
            echo ""
            echo "## 라이브 재조정 결과 (armed=true 일 때만)"
            echo '```json'
            echo '(preview job — 실주문은 production 기계 승인 뒤 별도 발행)'
            echo '```'
            echo ""
            echo "## 라이브 트랙 측정 (NAV 스냅샷 + forward-verdict --mode live + 칼마)"
            echo '```'
            cat /tmp/live_measure.log 2>/dev/null || echo '(none)'
            echo '```'
          } > LAST_RUN.md
          git checkout --orphan publish
          python3 "${GITHUB_WORKSPACE}/scripts/redact_public_sidecar.py" . 2>/dev/null || true
          git add LAST_RUN.md
          git commit -q -m "rebalance-live-canary run ${GITHUB_RUN_ID} (armed=${ARMED:-?})"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "publish:${BRANCH}"
          echo "Published to ${BRANCH}."

  autonomous_live_approval:
    needs: live_portfolio_canary_preview
    if: >-
      needs.live_portfolio_canary_preview.outputs.armed == 'true' &&
      needs.live_portfolio_canary_preview.outputs.blocked != 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      decision: ${{ steps.approval.outputs.decision }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate autonomous production approval evidence
        id: approval
        env:
          ARMED: ${{ needs.live_portfolio_canary_preview.outputs.armed }}
          BLOCKED: ${{ needs.live_portfolio_canary_preview.outputs.blocked }}
          CAP: ${{ needs.live_portfolio_canary_preview.outputs.capital }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "${REF}" == "refs/heads/main" ]] || {
            echo "autonomous approval requires refs/heads/main; got ${REF}" >&2
            exit 1
          }
          [[ "${ARMED}" == "true" ]] || {
            echo "autonomous approval requires armed=true" >&2
            exit 1
          }
          [[ "${BLOCKED}" != "true" ]] || {
            echo "autonomous approval refuses a blocked capital gate" >&2
            exit 1
          }
          ./scripts/ci_validate_decimal.sh capital "${CAP}"
          case "${EVENT}" in
            schedule) decision="scheduled-real-order" ;;
            workflow_dispatch) decision="manual-no-order-preflight" ;;
            *) echo "unsupported autonomous approval event: ${EVENT}" >&2; exit 1 ;;
          esac
          echo "decision=${decision}" >> "$GITHUB_OUTPUT"
          echo "AUTONOMOUS_PRODUCTION_APPROVED event=${EVENT} decision=${decision} capital=${CAP}"

  live_portfolio_canary_real_orders:
    needs: [live_portfolio_canary_preview, autonomous_live_approval]
    if: >-
      needs.autonomous_live_approval.result == 'success' &&
      (needs.autonomous_live_approval.outputs.decision == 'scheduled-real-order' ||
       needs.autonomous_live_approval.outputs.decision == 'manual-no-order-preflight')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install uv for local entry revalidation
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Validate production live gate outputs
        id: gate
        run: |
          set -uo pipefail
          armed="${{ needs.live_portfolio_canary_preview.outputs.armed }}"
          capital="${{ needs.live_portfolio_canary_preview.outputs.capital }}"
          blocked="${{ needs.live_portfolio_canary_preview.outputs.blocked }}"
          decision="${{ needs.autonomous_live_approval.outputs.decision }}"
          if [[ "${armed}" != "true" ]]; then
            echo "preview job did not arm live orders; refusing production job" >&2
            exit 1
          fi
          if [[ "${blocked}" == "true" ]]; then
            echo "preview job marked capital gate blocked; refusing production job" >&2
            exit 1
          fi
          case "${decision}" in
            scheduled-real-order|manual-no-order-preflight) ;;
            *) echo "missing or invalid autonomous approval decision: ${decision}" >&2; exit 1 ;;
          esac
          ./scripts/ci_validate_decimal.sh capital "${capital}" || exit $?
          echo "armed=${armed}" >> "$GITHUB_OUTPUT"
          echo "capital=${capital}" >> "$GITHUB_OUTPUT"
          echo "blocked=${blocked}" >> "$GITHUB_OUTPUT"
          echo "production live gate: autonomous=${decision} armed=${armed} capital=${capital} blocked=${blocked}"

      - name: Install SSH key
        env:
          KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VULTR_SSH_KNOWN_HOSTS }}
          SSH_USER: ${{ secrets.VULTR_SSH_USER }}
        run: |
          VULTR_SSH_PRIVATE_KEY="${KEY:-}" \
          VULTR_SSH_KNOWN_HOSTS="${KNOWN_HOSTS:-}" \
          VULTR_SSH_USER="${SSH_USER:-}" \
          ./scripts/ci_secure_ssh.sh

      - name: Revalidate latest edge before the first strategy fill
        id: entry_revalidation
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
          CAP: ${{ steps.gate.outputs.capital }}
        run: |
          set -uo pipefail
          branch="automation/profit-evidence-engine-last-run"
          factory_branch="automation/autonomous-strategy-factory-last-run"
          git fetch --depth=1 origin \
            "+refs/heads/${branch}:refs/remotes/origin/${branch}" >/tmp/entry_fetch.log 2>&1 || true
          git fetch --depth=1 origin \
            "+refs/heads/${factory_branch}:refs/remotes/origin/${factory_branch}" \
            >>/tmp/entry_fetch.log 2>&1 || true
          git show "origin/${branch}:profit_evidence.json" \
            > /tmp/profit_evidence.json 2>/tmp/profit_evidence.err || echo '{}' > /tmp/profit_evidence.json
          git show "origin/${branch}:operational_canary_evidence.json" \
            > /tmp/operational_canary_evidence.json 2>/tmp/operational_canary_evidence.err \
            || echo '{}' > /tmp/operational_canary_evidence.json
          evidence_epoch="$(git show -s --format=%ct "origin/${branch}" 2>/dev/null || echo 0)"
          now_epoch="$(date +%s)"
          evidence_age_hours="$(python3 -c \
            "print(max(0, int('${now_epoch}')-int('${evidence_epoch}'))/3600 if int('${evidence_epoch}') else 999999)")"
          git show "origin/${factory_branch}:capital_entry_evidence.json" \
            > /tmp/capital_entry_evidence.json 2>/tmp/capital_entry_evidence.err || echo '{}' \
            > /tmp/capital_entry_evidence.json
          factory_epoch="$(git show -s --format=%ct "origin/${factory_branch}" 2>/dev/null || echo 0)"
          factory_age_hours="$(python3 -c \
            "print(max(0, int('${now_epoch}')-int('${factory_epoch}'))/3600 if int('${factory_epoch}') else 999999)")"
          port="${PORT:-22}"
          set +e
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "observe exploration-canary" \
              > /tmp/entry_hardened_canary.json 2>/tmp/entry_hardened_canary.err
          canary_exit=$?
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "live-canary-profit ${CAP}" \
              > /tmp/entry_live_profit.json 2>/tmp/entry_live_profit.err
          profit_exit=$?
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "observe execution-proxy-parity" \
              > /tmp/entry_execution_proxy_parity.json 2>/tmp/entry_execution_proxy_parity.err
          proxy_parity_exit=$?
          if [[ ! -s /tmp/entry_execution_proxy_parity.json ]]; then
            echo '{}' > /tmp/entry_execution_proxy_parity.json
          fi
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "observe live-canary-preview ${CAP}" \
              > /tmp/entry_fundability_preview.json 2>/tmp/entry_fundability_preview.err
          fundability_exit=$?
          if [[ ! -s /tmp/entry_fundability_preview.json ]]; then
            echo '{}' > /tmp/entry_fundability_preview.json
          fi
          uv run python scripts/live_entry_revalidation_probe.py \
            --profit-evidence-json /tmp/profit_evidence.json \
            --operational-evidence-json /tmp/operational_canary_evidence.json \
            --factory-evidence-json /tmp/capital_entry_evidence.json \
            --hardened-canary-json /tmp/entry_hardened_canary.json \
            --live-performance-json /tmp/entry_live_profit.json \
            --evidence-age-hours "${evidence_age_hours}" \
            --factory-evidence-age-hours "${factory_age_hours}" \
            --operational-evidence-age-hours "${evidence_age_hours}" \
            --expected-code-commit "${GITHUB_SHA}" \
            --sentinel automation/rebalance-live.request \
            --live-portfolio deploy/canary-live-portfolio.toml \
            --validated-portfolio deploy/global-trend-fixed-portfolio.toml \
            --fundability-preview-json /tmp/entry_fundability_preview.json \
            --execution-proxy-parity-json /tmp/entry_execution_proxy_parity.json \
            --capital-usd "${CAP}" \
            > /tmp/entry_revalidation.json
          revalidation_exit=$?
          allowed="$(python3 -c \
            "import json; print(str(json.load(open('/tmp/entry_revalidation.json')).get('allowed', False)).lower())" \
            2>/dev/null || echo false)"
          state="$(python3 -c \
            "import json; print(json.load(open('/tmp/entry_revalidation.json')).get('state', 'ENTRY_BLOCKED'))" \
            2>/dev/null || echo ENTRY_BLOCKED)"
          echo "allowed=${allowed}" >> "$GITHUB_OUTPUT"
          echo "state=${state}" >> "$GITHUB_OUTPUT"
          {
            echo "evidence_age_hours=${evidence_age_hours} canary_exit=${canary_exit} profit_exit=${profit_exit} proxy_parity_exit=${proxy_parity_exit} fundability_exit=${fundability_exit}"
            cat /tmp/entry_revalidation.json
            cat /tmp/profit_evidence.err /tmp/operational_canary_evidence.err \
              /tmp/capital_entry_evidence.err \
              /tmp/entry_hardened_canary.err /tmp/entry_live_profit.err \
              /tmp/entry_execution_proxy_parity.err \
              /tmp/entry_fundability_preview.err 2>/dev/null
          } > /tmp/entry_revalidation.log
          cat /tmp/entry_revalidation.log
          [[ "${canary_exit}" == "0" && "${profit_exit}" == "0" && \
             "${proxy_parity_exit}" == "0" && \
             "${fundability_exit}" == "0" ]] || exit 3
          exit "${revalidation_exit}"

      - name: Authorize request — scheduled runs place real orders
        id: live
        if: steps.entry_revalidation.outputs.allowed == 'true'
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
          CAP: ${{ steps.gate.outputs.capital }}
          EVENT: ${{ github.event_name }}
          LIVE_ORDER_SIGNING_KEY: ${{ secrets.LIVE_ORDER_SIGNING_KEY }}
        run: |
          set -uo pipefail
          port="${PORT:-22}"
          if [[ -z "${LIVE_ORDER_SIGNING_KEY:-}" ]]; then
            echo "production LIVE_ORDER_SIGNING_KEY is missing; refusing live order" >&2
            exit 2
          fi
          key_file="$(mktemp)"
          payload_file="$(mktemp)"
          signature_file="$(mktemp)"
          trap 'rm -f "${key_file}" "${payload_file}" "${signature_file}"' EXIT
          chmod 0600 "${key_file}"
          printf '%s\n' "${LIVE_ORDER_SIGNING_KEY}" > "${key_file}"
          openssl pkey -in "${key_file}" -noout >/dev/null
          expires="$(( $(date +%s) + 600 ))"
          nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          payload="${GITHUB_REPOSITORY}|rebalance-live-canary.yml|${GITHUB_RUN_ID}|${GITHUB_SHA}|${CAP}|${expires}|${nonce}"
          printf '%s' "${payload}" > "${payload_file}"
          openssl pkeyutl -sign -rawin -inkey "${key_file}" \
              -in "${payload_file}" -out "${signature_file}"
          signature="$(base64 < "${signature_file}" | tr -d '\n')"
          gateway_action="live-canary-order"
          if [[ "${EVENT}" == "workflow_dispatch" ]]; then
            gateway_action="live-canary-verify-order"
            echo "Manual production preflight: authorize only, real orders=0."
          else
            echo "⚠ SCHEDULED + ARMED — placing REAL orders (capital=${CAP})."
          fi
          set +e
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "${gateway_action} ${GITHUB_RUN_ID} ${GITHUB_SHA} ${CAP} ${expires} ${nonce} ${signature}" \
              > /tmp/live_rebal.json 2>/tmp/live_rebal.err
          ssh_exit=$?
          echo "ssh_exit=${ssh_exit}" >> "$GITHUB_OUTPUT"
          echo "--- live rebalance ---"; cat /tmp/live_rebal.json
          echo "--- stderr ---"; cat /tmp/live_rebal.err
          exit "${ssh_exit}"

      - name: Sync broker fills and read audit ledger
        id: fills
        if: always()
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
        run: |
          set +e
          port="${PORT:-22}"
          # 지정가 체결은 주문 응답 직후 KIS에 늦게 보일 수 있다. 짧게 세 번 동기화하되
          # fills --sync는 주문·취소 없이 브로커 체결을 추가-전용 장부로 당기기만 한다.
          sync_exit=0
          : > /tmp/live_fills.log
          for attempt in 1 2 3; do
            echo "--- fill sync attempt ${attempt}/3 ---" >> /tmp/live_fills.log
            ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=15 \
                -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
                "live-canary-fills" \
                >> /tmp/live_fills.log 2>&1
            sync_exit=$?
            if [[ "${sync_exit}" != "0" || "${attempt}" == "3" ]]; then
              break
            fi
            sleep 20
          done
          echo "ssh_exit=${sync_exit}" >> "$GITHUB_OUTPUT"
          cat /tmp/live_fills.log
          exit "${sync_exit}"

      - name: Measure live track after real orders
        id: measure
        if: always()
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
          CAP: ${{ steps.gate.outputs.capital }}
        run: |
          set +e
          port="${PORT:-22}"
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "observe live-canary-measure ${CAP}" \
              > /tmp/live_measure.log 2>&1
          measure_exit=$?
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "live-canary-profit ${CAP}" \
              > /tmp/live_profit.json 2>/tmp/live_profit.err
          profit_exit=$?
          ssh_exit="${measure_exit}"
          [[ "${profit_exit}" == "0" ]] || ssh_exit="${profit_exit}"
          {
            echo "--- nav + forward verdict ---"
            cat /tmp/live_measure.log
            echo "--- live performance ---"
            cat /tmp/live_profit.json
            if [[ -s /tmp/live_profit.err ]]; then
              echo "--- performance stderr ---"
              cat /tmp/live_profit.err
            fi
          } > /tmp/live_measure_combined.log
          mv /tmp/live_measure_combined.log /tmp/live_measure.log
          echo "ssh_exit=${ssh_exit}" >> "$GITHUB_OUTPUT"
          echo "exit=${ssh_exit}"; cat /tmp/live_measure.log
          exit "${ssh_exit}"

      - name: Reconcile account after the order attempt
        id: reconciliation
        if: always()
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
        run: |
          set +e
          port="${PORT:-22}"
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "reconciliation-halt-recovery" \
              > /tmp/post_trade_reconciliation.json 2>/tmp/post_trade_reconciliation.err
          ssh_exit=$?
          echo "ssh_exit=${ssh_exit}" >> "$GITHUB_OUTPUT"
          cat /tmp/post_trade_reconciliation.json /tmp/post_trade_reconciliation.err
          exit "${ssh_exit}"

      - name: Publish production live canary result to sidecar branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARMED: ${{ steps.gate.outputs.armed }}
          CAP: ${{ steps.gate.outputs.capital }}
          BLOCKED: ${{ steps.gate.outputs.blocked }}
          ENTRY_OUTCOME: ${{ steps.entry_revalidation.outcome }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          FILLS_OUTCOME: ${{ steps.fills.outcome }}
          MEASURE_OUTCOME: ${{ steps.measure.outcome }}
          RECONCILIATION_OUTCOME: ${{ steps.reconciliation.outcome }}
          EVENT: ${{ github.event_name }}
        run: |
          set -o pipefail
          BRANCH=automation/rebalance-live-canary-last-run
          tmpdir=$(mktemp -d); cd "${tmpdir}"; git init -q
          git config user.name "rebalance-live-bot"
          git config user.email "rebalance-live-bot@noreply.github.com"
          {
            echo "# 라이브 캐너리 포트폴리오 — 최신 실행 (가드형 실거래 채널)"
            echo ""
            echo "| 항목 | 값 |"
            echo "|------|-----|"
            echo "| run_id | ${GITHUB_RUN_ID} |"
            echo "| timestamp_utc | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            echo "| armed (무장 여부) | ${ARMED:-?} |"
            echo "| capital_usd | ${CAP:-?} |"
            echo "| blocked (자본 가드 거부) | ${BLOCKED:-?} |"
            echo "| 첫 체결 전 최신 엣지 재검증 | ${ENTRY_OUTCOME:-skipped} |"
            echo "| event | ${EVENT:-?} |"
            echo "| LIVE 스텝 | ${LIVE_OUTCOME:-skipped} (success=명령 종료 코드 0) |"
            echo "| 체결 동기화 | ${FILLS_OUTCOME:-skipped} |"
            echo "| 사후 측정 | ${MEASURE_OUTCOME:-skipped} |"
            echo "| 사후 계좌 정합성 | ${RECONCILIATION_OUTCOME:-skipped} |"
            echo ""
            if [[ "${LIVE_OUTCOME:-skipped}" == "success" ]]; then
              echo "> ⚠ **무장 + production 기계 승인 + 실행** — 예약이면 실주문, 수동이면 주문 없는 검증이다."
              echo "> 아래 라이브 재조정 결과를 확인하라."
            else
              echo "> 🟡 **무장됐지만 실주문 job 이 완료되지 않음** — 아래 stderr/로그 확인."
            fi
            echo ""
            echo "## 드라이런 미리보기 — 무장 시 거래할 내역 (주문 0건)"
            echo '```json'
            echo '(preview job 이 직전 sidecar에 발행함)'
            echo '```'
            echo ""
            echo "## 첫 체결 전 최신 엣지 재검증"
            echo '```json'
            cat /tmp/entry_revalidation.log 2>/dev/null || echo '(none)'
            echo '```'
            echo ""
            echo "## 라이브 재조정 결과 (armed=true 일 때만)"
            echo '```json'
            cat /tmp/live_rebal.json 2>/dev/null || echo '(실주문 결과 없음)'
            if [[ -s /tmp/live_rebal.err ]]; then
              echo '--- stderr ---'
              cat /tmp/live_rebal.err
            fi
            echo '```'
            echo ""
            echo "## KIS 체결 동기화·감사 장부 요약"
            echo '```'
            cat /tmp/live_fills.log 2>/dev/null || echo '(체결 동기화 결과 없음)'
            echo '```'
            echo ""
            echo "## 라이브 트랙 측정 (NAV 스냅샷 + forward-verdict --mode live + 칼마)"
            echo '```'
            cat /tmp/live_measure.log 2>/dev/null || echo '(none)'
            echo '```'
            echo ""
            echo "## 사후 계좌 정합성"
            echo '```json'
            cat /tmp/post_trade_reconciliation.json 2>/dev/null || echo '{}'
            cat /tmp/post_trade_reconciliation.err 2>/dev/null || true
            echo '```'
          } > LAST_RUN.md
          git checkout --orphan publish
          python3 "${GITHUB_WORKSPACE}/scripts/redact_public_sidecar.py" . 2>/dev/null || true
          git add LAST_RUN.md
          git commit -q -m "rebalance-live-canary production run ${GITHUB_RUN_ID} (armed=${ARMED:-?})"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "publish:${BRANCH}"
          echo "Published to ${BRANCH}."
