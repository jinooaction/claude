name: Rebalance forward paper validation (current-data track)

# 스펙 032 — 옛 과거 데이터 백테스트가 아니라 *현재 데이터로 앞으로(forward)* 재조정
# 전략을 페이퍼 트레이딩해 트랙레코드를 누적한다. 2026년 시장은 2013-2018(또는 2008)과
# regime 이 다르므로, "지금 통하는가"의 유일한 정직한 답은 현재 시세로 forward 검증이다.
#
# 매월 1일 미국 장 마감 후, 인스턴스에서 `rebalance-once --mode paper` 를 돌린다
# (라이브 KIS 시세로 가상 체결만 — 실주문 0건, 돈 안 움직임). 이어서 페이퍼 트랙의
# 성과(스펙 011)를 스냅샷해 사이드카 브랜치로 발행한다. 충분한 forward 관측이 쌓이면
# 디플레이티드 샤프(스펙 027)로 "현재 데이터에서 우연이 아닌 엣지"인지 판정한다.
#
# 안전 경계: PAPER 전용. 이 워크플로우는 절대 --mode live 를 쓰지 않는다(실주문 없음).
# 라이브 전환은 별도 운영자 게이트(헌법 X.4) + go-live-canary 채널이다.
#
# 사용법(컨테이너에서 최신 forward 트랙 확인):
#   git fetch origin automation/rebalance-paper-forward-last-run
#   git show origin/automation/rebalance-paper-forward-last-run:LAST_RUN.md

on:
  schedule:
    # 매 거래일(월~금) 22:30 UTC, 미국 장 마감 후 — 일봉 백필 + 페이퍼 마크를 매일 수행한다.
    # 일봉은 마감 1회만 갱신되므로 일 1회면 충분(실시간 불필요). 라이브 워커가 떠 있으면
    # 워커 틱(스펙 033)이 상시 백필하므로 이 워크플로는 워커 모드와 무관한 안전망 + 마크다.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      capital:
        description: "페이퍼 사이징 자본 USD (실계좌 잔고 아님, 가중치/캡 기준)."
        required: false
        default: "12000"
  # 자율 트리거: automation/rebalance-paper.request 센티넬이 main 에 머지되면 push 로
  # 발화한다(go-live-canary 와 동일 패턴). MCP 토큰은 workflow_dispatch 권한이 없어
  # (actions:write 부재) 세션이 직접 디스패치할 수 없으므로, request 파일 머지가 자율
  # 시작 경로다. PAPER 전용이라 돈은 움직이지 않는다.
  push:
    branches: [main]
    paths:
      - 'automation/rebalance-paper.request'

permissions:
  contents: write  # 사이드카 브랜치 force-push 용.

jobs:
  forward-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        env:
          KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Backfill universe daily bars from KIS (read-only quotes, no orders)
        id: backfill
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
        run: |
          set +e
          port="${PORT:-22}"
          # 재조정 스코어러는 저장된 일봉을 읽는다. 신선한 인스턴스는 price_bars 가 비어
          # 무거래가 되므로, 먼저 KIS 기간별시세(시세 조회 — 주문 0건)로 일봉을 채운다.
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "cd /opt/auto-invest && /usr/local/bin/uv run auto-invest backfill-bars \
                 --portfolio deploy/canary-portfolio.toml \
                 --db data/auto_invest.db --env-file .env --json" \
              > /tmp/backfill.json 2>/tmp/backfill.err
          echo "ssh_exit=$?" >> "$GITHUB_OUTPUT"
          echo "--- stdout ---"; cat /tmp/backfill.json
          echo "--- stderr ---"; cat /tmp/backfill.err

      - name: Run ONE paper rebalance on instance (current KIS data, no money)
        id: rebal
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
          CAPITAL: ${{ github.event.inputs.capital || '12000' }}
        run: |
          set +e
          port="${PORT:-22}"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "cd /opt/auto-invest && /usr/local/bin/uv run auto-invest rebalance-once \
                 --portfolio deploy/canary-portfolio.toml \
                 --mode paper \
                 --capital ${CAPITAL} \
                 --construct-universe-top-n 15 \
                 --db data/auto_invest.db \
                 --env-file .env \
                 --json" \
              > /tmp/rebal.json 2>/tmp/rebal.err
          echo "ssh_exit=$?" >> "$GITHUB_OUTPUT"
          echo "--- stdout ---"; cat /tmp/rebal.json
          echo "--- stderr ---"; cat /tmp/rebal.err

      - name: Snapshot forward paper performance (spec 011)
        id: perf
        if: always()
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
        run: |
          set +e
          port="${PORT:-22}"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "cd /opt/auto-invest && /usr/local/bin/uv run auto-invest performance \
                 --mode paper --window 365d --db data/auto_invest.db --format json" \
              > /tmp/perf.json 2>/tmp/perf.err
          echo "ssh_exit=$?" >> "$GITHUB_OUTPUT"
          echo "--- stdout ---"; cat /tmp/perf.json
          echo "--- stderr ---"; cat /tmp/perf.err

      - name: Diagnose stored bars on instance (why no-op?)
        id: bars
        if: always()
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
        run: |
          set +e
          port="${PORT:-22}"
          # 무거래(빈 target_weights)의 원인을 못 박는다: 유니버스 심볼별 저장 바 수.
          # 룩백/모멘텀 윈도우보다 적으면 스코어가 비어 아무것도 거래되지 않는다.
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "cd /opt/auto-invest && /usr/local/bin/uv run auto-invest bars-status \
                 --portfolio deploy/canary-portfolio.toml \
                 --timeframe 1d --db data/auto_invest.db --json" \
              > /tmp/bars.json 2>/tmp/bars.err
          echo "ssh_exit=$?" >> "$GITHUB_OUTPUT"
          echo "--- stdout ---"; cat /tmp/bars.json
          echo "--- stderr ---"; cat /tmp/bars.err

      - name: Publish forward track to sidecar branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REBAL_EXIT: ${{ steps.rebal.outputs.ssh_exit }}
          PERF_EXIT: ${{ steps.perf.outputs.ssh_exit }}
          BARS_EXIT: ${{ steps.bars.outputs.ssh_exit }}
          BACKFILL_EXIT: ${{ steps.backfill.outputs.ssh_exit }}
        run: |
          set -uo pipefail
          BRANCH=automation/rebalance-paper-forward-last-run
          tmpdir=$(mktemp -d); cd "${tmpdir}"; git init -q
          git config user.name "rebalance-paper-bot"
          git config user.email "rebalance-paper-bot@noreply.github.com"
          {
            echo "# 재조정 forward 페이퍼 검증 — 최신 실행 (현재 데이터, 돈 안 움직임)"
            echo ""
            echo "| 항목 | 값 |"
            echo "|------|-----|"
            echo "| run_id | ${GITHUB_RUN_ID} |"
            echo "| commit | ${GITHUB_SHA} |"
            echo "| trigger | ${GITHUB_EVENT_NAME} |"
            echo "| timestamp_utc | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            echo "| backfill ssh_exit | ${BACKFILL_EXIT:-?} |"
            echo "| rebalance ssh_exit | ${REBAL_EXIT:-?} |"
            echo "| performance ssh_exit | ${PERF_EXIT:-?} |"
            echo "| bars-status ssh_exit | ${BARS_EXIT:-?} |"
            echo ""
            echo "## KIS 일봉 백필 결과(JSON)"
            echo ""
            echo '```json'
            cat /tmp/backfill.json 2>/dev/null || echo '{}'
            echo '```'
            echo ""
            echo "> PAPER 전용 — 실주문 0건. 이 forward 트랙이 옛 백테스트보다 '지금 통하는가'를"
            echo "> 더 정직하게 답한다. 관측이 충분히 쌓이면 디플레이티드 샤프로 유의성을 판정하라."
            echo ""
            echo "## 인스턴스 저장 바 수 (무거래 원인 진단)"
            echo ""
            echo "> 유니버스 심볼의 일봉 저장량. 룩백/모멘텀 윈도우보다 적으면 스코어가 비어"
            echo "> 무거래가 된다. count=0 이면 워커가 그 심볼의 1d 바를 아직 안 쌓은 것."
            echo ""
            echo '```json'
            cat /tmp/bars.json 2>/dev/null || echo '{}'
            echo '```'
            echo ""
            echo "## 페이퍼 재조정 출력(JSON)"
            echo ""
            echo '```json'
            cat /tmp/rebal.json 2>/dev/null || echo '{}'
            echo '```'
            echo ""
            echo "## forward 페이퍼 성과(JSON)"
            echo ""
            echo '```json'
            cat /tmp/perf.json 2>/dev/null || echo '{}'
            echo '```'
            echo ""
            echo "## stderr"
            echo ""
            echo '```'
            cat /tmp/backfill.err /tmp/rebal.err /tmp/perf.err /tmp/bars.err 2>/dev/null || echo '(none)'
            echo '```'
          } > LAST_RUN.md
          git checkout --orphan publish
          git add LAST_RUN.md
          git commit -q -m "rebalance-paper-forward run ${GITHUB_RUN_ID}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "publish:${BRANCH}"
          echo "Published to ${BRANCH}."
