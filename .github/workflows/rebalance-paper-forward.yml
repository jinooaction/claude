name: Rebalance forward paper validation (current-data track)

# 스펙 032/035/037 — 옛 과거 데이터 백테스트가 아니라 *현재 데이터로 앞으로(forward)*
# 재조정 전략을 페이퍼 트레이딩해 트랙레코드를 누적하고, 스펙 035 forward-verdict 로
# "단순 보유를 우연 아니게 이기는가"를 자동 판정한다.
#
# 스펙 037 — A/B 토너먼트: 추세 필터 ON(canary-portfolio.toml) vs OFF
# (canary-portfolio-notrend.toml)를 *각자 전용 DB*(forward_trend.db / forward_notrend.db)
# 에서 병렬로 돌린다. DB 파일이 격리 경계라 두 트랙의 체결·NAV 가 섞이지 않는다(코드 변경 0).
# 두 판정을 나란히 비교하면 "추세 필터(드로다운 방어)가 실제로 도움이 되는가"의 격리된 답.
#
# 안전 경계: PAPER 전용. 이 워크플로우는 절대 --mode live 를 쓰지 않는다(실주문 0건, 돈
# 안 움직임). 라이브 전환은 별도 운영자 게이트(헌법 X.4) + go-live-canary 채널이다.
#
# 사용법(컨테이너에서 최신 forward 트랙 확인):
#   git fetch origin automation/rebalance-paper-forward-last-run
#   git show origin/automation/rebalance-paper-forward-last-run:LAST_RUN.md

on:
  schedule:
    # 매 거래일(월~금) 22:30 UTC, 미국 장 마감 후 — 일봉 백필 + 페이퍼 마크를 매일 수행한다.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      capital:
        description: "페이퍼 사이징 자본 USD (실계좌 잔고 아님, 가중치/캡 기준)."
        required: false
        default: "12000"
  # 자율 트리거: automation/rebalance-paper.request 센티넬이 main 에 머지되면 push 로 발화.
  push:
    branches: [main]
    paths:
      - 'automation/rebalance-paper.request'

permissions:
  contents: write  # 사이드카 브랜치 force-push 용.

jobs:
  forward-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 일일 전략 모니터 (스펙 046, 러너 로컬 — Shiller 데이터만, 워커 불필요) --------
      # 검증된 스펙(042~045)을 합친 지속 감시 대시보드: ① 엣지 최근 유효성 ② 분산 가정 신뢰도
      # ③ 낙폭 예산별 레버리지 복리 권고(최근 25년) ④ 오늘 추세 신호. 읽기 전용 — 돈 0 이동,
      # 거래 변경 0. 완전 격리(continue-on-error + || true)라 ARM A/B/C/D 를 절대 못 깨뜨린다.
      - name: Install uv (for strategy monitor)
        uses: astral-sh/setup-uv@v3
        continue-on-error: true

      - name: "일일 전략 모니터 — regime/엣지/레버리지/오늘 신호 (스펙 046)"
        id: monitor
        continue-on-error: true
        run: |
          set +e
          {
            echo "=== 낙폭 예산 15% ==="
            uv run python scripts/strategy_monitor_probe.py --dd-budget 15 2>/dev/null
            echo ""
            echo "=== 낙폭 예산 20% (레버리지 권고 비교) ==="
            uv run python scripts/strategy_monitor_probe.py --dd-budget 20 --json 2>/dev/null
          } > /tmp/monitor.txt 2>&1 || echo "(monitor unavailable)" > /tmp/monitor.txt
          cat /tmp/monitor.txt

      - name: Install SSH key
        env:
          KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      # ---- Halt 깃발 진단 (읽기 전용) ----------------------------------------
      # 2026-06-10 관측: 다섯 페이퍼 트랙이 --halt-path 를 안 넘겨 모두 기본값
      # data/halt.flag(라이브 워커의 킬스위치)를 공유 → 라이브 쪽에서 자동 설정된 묵은
      # 깃발에 전 트랙 주문이 REJECTED_BY_GATE → NAV 영원히 0 → EDGE_CONFIRMED 불가.
      # 아래 각 트랙은 전용 깃발(data/forward_*.halt.flag)로 격리했지만, 라이브 깃발이
      # 서 있으면 (무장 시) 실주문이 거부되므로 운영자가 사유를 보고 해제를 결정할 수
      # 있게 매 런 보고한다. 읽기 전용 — 깃발을 절대 만들거나 지우지 않는다.
      - name: "Halt 깃발 상태 — 라이브 + 트랙별 (읽기 전용 진단)"
        id: halt_status
        continue-on-error: true
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
        run: |
          set +e
          port="${PORT:-22}"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "cd /opt/auto-invest && \
                 for f in data/halt.flag data/forward_trend.halt.flag data/forward_notrend.halt.flag data/forward_rmbeta.halt.flag data/forward_multiasset.halt.flag data/forward_global.halt.flag data/forward_globalfixed.halt.flag; do \
                   echo \"-- \${f}\"; cat \"\${f}\" 2>/dev/null || echo '(없음 — 정지 아님)'; \
                 done" \
              > /tmp/halt_status.txt 2>&1
          cat /tmp/halt_status.txt

      # ---- ARM A: 추세 필터 ON ---------------------------------------------
      # 트랙별 전용 halt 깃발(--halt-path): 전용 DB 와 같은 격리 원칙. 라이브 워커의
      # data/halt.flag 와 절대 공유하지 않는다(위 진단 스텝의 사고 참조).
      - name: "Arm TREND-ON — backfill + paper rebalance + NAV snapshot"
        id: prep_trend
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
          CAPITAL: ${{ github.event.inputs.capital || '12000' }}
        run: |
          set +e
          port="${PORT:-22}"
          cfg="deploy/canary-portfolio.toml"; dbf="data/forward_trend.db"; hlt="data/forward_trend.halt.flag"
          # 전용 DB(첫 실행이면 backfill-bars 가 자동 마이그레이션 후 생성). 깊이 우선 백필
          # (--order deepen --min-bars 1000 ≈4년: 시드된 핵심 종목을 KIS 한계까지 깊게 → IC
          # 비겹침 시점↑ → t-통계↑)→재조정(유동성 상위 50 구성→모멘텀 120 + 절대 게이트로 상위
          # 10 보유)→NAV 스냅샷. 측정/페이퍼 전용 — 주문 0건, 돈 0 이동.
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "cd /opt/auto-invest && \
                 /usr/local/bin/uv run auto-invest backfill-bars --portfolio ${cfg} --max-symbols 120 --min-bars 1000 --order deepen --db ${dbf} --env-file .env --json && \
                 /usr/local/bin/uv run auto-invest rebalance-once --portfolio ${cfg} --mode paper --capital ${CAPITAL} --construct-universe-top-n 50 --halt-path ${hlt} --db ${dbf} --env-file .env --json && \
                 /usr/local/bin/uv run auto-invest nav-snapshot --mode paper --capital ${CAPITAL} --db ${dbf} --env-file .env --snapshot --format json" \
              > /tmp/prep_trend.log 2>&1
          echo "ssh_exit=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/prep_trend.log

      - name: "Arm TREND-ON — forward edge verdict (spec 035)"
        id: verdict_trend
        if: always()
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
        run: |
          set +e
          port="${PORT:-22}"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "cd /opt/auto-invest && /usr/local/bin/uv run auto-invest forward-verdict \
                 --mode paper --portfolio deploy/canary-portfolio.toml \
                 --db data/forward_trend.db --format json" \
              > /tmp/verdict_trend.json 2>/tmp/verdict_trend.err
          echo "ssh_exit=$?" >> "$GITHUB_OUTPUT"
          echo "--- verdict ---"; cat /tmp/verdict_trend.json
          echo "--- stderr ---"; cat /tmp/verdict_trend.err

      - name: "예측 성공률(IC) — 최신 인스턴스 데이터로 실측 (스펙 041)"
        id: ic_recent
        if: always()
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
        run: |
          set +e
          port="${PORT:-22}"
          # 깊이 우선 백필(--order deepen, ≈4년)이 채운 *최신* 일봉으로 합성(모멘텀120) 점수의
          # IC 측정. 비겹침(step=horizon) 시점이 ~40+개로 늘어 t-통계가 단단해진다(유의성↑).
          # 1달·분기 수평선. 오래된 데이터가 아니라 인스턴스의 현재 데이터 — 운영자 요구.
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "cd /opt/auto-invest && \
                 echo '--- H=21 ---' && /usr/local/bin/uv run auto-invest signal-ic \
                   --portfolio deploy/canary-portfolio.toml --db data/forward_trend.db \
                   --forward-horizon 21 2>/dev/null; \
                 echo '--- H=63 ---' && /usr/local/bin/uv run auto-invest signal-ic \
                   --portfolio deploy/canary-portfolio.toml --db data/forward_trend.db \
                   --forward-horizon 63 2>/dev/null" \
              > /tmp/ic_recent.txt 2>&1
          echo "ssh_exit=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/ic_recent.txt

      # ---- ARM B: 추세 필터 OFF (대조군) -----------------------------------
      - name: "Arm TREND-OFF — backfill + paper rebalance + NAV snapshot"
        id: prep_notrend
        if: always()
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
          CAPITAL: ${{ github.event.inputs.capital || '12000' }}
        run: |
          set +e
          port="${PORT:-22}"
          cfg="deploy/canary-portfolio-notrend.toml"; dbf="data/forward_notrend.db"; hlt="data/forward_notrend.halt.flag"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "cd /opt/auto-invest && \
                 /usr/local/bin/uv run auto-invest backfill-bars --portfolio ${cfg} --max-symbols 120 --min-bars 1000 --order deepen --db ${dbf} --env-file .env --json && \
                 /usr/local/bin/uv run auto-invest rebalance-once --portfolio ${cfg} --mode paper --capital ${CAPITAL} --construct-universe-top-n 50 --halt-path ${hlt} --db ${dbf} --env-file .env --json && \
                 /usr/local/bin/uv run auto-invest nav-snapshot --mode paper --capital ${CAPITAL} --db ${dbf} --env-file .env --snapshot --format json" \
              > /tmp/prep_notrend.log 2>&1
          echo "ssh_exit=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/prep_notrend.log

      - name: "Arm TREND-OFF — forward edge verdict (spec 035)"
        id: verdict_notrend
        if: always()
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
        run: |
          set +e
          port="${PORT:-22}"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "cd /opt/auto-invest && /usr/local/bin/uv run auto-invest forward-verdict \
                 --mode paper --portfolio deploy/canary-portfolio-notrend.toml \
                 --db data/forward_notrend.db --format json" \
              > /tmp/verdict_notrend.json 2>/tmp/verdict_notrend.err
          echo "ssh_exit=$?" >> "$GITHUB_OUTPUT"
          echo "--- verdict ---"; cat /tmp/verdict_notrend.json
          echo "--- stderr ---"; cat /tmp/verdict_notrend.err

      # ---- ARM C: 위험관리 베타 (추세 게이트한 광범위 베타, 스펙 042) ---------
      # 종목 선택(ARM A/B)이 아니라 *베타의 자본 방어* — SPY·QQQ 를 각자 10개월(≈200일) 추세
      # 위일 때만 보유, 아래면 현금. 스펙 042 에서 1871~현재(대공황 포함) 검증된 엣지를 우리 KIS
      # 체결로 forward 페이퍼 누적해 "확신을 벌기" 위함(운영자 2026-06-05). 전용 DB 로 격리되고
      # 각 스텝이 set +e + if:always() 라 ARM A/B 를 절대 못 깨뜨린다. QQQ 백필이 실패해도 SPY
      # 만으로 추세 게이트가 동작한다(graceful degrade). PAPER 전용 — 실주문 0건, 돈 0 이동.
      - name: "Arm RISK-MANAGED-BETA — backfill + paper rebalance + NAV snapshot"
        id: prep_rmbeta
        if: always()
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
          CAPITAL: ${{ github.event.inputs.capital || '12000' }}
        run: |
          set +e
          port="${PORT:-22}"
          cfg="deploy/risk-managed-beta-portfolio.toml"; dbf="data/forward_rmbeta.db"; hlt="data/forward_rmbeta.halt.flag"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "cd /opt/auto-invest && \
                 /usr/local/bin/uv run auto-invest backfill-bars --portfolio ${cfg} --max-symbols 120 --min-bars 1000 --order deepen --db ${dbf} --env-file .env --json && \
                 /usr/local/bin/uv run auto-invest rebalance-once --portfolio ${cfg} --mode paper --capital ${CAPITAL} --halt-path ${hlt} --db ${dbf} --env-file .env --json && \
                 /usr/local/bin/uv run auto-invest nav-snapshot --mode paper --capital ${CAPITAL} --db ${dbf} --env-file .env --snapshot --format json" \
              > /tmp/prep_rmbeta.log 2>&1
          echo "ssh_exit=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/prep_rmbeta.log

      - name: "Arm RISK-MANAGED-BETA — forward edge verdict (spec 035)"
        id: verdict_rmbeta
        if: always()
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
        run: |
          set +e
          port="${PORT:-22}"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "cd /opt/auto-invest && /usr/local/bin/uv run auto-invest forward-verdict \
                 --mode paper --portfolio deploy/risk-managed-beta-portfolio.toml \
                 --db data/forward_rmbeta.db --format json" \
              > /tmp/verdict_rmbeta.json 2>/tmp/verdict_rmbeta.err
          echo "ssh_exit=$?" >> "$GITHUB_OUTPUT"
          echo "--- verdict ---"; cat /tmp/verdict_rmbeta.json
          echo "--- stderr ---"; cat /tmp/verdict_rmbeta.err

      # ---- ARM D: 멀티에셋 분산 추세추종 (비상관 자산 합성, 스펙 043) --------
      # ARM C(SPY·QQQ=둘 다 주식)와 달리 *비상관 자산*을 합친다 — 주식(SPY) + 채권(IEF, 7~10년
      # 국채). 각자 추세 위일 때만 보유. 스펙 043 에서 Shiller 1871~현재로 검증한 분산 엣지(단일
      # 주식 추세 샤프 1.18~1.43 → 분산 추세 1.58~1.81, 낙폭 절반)를 우리 KIS 체결로 forward
      # 누적해 *확신을 번다*. 전용 DB 격리 + set +e + if:always() 라 ARM A/B/C 를 못 깨뜨린다.
      # IEF 백필이 실패해도 SPY 만으로 동작(graceful degrade). PAPER 전용 — 실주문 0건, 돈 0 이동.
      - name: "Arm MULTI-ASSET-TREND — backfill + paper rebalance + NAV snapshot"
        id: prep_multiasset
        if: always()
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
          CAPITAL: ${{ github.event.inputs.capital || '12000' }}
        run: |
          set +e
          port="${PORT:-22}"
          cfg="deploy/multi-asset-trend-portfolio.toml"; dbf="data/forward_multiasset.db"; hlt="data/forward_multiasset.halt.flag"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "cd /opt/auto-invest && \
                 /usr/local/bin/uv run auto-invest backfill-bars --portfolio ${cfg} --max-symbols 120 --min-bars 1000 --order deepen --db ${dbf} --env-file .env --json && \
                 /usr/local/bin/uv run auto-invest rebalance-once --portfolio ${cfg} --mode paper --capital ${CAPITAL} --halt-path ${hlt} --db ${dbf} --env-file .env --json && \
                 /usr/local/bin/uv run auto-invest nav-snapshot --mode paper --capital ${CAPITAL} --db ${dbf} --env-file .env --snapshot --format json" \
              > /tmp/prep_multiasset.log 2>&1
          echo "ssh_exit=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/prep_multiasset.log

      - name: "Arm MULTI-ASSET-TREND — forward edge verdict (spec 035)"
        id: verdict_multiasset
        if: always()
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
        run: |
          set +e
          port="${PORT:-22}"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "cd /opt/auto-invest && /usr/local/bin/uv run auto-invest forward-verdict \
                 --mode paper --portfolio deploy/multi-asset-trend-portfolio.toml \
                 --db data/forward_multiasset.db --format json" \
              > /tmp/verdict_multiasset.json 2>/tmp/verdict_multiasset.err
          echo "ssh_exit=$?" >> "$GITHUB_OUTPUT"
          echo "--- verdict ---"; cat /tmp/verdict_multiasset.json
          echo "--- stderr ---"; cat /tmp/verdict_multiasset.err

      # ---- ARM E: 글로벌 분산 추세추종 (주식+채권+금, 역변동성, 스펙 047) --------
      # ARM D(SPY·IEF=2자산)에 *세 번째 비상관 자산(금, GLD)* 을 더한 3자산 GTAA. 금은 주식·채권
      # 둘 다와 비상관이라(특히 주식·채권 상관이 양수로 가는 인플레 regime 의 구조적 헤지) 분산
      # 이득을 더한다. 핵심: 금은 변동성 큰 자산이라 *균등이 아니라 역변동성(리스크 패리티)으로*
      # 사이징해야 분산 이득만 취하고 변동성은 안 들여온다(스펙 047 실측 — weight_scheme=inverse_vol).
      # Shiller 1871~ + 런던 금 1833~ 으로 검증한 결과를 우리 KIS 체결로 forward 누적해 *확신을
      # 번다*. 전용 DB 격리 + set +e + if:always() 라 ARM A/B/C/D 를 못 깨뜨린다. GLD/IEF 백필이
      # 실패해도 나머지로 동작(graceful degrade). PAPER 전용 — 실주문 0건, 돈 0 이동.
      - name: "Arm GLOBAL-TREND — backfill + paper rebalance + NAV snapshot"
        id: prep_global
        if: always()
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
          CAPITAL: ${{ github.event.inputs.capital || '12000' }}
        run: |
          set +e
          port="${PORT:-22}"
          cfg="deploy/global-trend-portfolio.toml"; dbf="data/forward_global.db"; hlt="data/forward_global.halt.flag"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "cd /opt/auto-invest && \
                 /usr/local/bin/uv run auto-invest backfill-bars --portfolio ${cfg} --max-symbols 120 --min-bars 1000 --order deepen --db ${dbf} --env-file .env --json && \
                 /usr/local/bin/uv run auto-invest rebalance-once --portfolio ${cfg} --mode paper --capital ${CAPITAL} --halt-path ${hlt} --db ${dbf} --env-file .env --json && \
                 /usr/local/bin/uv run auto-invest nav-snapshot --mode paper --capital ${CAPITAL} --db ${dbf} --env-file .env --snapshot --format json" \
              > /tmp/prep_global.log 2>&1
          echo "ssh_exit=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/prep_global.log

      - name: "Arm GLOBAL-TREND — forward edge verdict (spec 035)"
        id: verdict_global
        if: always()
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
        run: |
          set +e
          port="${PORT:-22}"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "cd /opt/auto-invest && /usr/local/bin/uv run auto-invest forward-verdict \
                 --mode paper --portfolio deploy/global-trend-portfolio.toml \
                 --db data/forward_global.db --format json" \
              > /tmp/verdict_global.json 2>/tmp/verdict_global.err
          echo "ssh_exit=$?" >> "$GITHUB_OUTPUT"
          echo "--- verdict ---"; cat /tmp/verdict_global.json
          echo "--- stderr ---"; cat /tmp/verdict_global.err

      # ---- ARM G: 글로벌 3자산 추세 고정(등가중) 재지정 후보 (스펙 047/050 후속) -------
      # 라이브 검증 트랙(global-trend-portfolio.toml, inverse_vol)과 weight_scheme 만 다른
      # 등가중 변형(deploy/global-trend-fixed-portfolio.toml). 깊은 분석에서 등가중이 캡 안
      # 무레버 복리 +1.3~2.3%p 높았으나(LIVE-STRATEGY-LEVERAGE-FINDINGS.md) 낙폭이 사다리
      # 강등선(10%)에 더 가깝다 — 이 트랙이 *일별* 낙폭/강등 빈도를 실측해 재지정 안전성을 답한다.
      # 전용 DB·halt 격리 + set +e + if:always() 라 다른 트랙을 못 깨뜨린다. PAPER 전용·돈 0.
      - name: "Arm GLOBAL-TREND-FIXED — backfill + paper rebalance + NAV snapshot"
        id: prep_globalfixed
        if: always()
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
          CAPITAL: ${{ github.event.inputs.capital || '12000' }}
        run: |
          set +e
          port="${PORT:-22}"
          cfg="deploy/global-trend-fixed-portfolio.toml"; dbf="data/forward_globalfixed.db"; hlt="data/forward_globalfixed.halt.flag"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "cd /opt/auto-invest && \
                 /usr/local/bin/uv run auto-invest backfill-bars --portfolio ${cfg} --max-symbols 120 --min-bars 1000 --order deepen --db ${dbf} --env-file .env --json && \
                 /usr/local/bin/uv run auto-invest rebalance-once --portfolio ${cfg} --mode paper --capital ${CAPITAL} --halt-path ${hlt} --db ${dbf} --env-file .env --json && \
                 /usr/local/bin/uv run auto-invest nav-snapshot --mode paper --capital ${CAPITAL} --db ${dbf} --env-file .env --snapshot --format json" \
              > /tmp/prep_globalfixed.log 2>&1
          echo "ssh_exit=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/prep_globalfixed.log

      - name: "Arm GLOBAL-TREND-FIXED — forward edge verdict (spec 035)"
        id: verdict_globalfixed
        if: always()
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
        run: |
          set +e
          port="${PORT:-22}"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "cd /opt/auto-invest && /usr/local/bin/uv run auto-invest forward-verdict \
                 --mode paper --portfolio deploy/global-trend-fixed-portfolio.toml \
                 --db data/forward_globalfixed.db --format json" \
              > /tmp/verdict_globalfixed.json 2>/tmp/verdict_globalfixed.err
          echo "ssh_exit=$?" >> "$GITHUB_OUTPUT"
          echo "--- verdict ---"; cat /tmp/verdict_globalfixed.json
          echo "--- stderr ---"; cat /tmp/verdict_globalfixed.err

      # ---- ARM F: 글로벌 분산 추세추종 확대 유니버스 (11 슬리브, 계획 ③) ----------
      # 검증된 메커니즘(역변동성 + 다중 속도 추세 앙상블) 그대로, 베팅의 폭만 3 → 11 슬리브
      # (주식 4 · 채권 3 · 실물 3 · 통화 1). 성과 ≈ 질 × √N — 제약 안에서 가장 큰 지렛대.
      # 규율: forward 페이퍼로 먼저 검증 — 라이브 캐너리는 검증 완료된 3자산 유지(검증 안 한
      # 폭 확장은 라이브에 안 꽂는다). 전용 DB·halt 격리 + set +e + if:always() 라 다른 트랙을
      # 못 깨뜨린다. PAPER 전용 — 실주문 0건, 돈 0 이동.
      - name: "Arm GLOBAL-TREND-WIDE — backfill + paper rebalance + NAV snapshot"
        id: prep_wide
        if: always()
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
          CAPITAL: ${{ github.event.inputs.capital || '12000' }}
        run: |
          set +e
          port="${PORT:-22}"
          cfg="deploy/global-trend-wide-portfolio.toml"; dbf="data/forward_wide.db"; hlt="data/forward_wide.halt.flag"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "cd /opt/auto-invest && \
                 /usr/local/bin/uv run auto-invest backfill-bars --portfolio ${cfg} --max-symbols 120 --min-bars 1000 --order deepen --db ${dbf} --env-file .env --json && \
                 /usr/local/bin/uv run auto-invest rebalance-once --portfolio ${cfg} --mode paper --capital ${CAPITAL} --halt-path ${hlt} --db ${dbf} --env-file .env --json && \
                 /usr/local/bin/uv run auto-invest nav-snapshot --mode paper --capital ${CAPITAL} --db ${dbf} --env-file .env --snapshot --format json" \
              > /tmp/prep_wide.log 2>&1
          echo "ssh_exit=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/prep_wide.log

      - name: "Arm GLOBAL-TREND-WIDE — forward edge verdict (spec 035)"
        id: verdict_wide
        if: always()
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
        run: |
          set +e
          port="${PORT:-22}"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              -p "${port}" -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "cd /opt/auto-invest && /usr/local/bin/uv run auto-invest forward-verdict \
                 --mode paper --portfolio deploy/global-trend-wide-portfolio.toml \
                 --db data/forward_wide.db --format json" \
              > /tmp/verdict_wide.json 2>/tmp/verdict_wide.err
          echo "ssh_exit=$?" >> "$GITHUB_OUTPUT"
          echo "--- verdict ---"; cat /tmp/verdict_wide.json
          echo "--- stderr ---"; cat /tmp/verdict_wide.err

      # ---- forward 토너먼트 리더보드 (스펙 053, 러너 로컬 — 판정 JSON 7개를 순위화) ----
      # 7개 트랙 판정(/tmp/verdict_*.json)을 정직성 게이트로 순위 매겨 리더보드 마크다운을
      # 만든다(읽기 전용 — 돈 0 이동, 거래 변경 0). 완전 격리(continue-on-error + 폴백)라
      # A/B 트랙을 절대 못 깨뜨린다(스펙 046 전략 모니터와 동일 자세). 산출물
      # /tmp/leaderboard.md 는 아래 사이드카 발행 스텝이 상단에 주입한다.
      - name: "forward 토너먼트 리더보드 — 7 트랙 순위 (스펙 053)"
        id: leaderboard
        if: always()
        continue-on-error: true
        run: |
          set +e
          uv run python scripts/forward_tournament_probe.py --verdict-dir /tmp \
            > /tmp/leaderboard.md 2>/tmp/leaderboard.err
          uv run python scripts/forward_tournament_probe.py --verdict-dir /tmp --json \
            > /tmp/leaderboard.json 2>>/tmp/leaderboard.err
          if [ ! -s /tmp/leaderboard.md ]; then
            echo "(리더보드 생성 실패 — 아래 트랙별 원시 판정 블록을 직접 비교)" > /tmp/leaderboard.md
            head -c 2000 /tmp/leaderboard.err >> /tmp/leaderboard.md 2>/dev/null || true
          fi
          if [ ! -s /tmp/leaderboard.json ]; then
            echo '{}' > /tmp/leaderboard.json
          fi
          exit 0

      - name: Publish A/B tournament to sidecar branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREP_TREND_EXIT: ${{ steps.prep_trend.outputs.ssh_exit }}
          VERDICT_TREND_EXIT: ${{ steps.verdict_trend.outputs.ssh_exit }}
          PREP_NOTREND_EXIT: ${{ steps.prep_notrend.outputs.ssh_exit }}
          VERDICT_NOTREND_EXIT: ${{ steps.verdict_notrend.outputs.ssh_exit }}
          PREP_RMBETA_EXIT: ${{ steps.prep_rmbeta.outputs.ssh_exit }}
          VERDICT_RMBETA_EXIT: ${{ steps.verdict_rmbeta.outputs.ssh_exit }}
          PREP_MULTIASSET_EXIT: ${{ steps.prep_multiasset.outputs.ssh_exit }}
          VERDICT_MULTIASSET_EXIT: ${{ steps.verdict_multiasset.outputs.ssh_exit }}
          PREP_GLOBAL_EXIT: ${{ steps.prep_global.outputs.ssh_exit }}
          VERDICT_GLOBAL_EXIT: ${{ steps.verdict_global.outputs.ssh_exit }}
          PREP_GLOBALFIXED_EXIT: ${{ steps.prep_globalfixed.outputs.ssh_exit }}
          VERDICT_GLOBALFIXED_EXIT: ${{ steps.verdict_globalfixed.outputs.ssh_exit }}
          PREP_WIDE_EXIT: ${{ steps.prep_wide.outputs.ssh_exit }}
          VERDICT_WIDE_EXIT: ${{ steps.verdict_wide.outputs.ssh_exit }}
        run: |
          set -uo pipefail
          BRANCH=automation/rebalance-paper-forward-last-run
          tmpdir=$(mktemp -d); cd "${tmpdir}"; git init -q
          git config user.name "rebalance-paper-bot"
          git config user.email "rebalance-paper-bot@noreply.github.com"
          {
            echo "# forward 페이퍼 A/B 토너먼트 — 최신 실행 (현재 데이터, 돈 안 움직임)"
            echo ""
            echo "추세 필터 **ON**(canary-portfolio.toml / forward_trend.db) vs **OFF**"
            echo "(canary-portfolio-notrend.toml / forward_notrend.db). 전용 DB 로 격리된"
            echo "두 페이퍼 트랙을 스펙 035 forward-verdict 로 각각 판정한다. PAPER 전용 — 실주문 0건."
            echo ""
            echo "| 항목 | 값 |"
            echo "|------|-----|"
            echo "| run_id | ${GITHUB_RUN_ID} |"
            echo "| commit | ${GITHUB_SHA} |"
            echo "| trigger | ${GITHUB_EVENT_NAME} |"
            echo "| timestamp_utc | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            echo "| TREND-ON prep ssh_exit | ${PREP_TREND_EXIT:-?} |"
            echo "| TREND-ON verdict ssh_exit | ${VERDICT_TREND_EXIT:-?} |"
            echo "| TREND-OFF prep ssh_exit | ${PREP_NOTREND_EXIT:-?} |"
            echo "| TREND-OFF verdict ssh_exit | ${VERDICT_NOTREND_EXIT:-?} |"
            echo "| RISK-MANAGED-BETA prep ssh_exit | ${PREP_RMBETA_EXIT:-?} |"
            echo "| RISK-MANAGED-BETA verdict ssh_exit | ${VERDICT_RMBETA_EXIT:-?} |"
            echo "| MULTI-ASSET-TREND prep ssh_exit | ${PREP_MULTIASSET_EXIT:-?} |"
            echo "| MULTI-ASSET-TREND verdict ssh_exit | ${VERDICT_MULTIASSET_EXIT:-?} |"
            echo "| GLOBAL-TREND prep ssh_exit | ${PREP_GLOBAL_EXIT:-?} |"
            echo "| GLOBAL-TREND verdict ssh_exit | ${VERDICT_GLOBAL_EXIT:-?} |"
            echo "| GLOBAL-TREND-FIXED prep ssh_exit | ${PREP_GLOBALFIXED_EXIT:-?} |"
            echo "| GLOBAL-TREND-FIXED verdict ssh_exit | ${VERDICT_GLOBALFIXED_EXIT:-?} |"
            echo "| GLOBAL-TREND-WIDE prep ssh_exit | ${PREP_WIDE_EXIT:-?} |"
            echo "| GLOBAL-TREND-WIDE verdict ssh_exit | ${VERDICT_WIDE_EXIT:-?} |"
            echo ""
            cat /tmp/leaderboard.md 2>/dev/null || echo '(leaderboard unavailable)'
            echo ""
            echo "## 🧾 리더보드 결정 JSON (기계 판독 단일 증거)"
            echo ""
            echo "> 아래 JSON 은 위 리더보드와 같은 순수 코어 출력이다. 재지정·감시 루프는"
            echo "> 가능하면 이 기계 판독 증거를 우선 소비해야 한다. 특히 known_count,"
            echo "> unknown_count, observation_health 로 후보 관측 품질을 분리해 본다."
            echo ""
            echo '```json'
            cat /tmp/leaderboard.json 2>/dev/null || echo '{}'
            echo '```'
            echo ""
            echo "## 🚦 Halt 깃발 상태 (읽기 전용 진단)"
            echo ""
            echo "> data/halt.flag 는 라이브 워커·라이브 캐너리의 킬스위치(스펙 014 서킷 브레이커"
            echo "> ·정합성 불일치가 자동 설정). 페이퍼 forward 트랙은 트랙별 전용 깃발"
            echo "> (data/forward_*.halt.flag)로 격리되어 라이브 깃발에 막히지 않는다. 라이브"
            echo "> 깃발이 서 있으면 무장 후 실주문이 거부되므로, 운영자는 아래 사유를 확인하고"
            echo "> 서버에서 'auto-invest resume' 으로 해제를 결정한다(자동 해제 안 함 — 안전 자세)."
            echo ""
            echo '```'
            cat /tmp/halt_status.txt 2>/dev/null || echo '(halt status unavailable)'
            echo '```'
            echo ""
            echo "## 🔭 일일 전략 모니터 (스펙 046 — 지속 감시, 돈 0 이동)"
            echo ""
            echo "> 검증된 스펙(042~045)을 합친 대시보드: ① 엣지 최근 유효성 ② 분산 가정 신뢰도"
            echo "> ③ 낙폭 예산별 레버리지 복리 권고(최근 25년) ④ 오늘 추세 신호. 라이브 레버리지/"
            echo "> 무장은 여전히 운영자 게이트(헌법 X.4) — 이건 감시 보고이지 거래 변경이 아니다."
            echo ""
            echo '```'
            cat /tmp/monitor.txt 2>/dev/null || echo '(monitor unavailable)'
            echo '```'
            echo ""
            echo "## 🧭 판정 — 추세 필터 ON (drawdown 방어 오버레이)"
            echo ""
            echo "> EDGE_CONFIRMED 만이 운영자 라이브 게이트(헌법 X.4)에 올릴 증거(자동 배포 아님)."
            echo "> INSUFFICIENT_DATA 면 NAV 관측이 더 쌓여야 한다(≈20 거래일) — 정상."
            echo ""
            echo '```json'
            cat /tmp/verdict_trend.json 2>/dev/null || echo '{}'
            echo '```'
            echo ""
            echo "## 🧭 판정 — 추세 필터 OFF (대조군)"
            echo ""
            echo '```json'
            cat /tmp/verdict_notrend.json 2>/dev/null || echo '{}'
            echo '```'
            echo ""
            echo "> 두 판정을 나란히 비교: ON 의 max_drawdown_pct·sharpe·excess 가 OFF 보다"
            echo "> 나으면 추세 필터가 *실제로* 도움이 된다는 격리된 증거다."
            echo ""
            echo "## 🛡️ 판정 — 위험관리 베타 (추세 게이트 광범위 베타, 스펙 042)"
            echo ""
            echo "> SPY·QQQ 를 10개월 추세 위일 때만 보유(아래면 현금). 종목 선택이 아니라 베타의"
            echo "> 자본 방어. 우리 KIS 체결로 forward 실적을 쌓아 *확신을 번다*(운영자 2026-06-05)."
            echo "> INSUFFICIENT_DATA 면 NAV 관측이 더 쌓여야 함(정상). 200일 미만이면 추세 미확정 →"
            echo "> on_insufficient=cash 라 현금 보유(보수적). 라이브 전환은 운영자 게이트(헌법 X.4)."
            echo ""
            echo '```json'
            cat /tmp/verdict_rmbeta.json 2>/dev/null || echo '{}'
            echo '```'
            echo ""
            echo "## 🌐 판정 — 멀티에셋 분산 추세 (비상관 자산 합성, 스펙 043)"
            echo ""
            echo "> 주식(SPY) + 채권(IEF) 을 각자 추세 위일 때만 보유. ARM C(둘 다 주식)와 달리"
            echo "> *비상관 자산*을 합쳐 분산 이득을 노린다(스펙 043: 단일 주식 추세 샤프 1.18~1.43"
            echo "> → 분산 추세 1.58~1.81, 낙폭 절반, Shiller 1871~ 검증). INSUFFICIENT_DATA 면"
            echo "> NAV 관측이 더 쌓여야 함(정상). 라이브 전환은 운영자 게이트(헌법 X.4)."
            echo ""
            echo '```json'
            cat /tmp/verdict_multiasset.json 2>/dev/null || echo '{}'
            echo '```'
            echo ""
            echo "## 🪙 판정 — 글로벌 분산 추세 (주식+채권+금, 역변동성, 스펙 047)"
            echo ""
            echo "> ARM D(주식+채권 2자산)에 *세 번째 비상관 자산(금, GLD)* 을 더한 3자산 GTAA."
            echo "> 금은 주식·채권 둘 다와 비상관 — 특히 주식·채권 상관이 양수로 가는 인플레"
            echo "> regime(일일 모니터의 DIVERSIFICATION_WEAKENED 경고)의 구조적 헤지다. 금은"
            echo "> 변동성 큰 자산이라 *역변동성(리스크 패리티)* 으로 사이징해 분산 이득만 취하고"
            echo "> 변동성은 안 들여온다(스펙 047: 균등가중은 낙폭 악화, 역변동성은 모든 구간 낙폭"
