name: Deploy on merge to main

# 각 단계(PR)가 main 에 머지되면 즉시 서버에 배포한다 (운영자 자율 수행 요구).
# 새 배포 로직을 만들지 않는다 — 인스턴스에 이미 설치된, spec 006 안전 단계를
# 전부 갖춘 oneshot 서비스 `auto-invest-deploy.service` 를 SSH 로 즉시 트리거할
# 뿐이다. 같은 서비스를 `auto-invest-deploy.timer` 가 30분마다(장중 제외) 돌리므로,
# 이 워크플로우가 실패하거나 머지가 장중에 일어나도 타이머가 안전망으로 받는다.
#
# 배포 *전에* 서버에 설치된 forced-command gateway 의 `sync-units` 고정 명령을
# 호출해 systemd 유닛(.service/.timer) + sudoers 드롭인을 설치한다. GitHub runner 는
# 더 이상 임의 원격 셸이나 `sudo bash -s` 를 밀어 넣지 않는다. 서버 쪽 gateway 설치는
# deploy/repair-ssh-boundary.sh 가 담당한다.
#
# 안전 속성 (자세한 설계는 deploy/AUTO-DEPLOY.md):
#   - 워커는 dry-run 모드 — 배포는 코드 교체+재시작이며 실주문을 내지 않는다.
#     실거래 전환(AUTO_INVEST_MODE=live)은 이 워크플로우가 건드리지 않는다.
#   - 장중에는 (워커 교체) 배포 안 됨: market_hours_guard(헌법 VIII.A)가 거부하면
#     "장중 연기"로 끝내고 타이머가 장 마감 후 올린다.
#   - 실패 시 직전 good SHA 로 자동 롤백(health_check ≥90초).

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'specs/**'
      - '.verify/**'
      - '.trigger/**'
      - 'automation/**'
  workflow_dispatch:
    inputs:
      owner_emergency:
        description: "현재 main 한 커밋의 단회 장중 긴급 배포"
        required: true
        default: false
        type: boolean
      expected_sha:
        description: "긴급 배포할 정확한 40자리 main SHA"
        required: false
        type: string
      confirmation:
        description: "긴급 배포 시 OWNER_EMERGENCY_LIVE_DEPLOY 입력"
        required: false
        type: string
      reason:
        description: "긴급 배포 이유(감사에는 SHA-256만 저장)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # 배포는 한 번에 하나만. 연속 머지가 나면 마지막 것까지 순차 반영.
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate one-shot registered-owner emergency request
        id: owner_emergency
        if: github.event_name == 'workflow_dispatch' && inputs.owner_emergency
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          REGISTERED_SYSTEM_OWNER: masonoh-kidsnote
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || {
            echo "Owner emergency deploy is main-only." >&2
            exit 2
          }
          [[ "${ACTOR}" == "${OWNER}" \
              || "${ACTOR}" == "${REGISTERED_SYSTEM_OWNER}" ]] || {
            echo "Only a constitution-registered owner may authorize an emergency deploy." >&2
            exit 2
          }
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ \
              && "${EXPECTED_SHA}" == "${GITHUB_SHA}" ]] || {
            echo "expected_sha must exactly match the workflow main commit." >&2
            exit 2
          }
          [[ "${CONFIRMATION}" == "OWNER_EMERGENCY_LIVE_DEPLOY" ]] || {
            echo "Emergency confirmation phrase does not match." >&2
            exit 2
          }
          [[ "${#REASON}" -ge 12 && "${#REASON}" -le 500 ]] || {
            echo "Emergency reason must contain 12-500 characters." >&2
            exit 2
          }
          issued_at="$(date +%s)"
          expires_at="$((issued_at + 600))"
          reason_sha256="$(printf '%s' "${REASON}" | sha256sum | awk '{print $1}')"
          {
            echo "approved=true"
            echo "issued_at=${issued_at}"
            echo "expires_at=${expires_at}"
            echo "reason_sha256=${reason_sha256}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install SSH key
        if: github.event_name != 'workflow_dispatch' || inputs.owner_emergency != true || steps.owner_emergency.outcome == 'success'
        env:
          KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VULTR_SSH_KNOWN_HOSTS }}
          SSH_USER: ${{ secrets.VULTR_SSH_USER }}
        run: |
          VULTR_SSH_PRIVATE_KEY="${KEY:-}" \
          VULTR_SSH_KNOWN_HOSTS="${KNOWN_HOSTS:-}" \
          VULTR_SSH_USER="${SSH_USER:-}" \
          ./scripts/ci_secure_ssh.sh

      - name: Sync systemd units + sudoers (install/refresh + enable timers)
        id: units
        if: github.event_name != 'workflow_dispatch' || inputs.owner_emergency != true || steps.owner_emergency.outcome == 'success'
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
        run: |
          set +e
          port="${PORT:-22}"
          # 배포 *앞*에서 실행한다(중요): 서버 gateway 의 고정 `sync-units` 명령만 호출한다.
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=15 \
              -p "${port}" \
              -i ~/.ssh/id_ed25519 \
              "${USER}@${HOST}" \
              "sync-units" \
              > /tmp/units_sync.txt 2>&1
          units_exit=$?
          cat /tmp/units_sync.txt
          echo "units_exit=${units_exit}" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH (trigger off-hours-guarded oneshot)
        id: deploy
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.owner_emergency != true || steps.owner_emergency.outcome == 'success')
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
        run: |
          set +e
          port="${PORT:-22}"
          # oneshot 서비스라 start-deploy 는 완료까지 블록하고 배포 결과 코드를
          # 그대로 돌려준다. 이어 journal 마지막 120줄을 수집한다.
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=15 \
              -p "${port}" \
              -i ~/.ssh/id_ed25519 \
              "${USER}@${HOST}" \
              "start-deploy" \
              > /tmp/deploy_start.txt 2>&1
          start_exit=$?
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=15 \
              -p "${port}" \
              -i ~/.ssh/id_ed25519 \
              "${USER}@${HOST}" \
              "deploy-journal" \
              > /tmp/deploy_journal.txt 2>&1
          cat /tmp/deploy_start.txt
          cat /tmp/deploy_journal.txt
          echo "start_exit=${start_exit}" >> "$GITHUB_OUTPUT"

      - name: Execute one-shot owner emergency live deploy
        id: emergency_deploy
        if: always() && github.event_name == 'workflow_dispatch' && inputs.owner_emergency && steps.owner_emergency.outputs.approved == 'true'
        env:
          HOST: ${{ secrets.VULTR_SSH_HOST }}
          USER: ${{ secrets.VULTR_SSH_USER }}
          PORT: ${{ secrets.VULTR_SSH_PORT }}
          START_EXIT: ${{ steps.deploy.outputs.start_exit }}
          ISSUED_AT: ${{ steps.owner_emergency.outputs.issued_at }}
          EXPIRES_AT: ${{ steps.owner_emergency.outputs.expires_at }}
          REASON_SHA256: ${{ steps.owner_emergency.outputs.reason_sha256 }}
        run: |
          set +e
          if [[ "${START_EXIT}" != "0" ]] && ! grep -qiE 'market is open|market_hours_guard' \
              /tmp/deploy_journal.txt 2>/dev/null; then
            echo "Normal deploy failed for a non-market reason; emergency path refused." >&2
            echo "emergency_exit=2" >> "$GITHUB_OUTPUT"
            echo "emergency_used=false" >> "$GITHUB_OUTPUT"
            exit 2
          fi
          port="${PORT:-22}"
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=15 \
              -p "${port}" \
              -i ~/.ssh/id_ed25519 \
              "${USER}@${HOST}" \
              "emergency-deploy ${GITHUB_SHA} ${GITHUB_RUN_ID} ${GITHUB_ACTOR} ${ISSUED_AT} ${EXPIRES_AT} ${REASON_SHA256}" \
              > /tmp/emergency_deploy.txt 2>&1
          emergency_exit=$?
          cat /tmp/emergency_deploy.txt
          echo "emergency_exit=${emergency_exit}" >> "$GITHUB_OUTPUT"
          if grep -q '^DEPLOY_EMERGENCY_NOT_NEEDED ' /tmp/emergency_deploy.txt; then
            echo "emergency_used=false" >> "$GITHUB_OUTPUT"
          else
            echo "emergency_used=true" >> "$GITHUB_OUTPUT"
          fi
          exit "${emergency_exit}"

      - name: Summarise result
        if: always()
        env:
          START_EXIT: ${{ steps.deploy.outputs.start_exit }}
          UNITS_EXIT: ${{ steps.units.outputs.units_exit }}
          OWNER_EMERGENCY: ${{ github.event_name == 'workflow_dispatch' && inputs.owner_emergency }}
          EMERGENCY_EXIT: ${{ steps.emergency_deploy.outputs.emergency_exit }}
          EMERGENCY_USED: ${{ steps.emergency_deploy.outputs.emergency_used }}
        run: |
          journal="$(cat /tmp/deploy_journal.txt 2>/dev/null || echo '(no journal captured)')"
          units_log="$(cat /tmp/units_sync.txt 2>/dev/null || echo '(no unit-sync output captured)')"
          # 장중 연기는 실패가 아니다 — market_hours_guard 거부 신호를 찾는다.
          emergency_log="$(cat /tmp/emergency_deploy.txt 2>/dev/null || echo '(emergency path not used)')"
          if [[ "${OWNER_EMERGENCY}" == "true" \
              && "${EMERGENCY_USED}" == "true" \
              && "${EMERGENCY_EXIT}" == "0" ]]; then
              status="✅ 오너 단회 장중 긴급 배포 성공"
              effective_exit=0
          elif [[ "${OWNER_EMERGENCY}" == "true" \
              && "${EMERGENCY_EXIT:-2}" != "0" ]]; then
              status="❌ 오너 단회 장중 긴급 배포 실패 — 주문 잠금 상태를 아래 로그에서 확인"
              effective_exit=1
          elif grep -qiE 'market is open|market_hours_guard' /tmp/deploy_journal.txt 2>/dev/null; then
              status="⏸ 장중 연기 — 타이머가 장 마감 후 자동 재배포"
              effective_exit=0
          elif [[ "${START_EXIT}" == "0" ]]; then
              status="✅ 배포 성공 (워커 최신 main 으로 교체)"
              effective_exit=0
          else
              status="❌ 배포 실패 (exit ${START_EXIT}) — 워커는 직전 good SHA 유지(롤백)"
              effective_exit=1
          fi
          # 유닛 동기화는 배포와 독립 — 실패해도 코드 배포 결과를 가리지 않는다(별도 보고).
          if [[ "${UNITS_EXIT}" == "0" ]]; then
              units_status="✅ systemd 유닛 동기화 + 타이머 활성 완료"
          else
              units_status="⚠ 유닛 동기화 실패 (exit ${UNITS_EXIT}) — sudo 권한 범위 확인 필요(아래 로그). 코드 배포와 무관."
          fi
          {
              echo "## Deploy on merge — 결과"
              echo ""
              echo "- 배포 상태: ${status}"
              echo "- systemctl start exit: \`${START_EXIT}\`"
              echo "- 유닛 동기화: ${units_status}"
              echo "- commit: \`${GITHUB_SHA}\`"
              echo ""
              echo "<details><summary>auto-invest-deploy.service journal (last 120)</summary>"
              echo ""
              echo '```'
              echo "${journal}"
              echo '```'
              echo "</details>"
              echo ""
              echo "<details><summary>sync-units.sh 출력</summary>"
              echo ""
              echo '```'
              echo "${units_log}"
              echo '```'
              echo "</details>"
              echo ""
              echo "<details><summary>owner emergency deploy 출력</summary>"
              echo ""
              echo '```'
              echo "${emergency_log}"
              echo '```'
              echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${effective_exit}"
