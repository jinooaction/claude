name: Autonomous work execution loop (자율 작업 실행)

# 스펙 077 — 기존 자율 성장·승격·자본 준비도 sidecar를 읽어 다음 Codex 작업 패킷을
# 자동 발행한다. 스펙 079부터 현재 체크아웃의 완료 스펙도 읽어 이미 출시된 후보를
# 다시 선택하지 않는다.
#
# 안전: 읽기 전용. 이 워크플로는 automation sidecar 브랜치들을 fetch/read하고 자기
# sidecar 브랜치만 발행한다. 실제 주문, 계좌 자본 배분, live 설정 변경, 코드 자동 수정,
# PR 자동 생성, 머지는 수행하지 않는다.

on:
  schedule:
    # 매일 09:10 UTC — evolution/promotion/factory/result/capital-readiness 이후 종합.
    - cron: "10 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/auto_invest/analytics/autonomous_work_execution.py'
      - 'src/auto_invest/analytics/released_work.py'
      - 'src/auto_invest/analytics/pipeline_liveness.py'
      - 'scripts/autonomous_work_execution_probe.py'
      - 'scripts/released_work_probe.py'
      - '.github/workflows/autonomous-work-execution.yml'
      - 'specs/**/tasks.md'
      - 'specs/**/contracts/**'

permissions:
  contents: write

concurrency:
  group: autonomous-work-execution
  cancel-in-progress: false

jobs:
  select-work:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Collect source sidecars
        run: |
          set -uo pipefail
          mkdir -p /tmp/autonomous_work_sidecars
          git fetch --depth=1 origin \
            '+refs/heads/automation/*:refs/remotes/origin/automation/*' || true
          uv run python scripts/autonomous_work_execution_probe.py --manifest \
            > /tmp/autonomous_work_manifest.tsv
          while IFS=$'\t' read -r key branch filename; do
            [[ -z "${key}" ]] && continue
            if git show "origin/${branch}:${filename}" \
                 > "/tmp/autonomous_work_sidecars/${key}.md" 2>/dev/null; then
              echo "collected ${key}: ${branch}:${filename}"
            else
              rm -f "/tmp/autonomous_work_sidecars/${key}.md"
              echo "missing ${key}: ${branch}:${filename}"
            fi
          done < /tmp/autonomous_work_manifest.tsv

      - name: Select next work packet
        run: |
          set -uo pipefail
          uv run python scripts/autonomous_work_execution_probe.py \
            --evidence-dir /tmp/autonomous_work_sidecars \
            --repo-root "$GITHUB_WORKSPACE" \
            --run-id "${GITHUB_RUN_ID}" \
            --commit "${GITHUB_SHA}" \
            --json-out /tmp/autonomous_work_execution.json \
            --summary-out /tmp/autonomous_work_execution.md
          cat /tmp/autonomous_work_execution.md

      - name: Publish sidecar
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          BRANCH=automation/autonomous-work-execution-last-run
          tmpdir=$(mktemp -d)

          {
            if [[ -f /tmp/autonomous_work_execution.md ]]; then
              cat /tmp/autonomous_work_execution.md
            else
              echo "# 자율 작업 실행 루프 — 보고 생성 실패"
              echo ""
              echo "Select step failed before autonomous_work_execution.md was written."
              echo ""
              echo "읽기 전용 실행입니다. 주문, 자본, live 설정, 코드/PR/머지는 변경하지 않았습니다."
            fi
            echo ""
            echo "## 메타데이터"
            echo ""
            echo "| 항목 | 값 |"
            echo "|------|-----|"
            echo "| run_id | ${GITHUB_RUN_ID} |"
            echo "| run_url | https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
            echo "| commit | ${GITHUB_SHA} |"
            echo "| trigger | ${GITHUB_EVENT_NAME} |"
            echo "| timestamp_utc | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            echo ""
            echo "## 결정 JSON"
            echo ""
            echo '```json'
            cat /tmp/autonomous_work_execution.json 2>/dev/null || echo "{}"
            echo '```'
          } > "${tmpdir}/LAST_RUN.md"
          cp /tmp/autonomous_work_execution.json "${tmpdir}/autonomous_work_execution.json" \
            2>/dev/null || echo '{}' > "${tmpdir}/autonomous_work_execution.json"

          cd "${tmpdir}"
          git init -q
          git config user.name "autonomous-work-execution-bot"
          git config user.email "autonomous-work-execution-bot@noreply.github.com"
          git checkout --orphan publish -q
          git add LAST_RUN.md autonomous_work_execution.json
          git commit -q -m "autonomous-work-execution run ${GITHUB_RUN_ID} @ ${GITHUB_SHA:0:7}"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "publish:${BRANCH}"
          echo "Published to ${BRANCH}."
          echo "Read: git fetch origin ${BRANCH} && git show origin/${BRANCH}:LAST_RUN.md"
