# 자율 전략 재지정 캐너리(스펙 055 ④ 게이트) 합격 밴드 — 헌법 X.5.
#
# 룰 변경용 canary_bands.toml(낙폭 2~3%) 과 별개다. 그 밴드는 작은 룰셋 변경을 30~45 거래일
# 백테스트로 검증하는 용도라 낙폭 임계가 매우 타이트하다. 재지정 챔피언은 *포트폴리오 전략*
# (트렌드 3자산 등)이라 최근 윈도우 낙폭이 그보다 클 수 있어 전략에 맞는 밴드가 필요하다.
#
# 낙폭 임계는 **자본 사다리 강등선(낙폭 예산 20%/2 = 10%)** 에 맞췄다 — 최근 윈도우 낙폭이
# 강등선을 넘는 챔피언은 재지정해도 도착 즉시 강등되므로(스펙 050), 재지정 전에 캐너리가 거른다.
#
# 고정 제약(로더가 강제, 운영자 config 수정 불가 — 완화는 스펙 개정):
#   - risk_gate_violations = 0  : 합성 충격(실제 과거 급락 윈도우) 하 K1 게이트 거부 0건.
#   - audit_integrity_failures = 0 : 윈도우 데이터 결손 0건.
#   - L3 는 trading_days >= 45 필요(FR-C02).
#
# 안전: 캐너리 PASS 는 재지정 *사전 선별*일 뿐, 실제 자본은 재지정 후 자본 사다리(rung 0 →
# forward 재검증 → 25%·50%·100%)가 별도로 게이트한다. 캐너리는 심층 방어의 한 층이다.

[L3]
trading_days = 45                       # FR-C02 최소(재지정은 큰 변경이라 가장 엄격한 윈도우)
pnl_drawdown_pct = 10.0                 # 자본 사다리 강등선(예산 20%/2) — 도착 즉시 강등될 챔피언 거부
risk_gate_violations = 0                # 고정 — 충격 하 K1 캡 위반 0건
audit_integrity_failures = 0            # 고정 — 데이터 품질 이슈 0건
latency_p95_regression_pct = 15.0       # v1 미사용(0 으로 계산 — 자동 통과)
llm_cost_regression_pct = 7.5           # v1 미사용(0 으로 계산 — 자동 통과)
